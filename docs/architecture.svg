<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 676" width="600" height="676" role="img" aria-labelledby="t d">
<title id="t">shapekit system overview</title>
<desc id="d">Stellar inputs feed the generator and the corpus. The corpus feeds SDK conformance and the indexer replay harness. Their results and indexerlint go to the findings record, which the shapekit.org dashboard shows.</desc>
