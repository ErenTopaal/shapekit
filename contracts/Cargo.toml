[workspace]
resolver = "3"
members = ["auth_tree", "delegating_account", "echo", "exec_ref", "factory"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
soroban-sdk = "29.0.1"

# size and determinism settings from the soroban-sdk examples; panic=abort and
# lto keep the wasm small, codegen-units=1 keeps the output stable
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
