[workspace]
resolver = "3"
# factory is left out: it needs ContractExecutable and deploy_contract,
# which this soroban-sdk does not have
members = ["auth_tree", "echo"]

[workspace.dependencies]
soroban-sdk = "=22.0.11"

# same release profile as contracts/Cargo.toml
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
