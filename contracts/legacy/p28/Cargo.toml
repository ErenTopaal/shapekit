[workspace]
resolver = "3"
members = ["auth_tree", "echo", "factory"]

[workspace.dependencies]
soroban-sdk = "=28.0.0"

# same release profile as contracts/Cargo.toml
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
