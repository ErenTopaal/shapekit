[[finding]]
id = "NET-STRKEY"
title = "StrKey decoders accept claimable balance and signed payload strkeys SEP-23 refuses, and crash on a lone prefix letter"
component = "stellar-dotnet-sdk"
severity = "divergence"
status = "draft"
draft = "candidate/findings/issues/dotnet-cap23.claimable-balances.synth-strkey-b-invalid.md"
cause = "DecodeClaimableBalanceId checks only the version byte and checksum (StellarDotnetSdk/StrKey.cs L447-L450), so a balance id with sub-version 1 decodes; DecodeSignedPayload reads the payload with the XDR decoder and does not check that it consumed the whole strkey (L405-L420), so a payload one byte long or a length prefix shorter than the bytes decodes; DecodeVersionByte indexes the first decoded byte without a length check (L311-L314) and throws IndexOutOfRangeException for \"M\"."

