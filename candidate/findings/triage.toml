cause = "AssetTypeCreditAlphaNum4.CompareTo and AssetTypeCreditAlphaNum12.CompareTo compare issuers with string.Compare over the G strkey text (StellarDotnetSdk/Assets/AssetTypeCreditAlphaNum4.cs L57-L72), where core compares the raw key bytes; the base32 alphabet does not keep byte order. LiquidityPoolConstantProductParameters refuses pairs in the network's order (\"Asset A must be < Asset B\"), takes pairs in the wrong one, and Transaction.FromEnvelopeXdr refuses applied change trust operations on such a pool. This is Beans-BV/dotnet-stellar-sdk#257, open; js-stellar-sdk#1766 fixed the same class."

