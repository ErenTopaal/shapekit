[[finding]]
id = "KMP-UTF8"
title = "XDR strings are decoded to Kotlin strings, so memos, symbols and strings that are not UTF-8 change"
component = "kmp-stellar-sdk"
severity = "data-loss"
status = "filed"
link = "https://github.com/Soneso/kmp-stellar-sdk/issues/172"
draft = "candidate/findings/issues/kmp-classic.memo-bytes.p30-memo-truncated-sequence-28.md"
related = ["https://github.com/stellar/js-stellar-sdk/issues/1823"]
cause = "XdrReader.readString returns bytes.decodeToString() on every target (jvmMain XdrReader.jvm.kt, jsMain XdrReader.js.kt and nativeMain XdrReader.native.kt, L59-L69 at 1.18.0), which replaces bytes that are not UTF-8, and the writer encodes the string back as UTF-8; text memos, ScString, ScSymbol and function names the network applied lose their bytes, decode and encode do not round trip, the transaction hash differs, and the transaction object refuses a memo whose replacement characters take more than 28 bytes (Memo.kt L101). PR #57 and docs/sep/sep-51.md L448 document String members as lossy, and PR #61 kept SCString and the SCV_STRING and SCV_SYMBOL arms as String. js-stellar-sdk#1823 is the same class."

