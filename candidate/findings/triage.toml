[[finding]]
id = "CLI-ALLOC"
title = "stellar xdr decode allocates what a length prefix asks before reading it, so 12 bytes make it abort"
component = "stellar-cli"
severity = "robustness"
status = "draft"
draft = "candidate/findings/issues/stellar-cli-soroban.scval-shapes.synth-bytes-length-overrun.md"
cause = "stellar xdr decode is stellar-xdr's cli (stellar-xdr 30.0.0 src/cli/decode.rs L78-L100), which reads every input under Limits::none(): no length limit, so a variable-length opaque whose prefix is 0xffffffff is allocated in full before its bytes are read. Under a 4 GiB address space the process aborts (memory allocation of 4294967295 bytes failed, SIGABRT); without a limit it allocates 4 GiB for a 12-byte input before refusing it."

[[finding.conformance]]
