[[finding]]
id = "NET-UTF8"
title = "memo text and SDK ScString and ScSymbol values are decoded to .NET strings, so bytes that are not UTF-8 change, and so does the transaction hash"
component = "stellar-dotnet-sdk"
severity = "data-loss"
status = "duplicate-of"
reason = "#247 (inline strings, memo text, hash changes) and #246 (SCString, SCSymbol and names at the SDK layer), both 2026-10-01, cover it; commented on #247 with the MemoTooLongException a 28-byte memo with replacement characters causes in FromEnvelopeXdr, and the core golden witnesses"
link = "https://github.com/Beans-BV/dotnet-stellar-sdk/issues/247"
related = ["https://github.com/Beans-BV/dotnet-stellar-sdk/issues/246", "https://github.com/stellar/js-stellar-sdk/issues/1823"]
cause = "On 17.0.0 the XDR typedefs SCString, SCSymbol, String32 and String64 keep the raw bytes (SCString.cs L54), but the text memo is read with XdrDataInputStream.ReadString, Encoding.UTF8.GetString, which replaces bytes that are not UTF-8 (StellarDotnetSdk.Xdr/XdrDataInputStream.cs L88-L91, Memo.cs L72), and the SDK's SCString and SCSymbol objects hold a .NET string (Soroban/SCVal.cs L1586, L1656). So memo text loses its bytes in decode and encode, the transaction object hashes other bytes for memos and ScVal strings and symbols, and a 28-byte memo whose replacement characters take more bytes is refused (MemoTooLongException). js-stellar-sdk#1823 is the same class."

[[finding.conformance]]
sdk = "dotnet"
entries = [
  "cap71.credentials.golden-e25799a2e2e9eea2-17",
  "classic.memo-bytes.p30-memo-above-max-code-point",
  "classic.memo-bytes.p30-memo-ff",
