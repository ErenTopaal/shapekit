severity = "divergence"
status = "draft"
draft = "candidate/findings/issues/php-cap27.muxed-accounts.p30-tx-source-and-payment-destination-id-2p64-1.md"
cause = "uint64 fields are php ints, which hold 2^64-1 as -1, and XdrJsonHelper::uint64ToString refuses negative ints (Soneso/StellarSDK/Xdr/XdrJsonHelper.php L290-L300), so a muxed id or memo id at or above 2^63 has no XDR-JSON. In the other direction XdrSequenceNumber is read as an unsigned BigInteger (Xdr/XdrBuffer.php readBigInteger64), so a bump_to of -1 renders as \"18446744073709551615\" where the schema's int64 says -1. Fixed on main by #229 (2026-11-18, closing #228), not in a release yet."

