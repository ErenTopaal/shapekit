# findings of the candidate lane: failures new runs report that are triaged and drafted but not
# filed upstream yet. the format is findings/triage.toml's; the inputs live under
# candidate/findings/inputs/, so these drafts never count against the main findings check.
# check: shapekit findings check --triage candidate/findings/triage.toml --out candidate/findings --allow-draft

schema = 1

[inputs]
manifest = "corpus/manifest.json"
dir = "candidate/findings/inputs"
# the stellar-etl run is imported here and, from the same run output, as a main input of
# findings/triage.toml, whose check counts the failures as held by the ETL findings below
harness = ["candidate/findings/inputs/harness-stellar-etl-2b24ec89.json"]
matrices = ["candidate/findings/inputs/conformance-go-textual-offer-id.json", "candidate/findings/inputs/conformance-dart.json", "candidate/findings/inputs/conformance-php.json", "candidate/findings/inputs/conformance-dotnet.json", "candidate/findings/inputs/conformance-kmp.json", "candidate/findings/inputs/conformance-stellar-cli.json"]

[[inputs.import]]
kind = "harness"
from = "target/findings/stellar-etl-2b24ec89/harness-report.json"
to = "candidate/findings/inputs/harness-stellar-etl-2b24ec89.json"
command = "shapekit harness run --network both --adapter \"adapters/bin/etl-adapter --commit 2b24ec89ddce7fc0beb7795de982c93e6895eaf3 --cpus 2\" --out target/findings/stellar-etl-2b24ec89"

[[inputs.import]]
kind = "conformance"
from = "target/conformance/go-textual-offer-id/divergence-matrix.json"
to = "candidate/findings/inputs/conformance-go-textual-offer-id.json"
command = "shapekit conformance run --sdk go --all-versions --entry cap03.offer-liabilities.synth-textual-offer-id-noncanonical --out target/conformance/go-textual-offer-id"

[targets.stellar-etl]
repo = "stellar/stellar-etl"
adapter = "adapters/bin/etl-adapter --commit {version}"

[[finding]]
id = "ETL-META-V4"
title = "stellar-etl's token transfer export halts on ledgers whose transaction meta is below version 4"
component = "stellar-etl"
severity = "robustness"
status = "wont-fix"
reason = "intended for the data stellar-etl reads: the public ledger lake holds history re-emitted by a current core, so every ledger there carries TransactionMeta v4, which unified events need. Only locally recorded chains below protocol 23 hold v2 or v3 meta"
cause = "export_token_transfer builds the processor with NewEventsProcessorForUnifiedEvents (internal/transform/token_transfer.go L15 at 2b24ec89), which reads the CAP-67 unified events stream and returns \"expected version 4 got N\" for any other meta version (go-stellar-sdk processors/token_transfer/token_transfer_processor.go L474-L478 at e31e3b146d00, the pseudo-version stellar-etl pins). The command exits 1, the adapter retries it, and the harness stops the chain at its first ledger with a transaction: every entry of the five corpus chains recorded at protocols 9 to 22 (meta v2 or v3), and of the 20 explorer chains below protocol 23 recorded with classic events and their backfill off, is not evaluated, on both networks."

[[finding.harness]]
target = "stellar-etl"
verdicts = ["not-evaluated"]
entries = [
  "cap03.offer-liabilities.p17-*",
  "cap26.inflation.p11-*",
  "cap67.unified-events.p22-*",
  "classic.failed-tx.p9-*",
  "classic.failed-tx.p12-*",
  # explorer chains below protocol 23 recorded with classic events and their backfill off, so
  # core wrote the meta of their day (v2 or v3)
  "explore.witnesses.f62c-r0016-*",
  "explore.witnesses.f62c-r0017-*",
  "explore.witnesses.f62d-r0001-*",
  "explore.witnesses.f62d-r0002-*",
  "explore.witnesses.f63-p21-r0001-*",
  "explore.witnesses.g1-r0016-*",
  "explore.witnesses.g2-r0001-*",
  "explore.witnesses.g2-r0015-*",
  "explore.witnesses.g2-r0017-*",
  "explore.witnesses.g2-r0019-*",
  "explore.witnesses.g2-r0020-*",
  "explore.witnesses.g2-r0023-*",
  "explore.witnesses.g2-r0027-*",
  "explore.witnesses.g2-r0030-*",
  "explore.witnesses.g2-r0031-*",
  "explore.witnesses.g2-r0033-*",
  "explore.witnesses.g2-r0036-*",
  "explore.witnesses.g2-r0040-*",
  "explore.witnesses.g2-r0041-*",
  "explore.witnesses.g2-r0042-*",
]

[[finding]]
id = "ETL-1"
title = "question: the effects table has no trustline_created for a trustline a Stellar asset contract trust() call opens"
component = "stellar-etl"
severity = "data-loss"
status = "draft"
draft = "candidate/findings/issues/stellar-etl-E1.md"
cause = "transformEffects derives the effects of an InvokeHostFunction operation only from Stellar asset contract events (addInvokeHostFunctionEffects, internal/transform/effects.go L1326-L1440 at 2b24ec89), which turn transfer, mint, clawback and burn into credit and debit effects. A trustline the contract's trust() function opens (CAP-73) changes the ledger without such an event, so it gets no trustline_created effect, while a ChangeTrust operation that opens the same trustline does (addChangeTrustEffects, L647-L705). The source does not say whether this is intended."

[[finding.harness]]
target = "stellar-etl"
facts = ["trustline-created"]
problems = ["dropped"]

[[finding]]
id = "ETL-2"
title = "question: the effects table has no account_created for an account a Stellar asset contract transfer creates"
component = "stellar-etl"
severity = "data-loss"
status = "draft"
draft = "candidate/findings/issues/stellar-etl-E2.md"
cause = "An XLM transfer through the native asset contract to an account that does not exist creates it (CAP-73). transformEffects writes account_debited and account_credited for the transfer event (addInvokeHostFunctionEffects, internal/transform/effects.go L1326-L1440 at 2b24ec89) but account_created only for a CreateAccount operation (addAccountCreatedEffects, L411-L437), so the new account has no account_created effect. The source does not say whether this is intended."

[[finding.harness]]
target = "stellar-etl"
facts = ["account-created"]
problems = ["dropped"]

[[finding]]
id = "ETL-3"
title = "question: the effects table has no signer_removed for a pre-auth signer core removes when its transaction applies"
component = "stellar-etl"
severity = "data-loss"
status = "draft"
draft = "candidate/findings/issues/stellar-etl-E3.md"
cause = "Core removes a pre-auth signer in txChangesBefore whether its transaction succeeds or fails, and a fee bump's also from the fee source. effects() returns nothing for a failed transaction and builds effects per operation from the operation's own changes (internal/transform/effects.go L60-L176 at 2b24ec89); signer_removed comes only from addSetOptionsEffects (L530-L645). The source does not say whether this is intended."

[[finding.harness]]
target = "stellar-etl"
facts = ["signer-removed"]
problems = ["dropped"]

[[finding]]
id = "ETL-4"
title = "question: the effects table has no trustline_removed for the pool share trustline a revocation removes"
component = "stellar-etl"
severity = "data-loss"
status = "draft"
draft = "candidate/findings/issues/stellar-etl-E4.md"
cause = "A revocation that redeems pool shares removes the owner's pool share trustline; addLiquidityPoolRevokedEffect (internal/transform/effects.go L1152-L1219 at 2b24ec89), called from addSetTrustLineFlagsEffects and addAllowTrustEffects, writes claimable_balance_created and liquidity_pool_revoked from the operation's changes but no trustline_removed for the removed entry. The source does not say whether this is intended."

[[finding.harness]]
target = "stellar-etl"
facts = ["trustline-removed"]
problems = ["dropped"]

[[finding]]
id = "GO-TEXTID"
title = "question: horizon.Offer reads an offer id given as \"+16\" or \"-0\""
component = "go-stellar-sdk"
severity = "divergence"
status = "draft"
draft = "candidate/findings/issues/go-cap03.offer-liabilities.synth-textual-offer-id-noncanonical.md"
related = ["https://github.com/stellar/rs-stellar-xdr/issues/627"]
cause = "horizon.Offer.ID is an int64 tagged `json:\"id,string\"`, so encoding/json unquotes the text and passes it to strconv.ParseInt, which takes an optional sign: \"+16\" reads as 16 and \"-0\" as 0, on every tested version (v0.7.1 to v0.9.0). The field reads horizon's own responses, which carry the canonical text, so the draft is a question. rs-stellar-xdr reads the same two strings the same way (RS-1, rs-stellar-xdr#627); the code is separate, so this is its own finding with RS-1 related."

[[finding.conformance]]
sdk = "go"
entries = ["cap03.offer-liabilities.synth-textual-offer-id-noncanonical"]

