[[finding]]
id = "KMP-UTF8"
title = "XDR strings are decoded to Kotlin strings, so memos, symbols and strings that are not UTF-8 change"
component = "kmp-stellar-sdk"
severity = "data-loss"
status = "draft"
draft = "candidate/findings/issues/kmp-classic.memo-bytes.p30-memo-truncated-sequence-28.md"
related = ["https://github.com/stellar/js-stellar-sdk/issues/1823"]
cause = "XdrReader.readString returns bytes.decodeToString() (jvmMain/com/soneso/stellar/sdk/xdr/XdrReader.jvm.kt L59-L69), which replaces bytes that are not UTF-8, and the writer encodes the string back as UTF-8; text memos, ScString, ScSymbol and function names the network applied lose their bytes, decode and encode do not round trip, XDR-JSON shows other bytes, and the transaction object refuses a memo whose replacement characters take more than 28 bytes (Memo.kt L101). js-stellar-sdk#1823 is the same class."

[[finding.conformance]]
sdk = "kmp"
entries = [
  "classic.memo-bytes.p30-memo-truncated-sequence-28",
  "classic.memo-bytes.synth-memo-text-nonzero-padding",
  "soroban.scval-shapes.p30-errors-auth-crypto-events-meta",
  "soroban.scval-shapes.p30-string-not-utf8-meta",
]

[[finding]]
id = "KMP-BOUNDS"
title = "XDR decoders accept arrays, strings and opaques past their schema maximum and nonzero padding"
