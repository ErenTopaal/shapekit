  "cap40.signed-payload-signer.p30-set-options-empty-payload",
  "cap40.signed-payload-signer.synth-empty-payload-signer",
]

[[finding]]
id = "CLI-STRKEY-TRIM"
title = "stellar strkey decode trims whitespace around its input before decoding it"
component = "stellar-cli"
severity = "robustness"
status = "wont-fix"
reason = "intended: stellar-strkey 1.0.0 src/cli/decode.rs L40-L43 says the trim accepts common trailing whitespace, stellar-cli copies it on purpose (strkey.rs L55, PR #2757, with a test keeping both paths in sync), and the library parser refuses the padded text"
cause = "stellar strkey decode is stellar-strkey's cli (stellar-strkey 1.0.0 src/cli/decode.rs L57), which decodes buf.trim(), so a strkey with surrounding spaces, newlines or carriage returns decodes where SEP-23 and the decoders refuse it. A command line trimming stdin is a convenience; the finding is that the command does not tell a text with them from the strkey."

[[finding.conformance]]
