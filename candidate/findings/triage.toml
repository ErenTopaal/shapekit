# findings of the candidate lane: failures new runs report that are triaged and drafted but not
# filed upstream yet. the format is findings/triage.toml's; the inputs live under
# candidate/findings/inputs/, so these drafts never count against the main findings check.
# check: shapekit findings check --triage candidate/findings/triage.toml --out candidate/findings --allow-draft

schema = 1

[inputs]
manifest = "corpus/manifest.json"
dir = "candidate/findings/inputs"
harness = ["candidate/findings/inputs/harness-stellar-etl-2b24ec89.json"]
matrices = ["candidate/findings/inputs/conformance-go-textual-offer-id.json", "candidate/findings/inputs/conformance-dart.json", "candidate/findings/inputs/conformance-php.json", "candidate/findings/inputs/conformance-dotnet.json"]

[[inputs.import]]
kind = "harness"
from = "target/findings/stellar-etl-2b24ec89/harness-report.json"
to = "candidate/findings/inputs/harness-stellar-etl-2b24ec89.json"
command = "shapekit harness run --chain cap27.muxed-accounts.p30 --chain cap40.signed-payload-signer.p30 --chain cap73.sac-trust.p30 --network testnet --adapter \"adapters/bin/etl-adapter --commit 2b24ec89ddce7fc0beb7795de982c93e6895eaf3 --cpus 2\" --out target/findings/stellar-etl-2b24ec89"

[[inputs.import]]
kind = "conformance"
from = "target/conformance/go-textual-offer-id/divergence-matrix.json"
to = "candidate/findings/inputs/conformance-go-textual-offer-id.json"
command = "shapekit conformance run --sdk go --all-versions --entry cap03.offer-liabilities.synth-textual-offer-id-noncanonical --out target/conformance/go-textual-offer-id"

[targets.stellar-etl]
repo = "stellar/stellar-etl"
adapter = "adapters/bin/etl-adapter --commit {version}"

[[finding]]
id = "ETL-1"
title = "question: the effects table has no trustline_created for a trustline a Stellar asset contract trust() call opens"
component = "stellar-etl"
severity = "data-loss"
status = "draft"
draft = "candidate/findings/issues/stellar-etl-E1.md"
cause = "transformEffects derives the effects of an InvokeHostFunction operation only from Stellar asset contract events (addInvokeHostFunctionEffects, internal/transform/effects.go L1326-L1440 at 2b24ec89), which turn transfer, mint, clawback and burn into credit and debit effects. A trustline the contract's trust() function opens (CAP-73) changes the ledger without such an event, so it gets no trustline_created effect, while a ChangeTrust operation that opens the same trustline does (addChangeTrustEffects, L647-L705). The source does not say whether this is intended."

[[finding.harness]]
target = "stellar-etl"
facts = ["trustline-created"]
problems = ["dropped"]

[[finding]]
id = "ETL-2"
title = "question: the effects table has no account_created for an account a Stellar asset contract transfer creates"
component = "stellar-etl"
severity = "data-loss"
status = "draft"
draft = "candidate/findings/issues/stellar-etl-E2.md"
cause = "An XLM transfer through the native asset contract to an account that does not exist creates it (CAP-73). transformEffects writes account_debited and account_credited for the transfer event (addInvokeHostFunctionEffects, internal/transform/effects.go L1326-L1440 at 2b24ec89) but account_created only for a CreateAccount operation (addAccountCreatedEffects, L411-L437), so the new account has no account_created effect. The source does not say whether this is intended."

[[finding.harness]]
target = "stellar-etl"
facts = ["account-created"]
problems = ["dropped"]

[[finding]]
id = "GO-TEXTID"
title = "question: horizon.Offer reads an offer id given as \"+16\" or \"-0\""
component = "go-stellar-sdk"
severity = "divergence"
status = "draft"
draft = "candidate/findings/issues/go-cap03.offer-liabilities.synth-textual-offer-id-noncanonical.md"
related = ["https://github.com/stellar/rs-stellar-xdr/issues/627"]
cause = "horizon.Offer.ID is an int64 tagged `json:\"id,string\"`, so encoding/json unquotes the text and passes it to strconv.ParseInt, which takes an optional sign: \"+16\" reads as 16 and \"-0\" as 0, on every tested version (v0.7.1 to v0.9.0). The field reads horizon's own responses, which carry the canonical text, so the draft is a question. rs-stellar-xdr reads the same two strings the same way (RS-1, rs-stellar-xdr#627); the code is separate, so this is its own finding with RS-1 related."

[[finding.conformance]]
sdk = "go"
entries = ["cap03.offer-liabilities.synth-textual-offer-id-noncanonical"]

[[inputs.import]]
kind = "conformance"
from = "target/conformance/dart/divergence-matrix.json"
to = "candidate/findings/inputs/conformance-dart.json"
command = "shapekit conformance run --sdk dart --all-versions --out target/conformance/dart"

[[finding]]
id = "DART-BOUNDS"
title = "XDR decoders accept arrays, strings and opaque values longer than the schema allows"
component = "stellar_flutter_sdk"
severity = "robustness"
status = "draft"
draft = "candidate/findings/issues/dart-classic.max-length.synth-tx-101-operations.md"
related = ["https://github.com/stellar/rs-stellar-xdr/security/advisories/GHSA-3xhm-p452-9wjh"]
cause = "The generated decoders read a variable-length array, string or opaque with XdrDataInputStream.readArrayLength or readBytes, which bound the count only by the bytes left in the input (lib/src/xdr/xdr_data_io.dart L380-L394), and never check the maximum the schema declares: XdrSCSpecFunctionV0 reads `outputs<1>` with no bound (lib/src/xdr/xdr_sc_spec_function_v0.dart L63), XdrPreconditionsV2 reads `extraSigners<2>` the same way (lib/src/xdr/xdr_preconditions_v2.dart L102). 3.12.0 reads 101 operations, 21 signatures, a 29-byte text memo, a 33-byte symbol, a 65-byte data value, payload and signature, 6 path assets, 11 claimants, 3 extra signers and 2 spec outputs, all of which stellar-core refuses."

[[finding.conformance]]
sdk = "dart"
entries = [
  "classic.max-length.*",
  "cap21.preconditions.synth-extra-signers-3",
  "cap23.claimable-balances.synth-claimants-11",
  "cap40.signed-payload-signer.synth-payload-65-bytes",
  "soroban.scval-shapes.synth-symbol-33-bytes",
  "soroban.invoke-basics.synth-ghsa-3xhm-spec-outputs-2",
]

[[finding]]
id = "DART-DEPTH"
title = "XDR decoders read Soroban values and authorization trees nested deeper than stellar-core accepts"
component = "stellar_flutter_sdk"
severity = "robustness"
status = "draft"
draft = "candidate/findings/issues/dart-soroban.auth-trees.synth-auth-depth-494-over-cap.md"
related = ["https://github.com/stellar/js-stellar-sdk/issues/1908"]
cause = "XdrDataInputStream counts only recursive type decodes, up to maxXdrDecodeDepth (500), and nested delegate signatures, up to maxRecursiveDecodeDepth (128) (lib/src/xdr/xdr_data_io.dart L316-L340). Neither is stellar-core's limit, which counts every nested type, so ScVal maps and vectors and SorobanAuthorizedInvocation trees past core's limit decode and the sdk reads envelopes core refuses; in the other direction, the candidate lane's ledgers with claim predicates, quorum sets or delegate signatures nested to core's ledger limit are refused. The same class as JS-DEPTH in js-stellar-sdk; separate code."

[[finding.conformance]]
sdk = "dart"
entries = [
  "soroban.auth-trees.p30-declared-depth-493",
  "soroban.auth-trees.synth-auth-depth-494-over-cap",
  "soroban.scval-shapes.synth-scmap-depth-198-over-cap",
  "soroban.scval-shapes.synth-scvec-depth-247-over-cap",
]

[[finding]]
id = "DART-UTF8"
title = "XDR strings are decoded as UTF-8, so valid ledgers with other bytes in a memo, symbol or string do not decode"
component = "stellar_flutter_sdk"
severity = "data-loss"
status = "draft"
draft = "candidate/findings/issues/dart-classic.memo-bytes.p30-memo-ff.md"
related = ["https://github.com/stellar/js-stellar-sdk/issues/1823"]
cause = "XdrDataInputStream.readString returns utf8.decode of the bytes (lib/src/xdr/xdr_data_io.dart L365-L367), which throws a FormatException on bytes that are not UTF-8. The XDR string type is bytes, and stellar-core applied transactions whose text memo, InvokeContractArgs function name, ScString or ScSymbol holds bytes that are not UTF-8; those fail to decode, which also stops decode_json, encode_json and the transaction hash. js-stellar-sdk#1823 is the same class: there the bytes are mangled instead of refused."

[[finding.conformance]]
sdk = "dart"
entries = [
  "classic.memo-bytes.*",
  "soroban.scval-shapes.p30-errors-auth-crypto-events-meta",
  "soroban.scval-shapes.p30-string-not-utf8-envelope",
  "soroban.scval-shapes.p30-string-not-utf8-meta",
  "soroban.scval-shapes.p30-symbol-not-utf8",
  "cap71.credentials.golden-e25799a2e2e9eea2-17",
  "soroban.auth-trees.golden-57a486abce28859d-17",
  "soroban.auth-trees.golden-e0d0e3f38b2d55e0-17",
]

[[finding]]
id = "DART-OFFERTEXT"
title = "ManageSellOfferOperationBuilder.setOfferId reads hex, signed, padded and out-of-range text as an offer id"
component = "stellar_flutter_sdk"
severity = "divergence"
status = "draft"
draft = "candidate/findings/issues/dart-cap03.offer-liabilities.synth-textual-offer-id-noncanonical.md"
related = ["https://github.com/stellar/rs-stellar-xdr/issues/627", "https://github.com/stellar/js-stellar-sdk/issues/1907", "https://github.com/stellar/js-stellar-sdk/issues/1785"]
cause = "toOperationBody passes the offer id text to BigInt.parse (lib/src/manage_sell_offer_operation.dart L111), which takes a sign, surrounding whitespace and a 0x prefix, and keeps any size, so \"0x10\", \" 16 \", \"+16\" and \"-0\" read as 16 or 0, and 9223372036854775808 and 18446744073709551615 are written as the int64 -9223372036854775808 and -1. The text forms are the ones RS-1 (rs-stellar-xdr#627), GO-TEXTID and js-stellar-sdk#1907 accept; the wrap to another id is js-stellar-sdk#1785's. Separate code in each sdk."

[[finding.conformance]]
sdk = "dart"
entries = ["cap03.offer-liabilities.synth-textual-offer-id-noncanonical"]

[[finding]]
id = "DART-OFFERU64"
title = "manage offer ids are an unsigned 64-bit type, so a negative offer id renders as a different XDR-JSON value and its XDR-JSON does not encode"
component = "stellar_flutter_sdk"
severity = "divergence"
status = "draft"
draft = "candidate/findings/issues/dart-cap03.offer-liabilities.synth-negative-offer-id.md"
cause = "XdrManageSellOfferOp.offerID is an XdrUint64 (lib/src/xdr/xdr_manage_sell_offer_op.dart L34), where the schema says int64. The bytes round trip, but XDR-JSON renders offer id -16 as \"18446744073709551600\" and refuses the canonical \"-16\" (\"XdrUint64 holds -16, outside the range of a uint64\")."

[[finding.conformance]]
sdk = "dart"
entries = ["cap03.offer-liabilities.synth-negative-offer-id"]

[[finding]]
id = "DART-SIGNEDPAYLOAD-JSON"
title = "question: XDR-JSON rendering refuses a signed-payload signer with an empty payload"
component = "stellar_flutter_sdk"
severity = "divergence"
status = "draft"
draft = "candidate/findings/issues/dart-cap40.signed-payload-signer.synth-empty-payload-signer.md"
cause = "toXdrJsonValue renders a signed-payload signer as its P strkey, and StrKey refuses an empty payload (lib/src/key_pair.dart L433, \"carries an empty payload, which has no strkey rendering\"), so a transaction the network applied with such a signer has no XDR-JSON. SEP-51 gives the value no canonical form, so the question is whether refusing the whole document is the intended answer; stellar-xdr writes an <INVALID: marker instead."

[[finding.conformance]]
sdk = "dart"
entries = ["cap40.signed-payload-signer.*-empty-payload*"]

[[finding]]
id = "DART-INFLATION"
title = "AbstractTransaction.fromEnvelopeXdr refuses an envelope with an inflation operation"
component = "stellar_flutter_sdk"
severity = "robustness"
status = "draft"
draft = "candidate/findings/issues/dart-cap26.inflation.p11-inflation-payout.md"
cause = "Operation.fromXdr has no case for INFLATION and throws \"Unknown operation body OperationType.9\" (lib/src/operation.dart L258-L259), so the sdk cannot build a transaction object, nor its hash, for envelopes from before protocol 12 that core applied."

[[finding.conformance]]
sdk = "dart"
entries = ["cap26.inflation.*"]

