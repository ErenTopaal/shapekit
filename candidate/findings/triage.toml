[[finding]]
id = "DART-BOUNDS"
title = "XDR decoders accept arrays, strings and opaque values longer than the schema allows, and nesting deeper than stellar-core accepts"
component = "stellar_flutter_sdk"
severity = "robustness"
status = "filed"
link = "https://github.com/Soneso/stellar_flutter_sdk/issues/291"
draft = "candidate/findings/issues/dart-classic.max-length.synth-tx-101-operations.md"
related = ["https://github.com/stellar/rs-stellar-xdr/security/advisories/GHSA-3xhm-p452-9wjh", "https://github.com/stellar/js-stellar-sdk/issues/1908"]
cause = "The generated decoders read a variable-length array, string or opaque with XdrDataInputStream.readArrayLength or readBytes, which bound the count only by the bytes left in the input (lib/src/xdr/xdr_data_io.dart L380-L394), and never check the maximum the schema declares: XdrSCSpecFunctionV0 reads `outputs<1>` with no bound (lib/src/xdr/xdr_sc_spec_function_v0.dart L63), XdrPreconditionsV2 reads `extraSigners<2>` the same way (lib/src/xdr/xdr_preconditions_v2.dart L102). 3.12.0 reads 101 operations, 21 signatures, a 29-byte text memo, a 33-byte symbol, a 65-byte data value, payload and signature, 6 path assets, 11 claimants, 3 extra signers and 2 spec outputs, all of which stellar-core refuses. Nesting is bounded by XdrDataInputStream's own counters, 500 recursive type decodes and 128 nested delegate signatures (lib/src/xdr/xdr_data_io.dart L317-L340), where core counts every nested type, so ScVal maps and vectors and authorization trees past core's limit decode too; the maintainers chose that count on purpose (#248, #249). Every witness is synthetic or refused by core."

[[finding.conformance]]
sdk = "dart"
entries = [
  "classic.max-length.*",
  "cap21.preconditions.synth-extra-signers-3",
  "cap23.claimable-balances.synth-claimants-11",
  "cap40.signed-payload-signer.synth-payload-65-bytes",
  "soroban.scval-shapes.synth-symbol-33-bytes",
  "soroban.invoke-basics.synth-ghsa-3xhm-spec-outputs-2",
]

# the depth part, folded in from the former DART-DEPTH
[[finding.conformance]]
sdk = "dart"
entries = [
  "soroban.auth-trees.p30-declared-depth-493",
  "soroban.auth-trees.synth-auth-depth-494-over-cap",
  "soroban.scval-shapes.synth-scmap-depth-198-over-cap",
  "soroban.scval-shapes.synth-scvec-depth-247-over-cap",
]

[[finding]]
id = "DART-UTF8"
title = "XDR strings are decoded as UTF-8, so valid ledgers with other bytes in a memo, symbol or string do not decode"
component = "stellar_flutter_sdk"
severity = "data-loss"
status = "filed"
link = "https://github.com/Soneso/stellar_flutter_sdk/issues/297"
draft = "candidate/findings/issues/dart-classic.memo-bytes.p30-memo-ff.md"
related = ["https://github.com/stellar/js-stellar-sdk/issues/1823"]
cause = "XdrDataInputStream.readString returns utf8.decode of the bytes (lib/src/xdr/xdr_data_io.dart L365-L366 at 3.12.0), which throws a FormatException on bytes that are not UTF-8. The XDR string type is bytes, and stellar-core applied transactions whose text memo, InvokeContractArgs function name, ScString or ScSymbol holds bytes that are not UTF-8; those fail to decode, which also stops decode_json, encode_json and the transaction hash. PR #177 kept memo, symbol and string as String on purpose, and documentation/sep/sep-51.md says such a value cannot reach the JSON path from a real envelope, which these core-applied transactions contradict. js-stellar-sdk#1823 is the same class: there the bytes are mangled instead of refused."

[[finding.conformance]]
sdk = "dart"
entries = [
  "classic.memo-bytes.*",
  "soroban.scval-shapes.p30-errors-auth-crypto-events-meta",
  "soroban.scval-shapes.p30-string-not-utf8-envelope",
  "soroban.scval-shapes.p30-string-not-utf8-meta",
  "soroban.scval-shapes.p30-symbol-not-utf8",
  "cap71.credentials.golden-e25799a2e2e9eea2-17",
  "soroban.auth-trees.golden-57a486abce28859d-17",
  "soroban.auth-trees.golden-e0d0e3f38b2d55e0-17",
]

[[finding]]
id = "DART-OFFERTEXT"
title = "ManageSellOfferOperationBuilder.setOfferId reads hex, signed, padded and out-of-range text as an offer id"
component = "stellar_flutter_sdk"
severity = "divergence"
status = "filed"
link = "https://github.com/Soneso/stellar_flutter_sdk/issues/294"
draft = "candidate/findings/issues/dart-cap03.offer-liabilities.synth-textual-offer-id-noncanonical.md"
related = ["https://github.com/stellar/rs-stellar-xdr/issues/627", "https://github.com/stellar/js-stellar-sdk/issues/1907", "https://github.com/stellar/js-stellar-sdk/issues/1785"]
cause = "toOperationBody passes the offer id text to BigInt.parse (lib/src/manage_sell_offer_operation.dart L111), which takes a sign, surrounding whitespace and a 0x prefix, and keeps any size, so \"0x10\", \" 16 \", \"+16\" and \"-0\" read as 16 or 0, and 9223372036854775808 and 18446744073709551615 are written as the int64 -9223372036854775808 and -1. The text forms are the ones RS-1 (rs-stellar-xdr#627), GO-TEXTID and js-stellar-sdk#1907 accept; the wrap to another id is js-stellar-sdk#1785's. Separate code in each sdk."

[[finding.conformance]]
sdk = "dart"
entries = ["cap03.offer-liabilities.synth-textual-offer-id-noncanonical"]

[[finding]]
id = "DART-OFFERU64"
title = "question: offer ids are generated as XdrUint64, so the XDR-JSON of a negative offer id is another number and the canonical form does not encode"
component = "stellar_flutter_sdk"
severity = "divergence"
status = "filed"
link = "https://github.com/Soneso/stellar_flutter_sdk/issues/295"
draft = "candidate/findings/issues/dart-cap03.offer-liabilities.synth-negative-offer-id.md"
cause = "The generator override tools/xdr-generator/generator/field_overrides.rb L76-L85 (\"offer IDs are always positive\") makes the int64 offer id an XdrUint64 in XdrManageSellOfferOp (lib/src/xdr/xdr_manage_sell_offer_op.dart L34 at 3.12.0), XdrManageBuyOfferOp, XdrOfferEntry, XdrLedgerKeyOffer, XdrClaimOfferAtom and XdrClaimOfferAtomV0. The bytes round trip, but XDR-JSON renders offer id -16 as \"18446744073709551600\" and refuses the canonical \"-16\" (\"XdrUint64 holds -16, outside the range of a uint64\"). A negative offer id reaches a ledger only in operations that failed before protocol 15."

[[finding.conformance]]
sdk = "dart"
entries = ["cap03.offer-liabilities.synth-negative-offer-id"]

# the explorer entries and audit ledgers promoted into the corpus that fail the same way
[[finding.conformance]]
sdk = "dart"
entries = [
  "explore.witnesses.f62d-r0004-l69",
]

[[finding]]
id = "DART-SIGNEDPAYLOAD-JSON"
title = "XDR-JSON rendering refuses a signed-payload signer with an empty payload"
component = "stellar_flutter_sdk"
severity = "divergence"
status = "wont-fix"
reason = "documented choice before the cut-off: PR #171 (2026-08-10) and documentation/sep/sep-51.md L554-L580 refuse an empty signed payload in XDR-JSON on purpose; and no ledger holds the shape, because core refuses every witness at submit (txMALFORMED or SET_OPTIONS_BAD_SIGNER)"
cause = "toXdrJsonValue renders a signed-payload signer as its P strkey, and StrKey refuses an empty payload (lib/src/key_pair.dart L433 at 3.12.0), so the XDR-JSON of an envelope with such a signer is refused. Every witness is synthetic or an envelope core refused at submit; no ledger holds the shape."

[[finding.conformance]]
sdk = "dart"
entries = ["cap40.signed-payload-signer.*-empty-payload*"]

[[finding]]
id = "DART-INFLATION"
title = "AbstractTransaction.fromEnvelopeXdr refuses an envelope with an inflation operation"
component = "stellar_flutter_sdk"
severity = "robustness"
status = "filed"
link = "https://github.com/Soneso/stellar_flutter_sdk/issues/292"
