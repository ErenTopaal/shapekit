[[finding]]
id = "PHP-BOUNDS"
title = "XDR decoders accept values the schema forbids: arrays and strings past their maximum, nonzero padding, nesting past stellar-core's limit"
component = "soneso/stellar-php-sdk"
severity = "robustness"
status = "filed"
link = "https://github.com/Soneso/stellar-php-sdk/issues/239"
draft = "candidate/findings/issues/php-classic.max-length.synth-tx-101-operations.md"
related = ["https://github.com/stellar/rs-stellar-xdr/security/advisories/GHSA-3xhm-p452-9wjh", "https://github.com/stellar/js-stellar-sdk/issues/1908"]
cause = "XdrBuffer::readOpaqueVariable and readString take a maxLength the generated decoders never pass, and skip the padding without reading it (Soneso/StellarSDK/Xdr/XdrBuffer.php L158-L173); readArrayLength bounds a count only by the bytes left (XdrPreconditionsV2::decode reads extraSigners<2> with it, Xdr/XdrPreconditionsV2.php L74). Nesting is capped at DECODE_DEPTH_LIMIT (500) recursive decodes (Xdr/XdrBuffer.php L33), not core's limit. 1.18.0 reads 101 operations, 21 signatures, a 29-byte memo, a 33-byte symbol, 65-byte payloads, 6 path assets, 11 claimants, 3 extra signers, 2 spec outputs, nonzero padding in strings, bytes and signer keys, and ScVal and authorization trees past core's depth, all of which stellar-core refuses."

