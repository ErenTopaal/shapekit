# findings of the candidate lane: failures of the newer sdks, stellar-cli and stellar-etl, triaged
# apart from the main record, with their upstream issues once filed. the format is
# findings/triage.toml's; the inputs live under candidate/findings/inputs/, so these findings
# never count against the main findings check.
# check: shapekit findings check --triage candidate/findings/triage.toml --out candidate/findings --allow-draft

schema = 1

[inputs]
manifest = "corpus/manifest.json"
dir = "candidate/findings/inputs"
# the stellar-etl run is imported here and, from the same run output, as a main input of
# findings/triage.toml, whose check counts the failures as held by the ETL findings below
harness = ["candidate/findings/inputs/harness-stellar-etl-7e3fc9af.json"]
matrices = ["candidate/findings/inputs/conformance-go-textual-offer-id.json", "candidate/findings/inputs/conformance-dart.json", "candidate/findings/inputs/conformance-php.json", "candidate/findings/inputs/conformance-dotnet.json", "candidate/findings/inputs/conformance-kmp.json", "candidate/findings/inputs/conformance-stellar-cli.json"]

[[inputs.import]]
kind = "harness"
from = "target/findings/stellar-etl-7e3fc9af/harness-report.json"
to = "candidate/findings/inputs/harness-stellar-etl-7e3fc9af.json"
command = "shapekit harness run --network both --adapter \"adapters/bin/etl-adapter --commit 7e3fc9af95359dad6ba939fa88791f49cdf531ae --cpus 2\" --out target/findings/stellar-etl-7e3fc9af"

[[inputs.import]]
kind = "conformance"
from = "target/conformance/go-textual-offer-id/divergence-matrix.json"
to = "candidate/findings/inputs/conformance-go-textual-offer-id.json"
command = "shapekit conformance run --sdk go --all-versions --entry cap03.offer-liabilities.synth-textual-offer-id-noncanonical --out target/conformance/go-textual-offer-id"

[targets.stellar-etl]
repo = "stellar/stellar-etl"
adapter = "adapters/bin/etl-adapter --commit {version}"

[[finding]]
id = "ETL-META-V4"
title = "stellar-etl's token transfer export halts on ledgers whose transaction meta is below version 4"
component = "stellar-etl"
severity = "robustness"
status = "wont-fix"
reason = "intended for the data stellar-etl reads: the public ledger lake holds history re-emitted by a current core, so every ledger there carries TransactionMeta v4, which unified events need. Only locally recorded chains below protocol 23 hold v2 or v3 meta"
cause = "export_token_transfer builds the processor with NewEventsProcessorForUnifiedEvents (internal/transform/token_transfer.go L15 at 7e3fc9af), which reads the CAP-67 unified events stream and returns \"expected version 4 got N\" for any other meta version (go-stellar-sdk processors/token_transfer/token_transfer_processor.go L474-L478 at v0.9.0, the version stellar-etl pins). The command exits 1, the adapter retries it, and the harness stops the chain at its first ledger with a transaction: every entry of the five corpus chains recorded at protocols 9 to 22 (meta v2 or v3), and of the 20 explorer chains below protocol 23 recorded with classic events and their backfill off, is not evaluated, on both networks."

[[finding.harness]]
target = "stellar-etl"
verdicts = ["not-evaluated"]
entries = [
  "cap03.offer-liabilities.p17-*",
  "cap26.inflation.p11-*",
  "cap67.unified-events.p22-*",
  "classic.failed-tx.p9-*",
  "classic.failed-tx.p12-*",
  # explorer chains below protocol 23 recorded with classic events and their backfill off, so
  # core wrote the meta of their day (v2 or v3)
  "explore.witnesses.f62c-r0016-*",
  "explore.witnesses.f62c-r0017-*",
  "explore.witnesses.f62d-r0001-*",
  "explore.witnesses.f62d-r0002-*",
  "explore.witnesses.f63-p21-r0001-*",
  "explore.witnesses.g1-r0016-*",
  "explore.witnesses.g2-r0001-*",
  "explore.witnesses.g2-r0015-*",
  "explore.witnesses.g2-r0017-*",
  "explore.witnesses.g2-r0019-*",
  "explore.witnesses.g2-r0020-*",
  "explore.witnesses.g2-r0023-*",
  "explore.witnesses.g2-r0027-*",
  "explore.witnesses.g2-r0030-*",
  "explore.witnesses.g2-r0031-*",
  "explore.witnesses.g2-r0033-*",
  "explore.witnesses.g2-r0036-*",
  "explore.witnesses.g2-r0040-*",
  "explore.witnesses.g2-r0041-*",
  "explore.witnesses.g2-r0042-*",
