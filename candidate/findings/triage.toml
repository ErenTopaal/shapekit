[[finding]]
id = "ETL-1"
title = "question: the effects table has no trustline_created for a trustline a Stellar asset contract trust() call opens"
component = "stellar-etl"
severity = "data-loss"
status = "duplicate-of"
reason = "#460 (2026-07-04, part of the effects audit epic #448) lists CAP-73 SAC trust() as trustline_created"
link = "https://github.com/stellar/stellar-etl/issues/460"
cause = "transformEffects derives the effects of an InvokeHostFunction operation only from Stellar asset contract events (addInvokeHostFunctionEffects, internal/transform/effects.go L1326-L1440 at 7e3fc9af), which turn transfer, mint, clawback and burn into credit and debit effects. A trustline the contract's trust() function opens (CAP-73) changes the ledger without such an event, so it gets no trustline_created effect, while a ChangeTrust operation that opens the same trustline does (addChangeTrustEffects, L647-L705). The source does not say whether this is intended."

[[finding.harness]]
target = "stellar-etl"
facts = ["trustline-created"]
problems = ["dropped"]

[[finding]]
id = "ETL-2"
title = "question: the effects table has no account_created for an account a Stellar asset contract transfer creates"
component = "stellar-etl"
severity = "data-loss"
status = "duplicate-of"
reason = "#460 (2026-07-04, part of the effects audit epic #448) lists XLM-SAC auto-account-creation as account_created and signer_created"
link = "https://github.com/stellar/stellar-etl/issues/460"
cause = "An XLM transfer through the native asset contract to an account that does not exist creates it (CAP-73). transformEffects writes account_debited and account_credited for the transfer event (addInvokeHostFunctionEffects, internal/transform/effects.go L1326-L1440 at 7e3fc9af) but account_created only for a CreateAccount operation (addAccountCreatedEffects, L411-L437), so the new account has no account_created effect. The source does not say whether this is intended."

[[finding.harness]]
target = "stellar-etl"
facts = ["account-created"]
problems = ["dropped"]

[[finding]]
id = "ETL-3"
title = "question: the effects table has no signer_removed for a pre-auth signer core removes when its transaction applies"
component = "stellar-etl"
severity = "data-loss"
status = "wont-fix"
reason = "by design: the removal is in export_ledger_entry_changes, whose signers table writes a Deleted row for a signer that disappears from an updated account, failed transactions included (internal/transform/account_signer.go L60-L91, PR #392), and horizon's effects processor emits no signer_removed for it either"
cause = "Core removes a pre-auth signer in txChangesBefore whether its transaction succeeds or fails, and a fee bump's also from the fee source. effects() returns nothing for a failed transaction and builds effects per operation from the operation's own changes (internal/transform/effects.go L60-L176 at 7e3fc9af); signer_removed comes only from addSetOptionsEffects (L530-L645). The source does not say whether this is intended."

[[finding.harness]]
target = "stellar-etl"
facts = ["signer-removed"]
problems = ["dropped"]

[[finding]]
id = "ETL-4"
title = "question: the effects table has no trustline_removed for the pool share trustline a revocation removes"
component = "stellar-etl"
severity = "data-loss"
status = "filed"
link = "https://github.com/stellar/stellar-etl/issues/518"
draft = "candidate/findings/issues/stellar-etl-E4.md"
cause = "A revocation that redeems pool shares removes the owner's pool share trustline; addLiquidityPoolRevokedEffect (internal/transform/effects.go L1152-L1219 at 7e3fc9af), called from addSetTrustLineFlagsEffects and addAllowTrustEffects, writes claimable_balance_created and liquidity_pool_revoked from the operation's changes but no trustline_removed for the removed entry. The source does not say whether this is intended."

[[finding.harness]]
target = "stellar-etl"
facts = ["trustline-removed"]
problems = ["dropped"]

[[finding]]
id = "GO-TEXTID"
title = "question: horizon.Offer reads an offer id given as \"+16\" or \"-0\""
component = "go-stellar-sdk"
severity = "divergence"
status = "wont-fix"
reason = "the same \"+16\", \"-0\" and leading-zero acceptance was answered as reasonable and harmless on rs-stellar-xdr#627 (closed 2026-11-18), and horizon.Offer only reads horizon's own canonical ids"
related = ["https://github.com/stellar/rs-stellar-xdr/issues/627"]
cause = "horizon.Offer.ID is an int64 tagged `json:\"id,string\"`, so encoding/json unquotes the text and passes it to strconv.ParseInt, which takes an optional sign: \"+16\" reads as 16 and \"-0\" as 0, on every tested version (v0.7.1 to v0.9.0). The field reads horizon's own responses, which carry the canonical text, so the draft is a question. rs-stellar-xdr reads the same two strings the same way (RS-1, rs-stellar-xdr#627); the code is separate, so this is its own finding with RS-1 related."

[[finding.conformance]]
sdk = "go"
entries = ["cap03.offer-liabilities.synth-textual-offer-id-noncanonical"]

