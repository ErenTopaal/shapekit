severity = "divergence"
status = "filed"
link = "https://github.com/stellar/stellar-cli/issues/2895"
draft = "candidate/findings/issues/stellar-cli-soroban.auth-trees.p30-declared-depth-245.md"
cause = "tx_envelope_from_input reads the envelope with Limits::depth(XDR_DEPTH_LIMIT) (soroban-cli 30.0.1 src/commands/tx/xdr.rs L41), and XDR_DEPTH_LIMIT is 500 (src/utils.rs L21; utils.rs L60 re-encodes the signature payload under the same limit), so the hash of a transaction whose authorization tree or ScVal stellar-core accepted can be refused (\"failed to decode XDR: depth limit exceeded\"). PR #2675 set 500 on purpose against stack overflow; from protocol 28 core's limit is 1000 (TransactionUtils.cpp validateXDRForProtocol). The witnesses are local chains."

[[finding.conformance]]
