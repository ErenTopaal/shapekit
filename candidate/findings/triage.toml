[[finding]]
id = "DART-PRICE"
title = "a transaction whose offer price is not in lowest terms hashes to another value once the sdk rebuilds it"
component = "stellar_flutter_sdk"
severity = "divergence"
status = "filed"
link = "https://github.com/Soneso/stellar_flutter_sdk/issues/296"
draft = "candidate/findings/issues/dart-cap03.offer-liabilities.mainnet-37466023.md"
cause = "AbstractTransaction.fromEnvelopeXdr(..).hash(network) rebuilds every operation before hashing. ManageSellOfferOperation builder() turns the XDR price into Price(n, d).toDecimalString() and toOperationBody reads it back with Price.fromString (lib/src/manage_sell_offer_operation.dart L109 and L135-L143 at 3.12.0), which since PR #196 recovers the fraction exactly but in lowest terms (lib/src/price.dart L185-L195), so it writes the reduced fraction and an offer or liquidity pool deposit bound such as 6836306/1144362402, 7/7 or 2147483647/2147483647 is hashed as another fraction (lib/src/transaction.dart L108-L110). ManageBuyOfferOperation (L110, L144), CreatePassiveSellOfferOperation (L94, L124) and LiquidityPoolDepositOperation (L135-L136, L165-L168) take the same round trip."

[[finding.conformance]]
sdk = "dart"
entries = [
  "cap03.offer-liabilities.mainnet-37466023",
  "cap15.fee-bump.mainnet-57369500",
  "explore.witnesses.g1-r0047-l69",
  "explore.witnesses.g2-r0007-l69",
  "explore.witnesses.g2-r0010-l92",
  "explore.witnesses.g2-r0038-l67",
]

