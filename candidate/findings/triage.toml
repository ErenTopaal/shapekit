[[finding]]
id = "NET-UTF8"
title = "XDR strings are decoded to .NET strings, so memos, symbols and strings that are not UTF-8 change, and so does the transaction hash"
component = "stellar-dotnet-sdk"
severity = "data-loss"
status = "draft"
draft = "candidate/findings/issues/dotnet-cap71.credentials.golden-e25799a2e2e9eea2-17.md"
related = ["https://github.com/stellar/js-stellar-sdk/issues/1823"]
cause = "The text memo, ScString, ScSymbol and function names are read with XdrDataInputStream.ReadString, Encoding.UTF8.GetString, which replaces bytes that are not UTF-8 (StellarDotnetSdk.Xdr/XdrDataInputStream.cs L88-L91, Memo.cs L72), and written back from the .NET string; the bytes the network applied are lost, decode and encode do not round trip, the transaction object hashes other bytes, and a 28-byte memo whose replacement characters take 29 bytes is refused (MemoTooLongException). js-stellar-sdk#1823 is the same class."

