[[finding]]
id = "CLI-SIGNEDPAYLOAD-JSON"
title = "stellar xdr encode refuses the XDR-JSON of an empty signed payload signer that stellar xdr decode writes"
component = "stellar-cli"
severity = "divergence"
status = "wont-fix"
reason = "documented exception: stellar-xdr src/_xdrjson.rs L1-L13 lists the empty payload as exception 1 of the XDR-JSON round trip (PR #547, 2026-09-24), and no ledger holds the shape: core refuses every witness at submit (tx_malformed, SET_OPTIONS_BAD_SIGNER)"
cause = "The XDR-JSON of a signed payload signer is its P strkey, read back with stellar-strkey 1.0.0 SignedPayload::new, which requires an inner payload of 1 to 64 bytes (src/ed25519.rs L458-L461); stellar xdr decode writes an empty payload as <INVALID:G...:EMPTY_PAYLOAD>, which encode refuses. Every witness is synthetic or an envelope core refused at submit."

[[finding.conformance]]
