# divergences that conformance runs over candidate entries found, each with the finding in
# findings/triage.toml it belongs to, or `finding = "new"` with what a draft needs. no command
# reads this file. an entry moves to corpus/ with `shapekit corpus promote` once the finding's
# conformance matcher in findings/triage.toml takes its failures.
#
# runs, on the candidate manifest:
#   shapekit conformance run --sdk rust --sdk go --all-versions \
#     --manifest candidate/manifest.json --flag representation-gap
#   shapekit conformance run --all-versions --manifest candidate/manifest.json \
#     --entry <each format.xdr-grammar.*-depth-* entry>
#
# representation gap vectors (14 entries): rust 28.0.0, 28.0.1 and 30.0.0 each pass 4 entries,
# diverge from the network on 2 and cannot run 8 (stellar-xdr has no textual muxed id input and
# the testee no to_native). go v0.7.1 to v0.9.0 cannot run any: the go testee implements
# neither id_parse nor to_native, so all 19 checks are unsupported.
#
# recursion-depth vectors (45 entries): every decoder that ran them read the 30 within the
# limit, except js 16.x everywhere and js 17.x on four ledgers (below). the 15 past the limit
# are implementation-defined and decided by the sdk vote: stellar-xdr refuses all 15; go and js
# 17.x read the ones whose nesting they count as shallower, so on 11 of them rust is the
# minority. that is the depth accounting the entries' notes describe, not a defect.

