# indexer state: `shapekit harness state check` on the wallet-backend reference run, against
# core's final entries. a candidate here is a stored end state that differs from core's
# entry; it has no corpus entry of its own, the chains below already carry it.

[[candidate]]
finding = "new"
target = "wallet-backend"
versions = ["3e22515a44979fdc3a558fda3991ca2b48e38cef"]
chains = ["classic.failed-tx.p30", "cap15.fee-bump.p30"]
checks = "harness state check, native_balances, both passphrases"
observed = "account changes a transaction's meta writes in tx_changes_before are not applied to native_balances. on classic.failed-tx.p30 ledger 67 a failed transaction's one-time pre-auth signer of GDD25X2BOFUU33TVAMOKUHP7UNWFO45G2YIB54KLIAJAJJZTRYXUIBES is removed in tx_changes_before (num_sub_entries 1 to 0, signers 1 to 0); native_balances keeps num_subentries 1, and the minimum_balance derived from it. on cap15.fee-bump.p30 ledger 83 the only change to GANS62CX3EJTX47UM5OUMEUHXV3XUXYSTYXX7ESOVWJGBQD4PF5L24F4, the inner source of a fee bump, is its sequence bump in tx_changes_before; native_balances keeps last_modified_ledger 82 where core's entry says 83"
evidence = "internal/indexer/processors/accounts.go at the commit reads account changes from three phases only: the fee (line 119, GetFeeChanges), each operation (line 88, opWrapper.Changes) and the post-apply refund (line 120, GetPostApplyFeeChanges); tx_changes_before and tx_changes_after are read for contract data only (internal/indexer/indexer.go:865-873)"

# wallet-backend on the probe chains (candidate/chains/probe.envelope-fields.*/testnet, harness
# run at 3e22515a44979fdc3a558fda3991ca2b48e38cef): 202 failing entries, 138 of them taken by
# findings/triage.toml (WB-W1, WB-W2, WB-W3, WB-W4, WB-W9). the other 64 entries (74 failures)
# have four causes in internal/indexer/processors/effects_horizon.go, wallet-backend's port of
# horizon's effects. each was compared with horizon's own effects processor, at stellar/go
# 096f654e (services/horizon/internal/ingest/processors/effects_processor.go, the last revision
# before horizon left that repository) and at stellar/stellar-horizon 01ba44a9 (main,
# internal/ingest/processors/effects_processor.go): the functions involved are the same in both,
# so no later horizon fix exists, and wallet-backend copies them. horizon documents each effect
# as the record of an operation, not of a ledger change (stellar-docs 103c6d27,
# docs/data/apis/horizon/api-reference/resources/effects/types.mdx). none is a defect, so none
# is a candidate:
#
# 1. extra thresholds (56 failures, 28 setoptionsop-* entries and their ledgers) and extra
#    account-flags (2): a set options names thresholds or flags without changing them. horizon
#    emits account_thresholds_updated and account_flags_updated from the operation's fields
#    (effects_processor.go addSetOptionsEffects, stellar-horizon main lines 666-695),
#    documented as effects of set_options. intended.
# 2. extra trustline-flags (4, allowtrustop-authorize-1 and -4): an allow trust that leaves the
#    flags as they were. horizon emits trustline_authorized or trustline_deauthorized and
#    trustline_flags_updated in every arm of the switch on authorize (addAllowTrustEffects,
#    lines 882-927; addTrustLineFlagsEffect, lines 1322-1351), documented as effects of
#    allow_trust. wallet-backend writes the first of the two as trustline_flags_updated too
#    (effects_horizon.go:319-336), a renamed type, not another trigger. intended.
# 3. extra signer-removed and dropped signer-weight (4 each, setoptionsop-masterweight-2 and -5):
#    a master key set to weight 0. horizon compares SignerSummary() before and after (line 720),
#    which counts the master key only when its weight is above 0 (go-stellar-sdk v0.8.0
#    xdr/account_entry.go lines 6-8), so a master key that can no longer sign reads as removed.
#    intended by that definition; not stated in words in horizon's documentation.
# 4. dropped data-entry (4, ledgerkeydata-accountid-0 and -dataname-0): a revoke sponsorship
#    moves a data entry's sponsor and leaves its value. horizon writes data_updated only from
#    manage_data (addManageDataEffects, lines 966-1004) and a sponsor change of a data entry as
#    data_sponsorship_updated (lines 260-264), documented under revoke_sponsorship. this settles the
#    open question: in wallet-backend's model a sponsor-only change is a sponsorship fact, while
#    the oracle vocabulary also counts it as a data-entry update. intended; the difference is
#    explained in docs/adapter-interface.md, the wallet-backend section.

# soroban-sdk on the candidate lane (`shapekit conformance run --sdk soroban --all-versions
# --manifest candidate/manifest.json`): 28.0.0 and 29.0.1 each pass 8 entries and diverge from
# the network on 7 any/decode_encode checks. the testee reads ScVal bytes the way a contract
# does (FromXdr, then the host), and all 7 are the host's rules for contract values, so none is
# a candidate:
#
# 1. scval-contract-instance, scval-ledger-key-contract-instance, scval-ledger-key-nonce and
#    scval-map (SCV_MAP with no map): ledger keys and entries, not contract values. the host's
#    deserialize_from_bytes refuses every ScVal that Val::can_represent_scval_recursive refuses
#    (soroban-env-host 29.0.1 src/host.rs:2597-2620), which are ContractInstance,
#    LedgerKeyContractInstance, LedgerKeyNonce, Vec(None) and Map(None) (soroban-env-common
#    29.0.1 src/val.rs:602-661). 28.0.0 links soroban-env-host 28.0.2 with the same rule.
#    intended.
# 2. scval-depth-scval-below and scval-depth-scval-at: vecs nested about 1000 deep. the host
#    reads ScVal bytes under DEFAULT_XDR_RW_LIMITS, depth 500 (src/budget/limits.rs:12-31,
#    src/host/metered_xdr.rs:40-46), and converts under DEFAULT_HOST_DEPTH_LIMIT, 100
#    (src/budget/limits.rs:41), so no contract value nests that deep. intended.
#
# the other 21 failing checks are `error`, not divergences: probe.limits.* entries whose chain,
# candidate/chains/probe.limits.p30, is not in the lane, so the runner cannot read the ledger
# their testnet/tx_hash expectation comes from. that happens for every sdk.
