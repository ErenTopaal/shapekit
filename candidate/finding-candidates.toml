# horizon's effects. each was compared with horizon's own effects processor, at stellar/go
# 096f654e (services/horizon/internal/ingest/processors/effects_processor.go, the last revision
# before horizon left that repository) and at stellar/stellar-horizon 01ba44a9 (main,
# internal/ingest/processors/effects_processor.go): the functions involved are the same in both,
# so no later horizon fix exists, and wallet-backend copies them. horizon documents each effect
# as the record of an operation, not of a ledger change (stellar-docs 103c6d27,
# docs/data/apis/horizon/api-reference/resources/effects/types.mdx). none is a defect, so none
# is a candidate:
#
# 1. extra thresholds (56 failures, 28 setoptionsop-* entries and their ledgers) and extra
#    account-flags (2): a set options names thresholds or flags without changing them. horizon
#    emits account_thresholds_updated and account_flags_updated from the operation's fields
#    (effects_processor.go addSetOptionsEffects, stellar-horizon main lines 666-695),
#    documented as effects of set_options. intended.
# 2. extra trustline-flags (4, allowtrustop-authorize-1 and -4): an allow trust that leaves the
#    flags as they were. horizon emits trustline_authorized or trustline_deauthorized and
#    trustline_flags_updated in every arm of the switch on authorize (addAllowTrustEffects,
#    lines 882-927; addTrustLineFlagsEffect, lines 1322-1351), documented as effects of
#    allow_trust. wallet-backend writes the first of the two as trustline_flags_updated too
#    (effects_horizon.go:319-336), a renamed type, not another trigger. intended.
# 3. extra signer-removed and dropped signer-weight (4 each, setoptionsop-masterweight-2 and -5):
#    a master key set to weight 0. horizon compares SignerSummary() before and after (line 720),
#    which counts the master key only when its weight is above 0 (go-stellar-sdk v0.8.0
#    xdr/account_entry.go lines 6-8), so a master key that can no longer sign reads as removed.
#    intended by that definition; not stated in words in horizon's documentation.
# 4. dropped data-entry (4, ledgerkeydata-accountid-0 and -dataname-0): a revoke sponsorship
#    moves a data entry's sponsor and leaves its value. horizon writes data_updated only from
#    manage_data (addManageDataEffects, lines 966-1004) and a sponsor change of a data entry as
#    data_sponsorship_updated (lines 260-264), documented under revoke_sponsorship. this settles the
#    open question: in wallet-backend's model a sponsor-only change is a sponsorship fact, while
#    the oracle vocabulary also counts it as a data-entry update. intended; the difference is
#    explained in docs/adapter-interface.md, the wallet-backend section.

