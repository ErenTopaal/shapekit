[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["contracts"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ed25519-dalek = "3.0.0"
soroban-env-host = "30.0.0"
soroban-simulation = "30.0.0"
stellar-strkey = "1.0.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["blocking"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
stellar-xdr = { version = "30.0.0", default-features = false, features = ["std", "serde", "serde_json", "schemars", "type_enum"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
walkdir = "2.5.0"
shapekit-manifest = { path = "crates/shapekit-manifest" }
shapekit-registry = { path = "crates/shapekit-registry" }
