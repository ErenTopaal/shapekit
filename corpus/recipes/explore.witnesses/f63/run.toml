# contract recipes: one explorer run per protocol 21 to 30, each verified under both
# passphrases twice, plus hand-written recipes for arms the runs did not reach
kept_here = "the explorer recipes a greedy cover over the verified recipes picked, at least one per protocol, and the hand-written ones"

