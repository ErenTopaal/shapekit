# golden (operation, change-kind multiset) combinations that `shapekit goldens agree` accepts
# without a matching local-core or history entry. each names the golden entry, the operation
# and its change kinds exactly as the agree report prints them, and says why no local entry
# shows the same combination. change kinds follow pre-state (which offers sit on the book,
# which assets and sponsors are involved), so a different pre-state is a reason; a different
# core behaviour is not, and must be fixed or reported instead.

[[exception]]
golden = "cap03.offer-liabilities.golden-00c0553ff45607f9-10"
op = "manage_sell_offer"
kinds = ["state:account", "state:offer", "state:trustline", "state:trustline", "state:trustline", "state:trustline", "updated:account", "updated:offer", "updated:trustline", "updated:trustline", "updated:trustline", "updated:trustline"]
reason = "core test 'offer crossing with minimal receive cap': a credit-for-credit taker offer fully taken against a resting offer, so two trustlines of each side change. the local recipes trade native against one credit asset and touch one trustline"

