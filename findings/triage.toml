[[finding]]
id = "JS-16X"
title = "16.x lacks six fixes that 17.x has: map key order and collisions, textual ids, W addresses, decode depth, StrKey checks"
component = "js-stellar-sdk"
severity = "divergence"
status = "filed"
link = "https://github.com/stellar/js-stellar-sdk/issues/1907"
draft = "findings/issues/js-16x-backports.md"
related = [
  "https://github.com/stellar/js-stellar-sdk/pull/1766",
  "https://github.com/stellar/js-stellar-sdk/issues/1785",
  "https://github.com/stellar/js-stellar-sdk/issues/1789",
  "https://github.com/stellar/js-stellar-sdk/pull/1811",
  "https://github.com/stellar/js-stellar-sdk/pull/1828",
  "https://github.com/stellar/js-xdr/pull/155",
]
cause = "16.4.1 lacks six fixes that 17.x has: ScVal map key order (#1766), map key collisions (#1789, fixed by #1778), canonical textual ids (#1785), W addresses (#1811), js-xdr 5's decode depth (js-xdr#155; 16.x stops at 200 nested types, 66 ScVec levels), and the StrKey payload length and claimable balance type byte checks. One issue asks for all six backports."

[[finding.conformance]]
sdk = "js"
versions = ["16.3.0", "16.3.1", "16.4.1"]
entries = [
  "*.synth-strkey-*-invalid",
  "soroban.auth-trees.synth-auth-depth-493-deepest-accepted",
  "soroban.scval-shapes.synth-event-vec-depth-101",
  "soroban.scval-shapes.synth-scmap-depth-197-deepest-accepted",
  "soroban.scval-shapes.synth-scvec-depth-246-deepest-accepted",
  "soroban.auth-trees.p30-declared-depth-*",
  "soroban.scval-shapes.p30-*-depth-*",
  "soroban.scval-shapes.p30-map-mixed-keys-sorted-meta",
  "soroban.scval-shapes.synth-map-*",
  "cap03.offer-liabilities.synth-textual-offer-id-*",
  "cap27.muxed-accounts.synth-textual-muxed-id-noncanonical",
  "cap84.muxed-contract.synth-strkey-w-valid",
]

[[finding]]
id = "JS-DEPTH"
title = "fromXdr decodes envelopes nested deeper than stellar-core accepts, and no maxDepth value matches core's limit"
component = "js-stellar-sdk"
severity = "robustness"
status = "filed"
link = "https://github.com/stellar/js-stellar-sdk/issues/1908"
draft = "findings/issues/js-soroban.auth-trees.synth-auth-depth-494-over-cap.md"
related = ["https://github.com/stellar/js-xdr/pull/155"]
cause = "Core refuses envelopes nested deeper than its decode limit; the sdk's default (1500 nested schemas since js-xdr#155) is wider and cannot be lowered through fromXdr, and through schema.decode core's boundary falls at a different maxDepth per shape, so no single value matches core."

[[finding.conformance]]
sdk = "js"
versions = ["17.2.0", "17.2.1", "17.3.0", "17.4.0"]
entries = [
  "soroban.auth-trees.synth-auth-depth-494-over-cap",
  "soroban.auth-trees.p30-declared-depth-493",
  "soroban.scval-shapes.synth-scmap-depth-198-over-cap",
  "soroban.scval-shapes.synth-scvec-depth-247-over-cap",
]

# rs-stellar-xdr

[[finding]]
id = "RS-1"
title = "question: the XDR-JSON reader accepts 64-bit integer strings with a plus sign, \"-0\" or leading zeros"
component = "rs-stellar-xdr"
severity = "divergence"
status = "filed"
link = "https://github.com/stellar/rs-stellar-xdr/issues/627"
draft = "findings/issues/rust-cap03.offer-liabilities.synth-textual-offer-id-noncanonical.md"
cause = "NumberOrString passes a JSON string to str::parse, so \"+16\", \"-0\" and \"016\" read as 16 and 0; the crate's own tests assert this, so the draft is a question. The failing checks are \"+16\" and \"-0\" in the non-canonical entry; negative ids such as \"-16\" are valid int64 values that core refuses only in doCheckValid, so they are in the negative entry, which accepts the exact id the crate reads."

[[finding.conformance]]
sdk = "rust"
entries = ["cap03.offer-liabilities.synth-textual-offer-id-noncanonical"]

[[finding]]
id = "RS-2"
title = "the XDR-JSON reader stops at serde_json's recursion limit of 128, so values the crate writes as JSON cannot be read back"
component = "rs-stellar-xdr"
severity = "divergence"
status = "filed"
link = "https://github.com/stellar/rs-stellar-xdr/issues/628"
draft = "findings/issues/rust-soroban.auth-trees.synth-auth-depth-493-deepest-accepted.md"
cause = "to_xdr_json renders nested values of any depth the decoder accepts, but the reader uses serde_json with its default recursion limit, so deep auth trees, ScVals and events (including ones on recorded protocol 30 ledgers) do not round-trip through JSON."

[[finding.conformance]]
sdk = "rust"
entries = [
  "soroban.auth-trees.synth-auth-depth-493-deepest-accepted",
  "soroban.scval-shapes.synth-event-vec-depth-101",
  "soroban.scval-shapes.synth-scmap-depth-197-deepest-accepted",
  "soroban.scval-shapes.synth-scvec-depth-246-deepest-accepted",
  "soroban.auth-trees.p30-declared-depth-*",
  "soroban.scval-shapes.p30-*-depth-*",
  "soroban.scval-shapes.p30-map-mixed-keys-sorted-meta",
]

[[finding]]
id = "RS-3"
title = "bool decodes any u32 and reads everything but 1 as false, where core reads non-zero as true and go-stellar-sdk refuses"
component = "rs-stellar-xdr"
severity = "divergence"
status = "filed"
link = "https://github.com/stellar/rs-stellar-xdr/issues/629"
draft = "findings/issues/fuzz-rust-bool-non-canonical.md"
siblings = ["CORE-1"]
cause = "impl ReadXdr for bool returns i == 1 for any u32, so the word 2 decodes as false and re-encodes as 0, where go-stellar-sdk and js-stellar-sdk refuse it and core's xdrpp reads it as true. The differential fuzzer found the same class through every fuzzed type that carries a bool (findings/fuzz/known-classes.txt)."

# the bool word 2 entries are implementation-defined, so no answer fails; the evidence is the
# answer stellar-xdr records on them
[[finding.answer]]
sdk = "rust"
entries = ["soroban.scval-shapes.synth-bool-value-2"]
answers = ['{"json":{"bool":false}}', '{"xdr":"AAAAAAAAAAA="}']

# stellar-core

[[finding]]
id = "CORE-1"
title = "core (xdrpp) accepts a bool word other than 0 or 1 as true and hashes its own re-encoding with 1"
component = "stellar-core"
severity = "robustness"
status = "filed"
link = "https://github.com/stellar/stellar-core/issues/5509"
draft = "findings/issues/stellar-core-bool-non-canonical.md"
siblings = ["RS-3"]
cause = "xdrpp's xdr_traits<bool>::from_uint is u != 0, and the enum check runs on the converted value, so core decodes any non-zero bool word as true. The transaction hash, the signature check and the protocol 28 rust parse check all use core's re-encoding (word 1), never the submitted bytes. In a local core 30.0.0 run an envelope with the word 2 signed over the canonical hash was applied with txSUCCESS and stored with 1; signed over the submitted bytes it got txBAD_AUTH. Low severity: no authorization bypass or fund loss, but the hash of the submitted bytes differs from core's transaction hash and stellar-xdr reads the same argument as false. The evidence is the three-way split of the SDK answers on the envelope form: some read the word 2 as true like core, stellar-xdr reads it as false, and the rest refuse it (the fuzz classes in findings/fuzz/known-classes.txt are the same root cause)."

# the evidence is the disagreement itself: on the envelope form the sdks read the word 2 as
# true (as core's xdrpp does), as false (as stellar-xdr does) or refuse it
[[finding.answer]]
entries = ["soroban.invoke-basics.synth-invoke-arg-bool-2"]
split = 3

[[finding]]
id = "WB-FLAGS-OP"
title = "account and trustline flags rows follow the operation's parameters, also when the ledger's flags do not change"
component = "wallet-backend"
severity = "wrong-data"
status = "wont-fix"
reason = "intended, recorded and not filed: the effects code is a port of Horizon's (internal/indexer/processors/effects_horizon.go L3-L4 at 3e22515a), whose account_flags_updated and trustline_flags_updated effects describe what the operation asked for, not what changed"
cause = "addSetOptionsEffects writes account flags from op.SetFlags and op.ClearFlags whenever either is present (effects_horizon.go L165-L175 at 3e22515a), and addAllowTrustEffects writes trustline flags from op.Authorize on every AllowTrust (L307-L340), without reading the ledger change. A set options that clears flags already clear, or an allow trust that authorizes a trustline already authorized, leaves the entry's flags as they were, so the meta shows no flag change while a flags row is stored."

[[finding.harness]]
target = "wallet-backend"
facts = ["account-flags", "trustline-flags"]
problems = ["extra"]
