# triaged root causes of every failure the tooling reports, and what was decided upstream.
# `shapekit findings collect` applies the matchers below to the inputs and writes
# findings.json and FINDINGS.md; `shapekit findings check` fails while a failure matches no
# finding or a finding has no link or decision. format and rules: the shapekit-findings crate docs (crates/shapekit-findings/src/lib.rs).
#
# matchers are tried in file order and the first finding whose matcher takes a failure gets
# it, so a narrow matcher must come before a broad one.

schema = 1
# a failure no finding below takes but a finding of the candidate lane does is held by it:
# counted and listed apart, neither unmapped nor dropped
candidates = "candidate/findings/triage.toml"

[inputs]
manifest = "corpus/manifest.json"
# every input below is a committed, reduced copy of a run output; [[inputs.import]] says where
# each came from. after new runs: `shapekit findings import-inputs`, then `shapekit findings collect`.
harness = [
  "findings/inputs/harness-wallet-backend-3e22515a.json",
  "findings/inputs/harness-stellar-etl-2b24ec89.json",
]
matrices = [
  "findings/inputs/conformance-rust.json",
  "findings/inputs/conformance-go.json",
  "findings/inputs/conformance-js.json",
  "findings/inputs/conformance-peers.json",
]

[[inputs.lint]]
target = "wallet-backend"
version = "3e22515a44979fdc3a558fda3991ca2b48e38cef"
result = "findings/inputs/lint-wallet-backend-3e22515a.json"
command = "indexerlint -format json ./..."

[[inputs.import]]
kind = "harness"
from = "target/findings/wallet-backend-3e22515a/harness-report.json"
to = "findings/inputs/harness-wallet-backend-3e22515a.json"
command = "shapekit harness run --network both --repeat 2 --adapter \"adapters/bin/wb-adapter --commit 3e22515a44979fdc3a558fda3991ca2b48e38cef\" --out target/findings/wallet-backend-3e22515a"

# stellar-etl, the second adapter: its findings have no upstream decision yet, so they stay in
# the candidate triage, which imports the same run, and hold the failures of this input there
[[inputs.import]]
kind = "harness"
from = "target/findings/stellar-etl-2b24ec89/harness-report.json"
to = "findings/inputs/harness-stellar-etl-2b24ec89.json"
command = "shapekit harness run --network both --adapter \"adapters/bin/etl-adapter --commit 2b24ec89ddce7fc0beb7795de982c93e6895eaf3 --cpus 2\" --out target/findings/stellar-etl-2b24ec89"

[[inputs.import]]
kind = "conformance"
from = "target/conformance/rust/divergence-matrix.json"
to = "findings/inputs/conformance-rust.json"
command = "shapekit conformance run --sdk rust --all-versions --out target/conformance/rust"

[[inputs.import]]
kind = "conformance"
from = "target/conformance/go/divergence-matrix.json"
to = "findings/inputs/conformance-go.json"
command = "shapekit conformance run --sdk go --all-versions --out target/conformance/go"

[[inputs.import]]
kind = "conformance"
from = "target/conformance/js/divergence-matrix.json"
to = "findings/inputs/conformance-js.json"
command = "shapekit conformance run --sdk js --all-versions --out target/conformance/js"

# implementation-defined entries record each sdk's answer without judging it, and a split of
# the answers shows only next to the other sdks', so the entries whose references disagree are
# also run with every sdk at once; the [[finding.answer]] matchers read these answers
[[inputs.import]]
kind = "conformance"
from = "target/conformance/peers/divergence-matrix.json"
to = "findings/inputs/conformance-peers.json"
command = "shapekit conformance run --all-versions --flag references-disagree --out target/conformance/peers"

[[inputs.import]]
kind = "lint"
from = "target/findings/indexerlint-wallet-backend-3e22515a.json"
to = "findings/inputs/lint-wallet-backend-3e22515a.json"
command = "indexerlint -format json ./... (in a checkout of stellar/wallet-backend at 3e22515a44979fdc3a558fda3991ca2b48e38cef)"

[targets.wallet-backend]
repo = "stellar/wallet-backend"
adapter = "adapters/bin/wb-adapter --commit {version}"

[targets.stellar-etl]
repo = "stellar/stellar-etl"
adapter = "adapters/bin/etl-adapter --commit {version}"

# wallet-backend, current pin, harness

[[finding]]
id = "WB-W3"
title = "feature request: a state change reason for clawbacks, which are stored as BURN like a payment to the issuer"
component = "wallet-backend"
severity = "wrong-data"
status = "filed"
link = "https://github.com/stellar/wallet-backend/issues/813"
draft = "findings/issues/wallet-backend-W3.md"
cause = "The state change vocabulary has no CLAWBACK reason. Clawback and ClawbackClaimableBalance write a BALANCE BURN row (and a DEBIT), so the CAP-67 `clawback` event of the ledger is stored as a `burn`. wallet-backend documents this as intended (docs/architecture/state-changes.md L92), so the draft is a feature request."

[[finding.harness]]
target = "wallet-backend"
facts = ["token-event"]
problems = ["dropped"]
events = ["clawback"]

[[finding.harness]]
target = "wallet-backend"
entries = ["*clawback*"]
facts = ["token-event"]
problems = ["extra"]
events = ["burn"]

# explorer ledgers whose transactions claw back (Clawback and ClawbackClaimableBalance)
[[finding.harness]]
target = "wallet-backend"
entries = ["explore.witnesses.g2-r0000-l74", "explore.witnesses.g2-r0000-l77"]
facts = ["token-event"]
problems = ["extra"]
events = ["burn"]

[[finding]]
id = "WB-W1"
title = "transaction participants from meta are never collected (participantsForMeta reads the TransactionMeta V0 arm)"
component = "wallet-backend"
severity = "data-loss"
status = "duplicate-of"
link = "https://github.com/stellar/wallet-backend/issues/677"
draft = "findings/issues/wallet-backend-W1.md"
cause = "participantsForMeta switches on `meta.Operations`, the V0 arm of the TransactionMeta union, which is nil for v1 to v4 meta, so accounts that only the meta shows (the sponsor of a claimed or clawed-back claimable balance) are never participants, while accounts only the envelope names (claimants, a payment destination that is the issuer) are. The extra envelope-named participants match wallet-backend's documented rule (docs/architecture/state-changes.md L119-L124); the dropped meta-only ones are the bug. Already reported upstream as #677 (open); the draft is a comment for it with a concrete dropped sponsor."

[[finding.harness]]
target = "wallet-backend"
facts = ["participant"]
problems = ["dropped", "extra"]

[[finding]]
id = "WB-W2"
title = "question: BALANCE rows for claimable balance and liquidity pool transfers do not record the balance or pool"
component = "wallet-backend"
severity = "data-loss"
status = "filed"
link = "https://github.com/stellar/wallet-backend/issues/812"
draft = "findings/issues/wallet-backend-W2.md"
related = ["https://github.com/stellar/wallet-backend/pull/442"]
cause = "BALANCE rows are written per account; the claimable balance (B) or liquidity pool (L) end of a transfer has no row, so the stored transfer has a null counterparty and the ledger's transfer event to or from the B or L address has no counterpart. The single row is documented (docs/architecture/state-changes.md L67-L68, from #442), so the draft asks whether the B or L address belongs in it."

[[finding.harness]]
target = "wallet-backend"
facts = ["token-event"]
problems = ["dropped"]
events = ["transfer"]
prefix = { to = ["B", "L"] }

[[finding.harness]]
target = "wallet-backend"
facts = ["token-event"]
problems = ["dropped"]
events = ["transfer"]
prefix = { from = ["B", "L"] }

[[finding.harness]]
target = "wallet-backend"
facts = ["token-event"]
problems = ["extra"]
events = ["transfer"]
null = ["to"]

[[finding.harness]]
target = "wallet-backend"
facts = ["token-event"]
problems = ["extra"]
events = ["transfer"]
null = ["from"]

# an issuer's create claimable balance mints into the balance: the credit row of a B
# destination is skipped (handleMint, internal/indexer/processors/token_transfer.go L336-L340 at
# 3e22515a, the same skip as for transfers), so only the issuer's MINT row is stored
[[finding.harness]]
target = "wallet-backend"
facts = ["token-event"]
problems = ["dropped"]
events = ["mint"]
prefix = { to = ["B", "L"] }

[[finding.harness]]
target = "wallet-backend"
entries = ["explore.witnesses.f62d-r0000-l73", "explore.witnesses.f63-p23-r0002-l79"]
facts = ["token-event"]
problems = ["extra"]
events = ["mint"]

[[finding]]
id = "WB-W4"
title = "a text, hash or return memo of a payment to a G address is stored nowhere"
component = "wallet-backend"
severity = "data-loss"
status = "filed"
link = "https://github.com/stellar/wallet-backend/issues/814"
draft = "findings/issues/wallet-backend-W4.md"
cause = "CAP-67 puts the transaction memo of a payment to a G address into the transfer event's `to_muxed_id` as u64, string or bytes; wallet-backend stores `to_muxed_id` only for u64 values and no table has a memo column, so text, hash and return memos are stored nowhere."

[[finding.harness]]
target = "wallet-backend"
facts = ["token-event"]
problems = ["wrong-value"]
detail_contains = "to_muxed_id"

[[finding]]
id = "WB-W5"
title = "contract deployments that no auth entry declares (factory deploys, Stellar Asset Contracts) record no contract creation"
component = "wallet-backend"
severity = "data-loss"
status = "filed"
link = "https://github.com/stellar/wallet-backend/issues/815"
draft = "findings/issues/wallet-backend-W5.md"
cause = "Contract creation rows come only from the operation's own CreateContract with a FromAddress preimage and from CreateContract invocations declared in auth entries, so a contract deployed by another contract without an auth entry, and any Stellar Asset Contract deployment, gets no ACCOUNT CREATE row although the meta creates the instance."

[[finding.harness]]
target = "wallet-backend"
facts = ["contract-deployed"]
problems = ["dropped"]

[[finding]]
id = "WB-W6"
title = "an XLM transfer through the native asset contract that creates the destination account records no account creation"
component = "wallet-backend"
severity = "data-loss"
status = "filed"
link = "https://github.com/stellar/wallet-backend/issues/816"
draft = "findings/issues/wallet-backend-W6.md"
cause = "From protocol 26 (CAP-73) an XLM SAC transfer to a missing G account creates it; wallet-backend writes ACCOUNT CREATE only for CreateAccount operations, so the new account gets a credit but no creation row."

[[finding.harness]]
target = "wallet-backend"
facts = ["account-created"]
problems = ["dropped"]

[[finding]]
id = "WB-W7"
title = "a pool-share trustline removed by an authorization revocation records no trustline removal"
component = "wallet-backend"
severity = "data-loss"
status = "filed"
link = "https://github.com/stellar/wallet-backend/issues/817"
draft = "findings/issues/wallet-backend-W7.md"
cause = "Revoking authorization with SetTrustLineFlags or AllowTrust redeems the holder's pool shares and removes the pool-share trustline (CAP-38). The removal is in the meta; wallet-backend writes no TRUSTLINE REMOVE for it."

[[finding.harness]]
target = "wallet-backend"
facts = ["trustline-removed"]
problems = ["dropped"]

[[finding]]
id = "WB-W8"
title = "a pre-auth signer core removes in txChangesBefore is never recorded as removed (failed transactions, fee bumps)"
component = "wallet-backend"
severity = "data-loss"
status = "filed"
link = "https://github.com/stellar/wallet-backend/issues/818"
draft = "findings/issues/wallet-backend-W8.md"
cause = "Core removes a transaction's pre-auth signer in txChangesBefore whether the transaction succeeds or fails, and a fee bump's from the fee source before the inner transaction; wallet-backend derives SIGNER rows only from operation effects of successful transactions, so neither removal is stored."

[[finding.harness]]
target = "wallet-backend"
facts = ["signer-removed"]
problems = ["dropped"]

[[finding]]
id = "WB-W9"
title = "question: CreateAccount writes a SIGNER ADD row for the new account's master key (Horizon parity); intended for state changes?"
component = "wallet-backend"
severity = "wrong-data"
status = "filed"
link = "https://github.com/stellar/wallet-backend/issues/819"
draft = "findings/issues/wallet-backend-W9.md"
cause = "Following Horizon's effects (the code says it was ported from them), account creation emits a signer-created state change for the master key, and set options treats the master key as a signer while its weight is above 0. The ledger has no signer entry: the master key's weight is byte 0 of the account's thresholds. Likely intended; the draft asks, and what it would cost consumers is that the row looks like a signer entry."

[[finding.harness]]
target = "wallet-backend"
facts = ["signer-added"]
problems = ["extra"]

# wallet-backend, current pin, indexerlint

[[finding]]
id = "WB-L1"
title = "ContractDeployProcessor walks the declared auth invocation tree with no depth limit (indexerlint IDX002)"
component = "wallet-backend"
severity = "robustness"
status = "filed"
link = "https://github.com/stellar/wallet-backend/issues/820"
draft = "findings/issues/wallet-backend-L1.md"
caps = ["CAP-0046"]
related = ["https://github.com/stellar/wallet-backend/issues/746"]
cause = "The walkInvocation closure in (*ContractDeployProcessor).ProcessOperation recurses over xdr.SorobanAuthorizedInvocation with no depth counter. The walk runs only for successful transactions, and the decoder (depth 1500) and core (envelopes nested deeper than 1000 XDR levels are refused from protocol 28) bound it today, so it is a hardening finding, not a halt."

[[finding.lint]]
target = "wallet-backend"
rule = "IDX002"
package = "github.com/stellar/wallet-backend/internal/indexer/processors"
function = "(*ContractDeployProcessor).ProcessOperation"

# go-stellar-sdk

[[finding]]
id = "GO-1"
title = "strkey.Decode, DecodeAny and IsValidClaimableBalance accept a claimable balance id whose type byte is not v0"
component = "go-stellar-sdk"
severity = "divergence"
status = "filed"
link = "https://github.com/stellar/go-stellar-sdk/issues/6046"
draft = "findings/issues/go-cap23.claimable-balances.synth-strkey-b-invalid.md"
cause = "strkey.Decode, DecodeAny and IsValidClaimableBalance check a B key's length but not its claimable balance id type byte, so ids of types the protocol does not define decode, while xdr.ClaimableBalanceId.DecodeFromStrkey refuses them."

[[finding.conformance]]
sdk = "go"
entries = ["cap23.claimable-balances.synth-strkey-b-invalid"]

[[finding]]
id = "GO-2"
title = "v0.7.1 strkey decoders accept payloads of the wrong length"
component = "go-stellar-sdk"
severity = "divergence"
status = "duplicate-of"
link = "https://github.com/stellar/go-stellar-sdk/pull/5977"
cause = "v0.7.1 Decode and DecodeAny do not check the payload length against the version byte. Fixed in v0.7.2 by #5977; reproduced on the pre-fix release only."

[[finding.conformance]]
sdk = "go"
versions = ["v0.7.1"]
entries = ["*.synth-strkey-*-invalid"]

[[finding]]
id = "GO-3"
title = "v0.7.1 orders asset issuers by strkey text and derives a pool id for a pair of one asset with itself"
component = "go-stellar-sdk"
severity = "divergence"
status = "duplicate-of"
link = "https://github.com/stellar/go-stellar-sdk/pull/5974"
cause = "v0.7.1 xdr.Asset.LessThan compares issuers as strkey text instead of key bytes, and NewPoolId accepts equal assets. Fixed in v0.7.2 by #5974; reproduced on the pre-fix release only."

[[finding.conformance]]
sdk = "go"
versions = ["v0.7.1"]
entries = ["cap38.liquidity-pools.synth-assets-*"]

[[finding]]
id = "GO-4"
title = "xdr.DecodeOptions.MaxDepth counts fewer levels per nesting than stellar-xdr, so the sdk decodes envelopes nested deeper than core accepts"
component = "go-stellar-sdk"
severity = "robustness"
status = "filed"
link = "https://github.com/stellar/go-stellar-sdk/issues/6047"
draft = "findings/issues/go-soroban.auth-trees.synth-auth-depth-494-over-cap.md"
cause = "go-xdr spends one depth unit per named type, while stellar-xdr, which core runs at depth 1000 from protocol 28, also counts each optional and each array. On v0.9.0 the deepest auth chain decoded is 988 at MaxDepth 1000 (1488 at the default 1500) against core's 493, and the deepest nested ScVec argument 495 (745) against 246, so the sdk accepts auth trees and ScVals that core refuses."

[[finding.conformance]]
sdk = "go"
entries = [
  "soroban.auth-trees.synth-auth-depth-494-over-cap",
  "soroban.auth-trees.p30-declared-depth-493",
  "soroban.scval-shapes.synth-scmap-depth-198-over-cap",
  "soroban.scval-shapes.synth-scvec-depth-247-over-cap",
]

[[finding]]
id = "GO-5"
title = "strkey decoders before v0.9.0 accept strkeys with carriage returns, newlines or 0xff bytes added"
component = "go-stellar-sdk"
severity = "divergence"
status = "duplicate-of"
link = "https://github.com/stellar/go-stellar-sdk/pull/6026"
cause = "Decode, DecodeAny and Version checked the canonical length on the raw input, then go's encoding/base32 skipped carriage returns and newlines and read 0xff as padding, so such a string decoded to the payload of the strkey it was added to. Fixed in v0.9.0 by #6026, which rejects any byte outside the base32 alphabet first."

[[finding.conformance]]
sdk = "go"
versions = ["v0.7.1", "v0.7.2", "v0.7.3", "v0.8.0"]
entries = ["*.synth-strkey-*-noncanonical-chars"]

