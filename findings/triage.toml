[[finding]]
id = "JS-16X"
title = "16.x stops decoding at 200 nested types (js-xdr 4), below depths the network produces, and its StrKey decoders accept payloads 17.x refuses"
component = "js-stellar-sdk"
severity = "divergence"
status = "draft"
draft = "findings/issues/js-16x-backports.md"
related = [
  "https://github.com/stellar/js-stellar-sdk/pull/1766",
  "https://github.com/stellar/js-stellar-sdk/issues/1785",
  "https://github.com/stellar/js-stellar-sdk/issues/1789",
  "https://github.com/stellar/js-stellar-sdk/pull/1811",
  "https://github.com/stellar/js-stellar-sdk/pull/1828",
  "https://github.com/stellar/js-xdr/pull/155",
]
cause = "16.4.1 bundles js-xdr 4.0.0, whose decoders stop at 200 nested types: the deepest ScVal it decodes is 66 levels, below the host's 100, so it fails on recorded protocol 30 values and ledgers that 17.x (js-xdr 5, js-xdr#155) decodes. Its StrKey decoders also accept payloads of the wrong length (fixed on 17.x by #1583) and claimable balance ids with a non-zero type byte. RELEASE_POLICY.md gives the 16.x maintenance line parsing fixes, so the draft asks for these as parsing fixes; the other 16.x divergences are in JS-16X-POLICY."

[[finding.conformance]]
sdk = "js"
versions = ["16.3.0", "16.3.1", "16.4.1"]
entries = [
  "*.synth-strkey-*-invalid",
  "soroban.auth-trees.synth-auth-depth-493-deepest-accepted",
  "soroban.scval-shapes.synth-event-vec-depth-101",
  "soroban.scval-shapes.synth-scmap-depth-197-deepest-accepted",
  "soroban.scval-shapes.synth-scvec-depth-246-deepest-accepted",
  "soroban.auth-trees.p30-declared-depth-*",
  "soroban.scval-shapes.p30-*-depth-*",
  "soroban.scval-shapes.p30-map-mixed-keys-sorted-meta",
]

# the 16.x divergences the maintenance line does not take; listed after JS-16X so its
# depth and strkey cells stay there
[[finding]]
id = "JS-16X-POLICY"
title = "16.x keeps the map key order, map key collision, textual id and W address behaviour that 17.x changed"
component = "js-stellar-sdk"
severity = "divergence"
status = "wont-fix"
reason = "RELEASE_POLICY.md limits the 16.x maintenance line to regenerated XDR, parsing fixes and critical security fixes. A backport of the map collision fix (#1778) was asked for in #1898 and declined (closed 2026-11-13), and the 16.4.0 release notes document W addresses as unsupported on v16. Map key order (#1766) and canonical textual ids (#1785) were not asked about separately; they are named as out of scope in the JS-16X draft."
related = [
  "https://github.com/stellar/js-stellar-sdk/issues/1898",
  "https://github.com/stellar/js-stellar-sdk/pull/1766",
  "https://github.com/stellar/js-stellar-sdk/issues/1785",
  "https://github.com/stellar/js-stellar-sdk/issues/1789",
  "https://github.com/stellar/js-stellar-sdk/pull/1811",
]
cause = "16.3.1 and 16.4.1 backported issuer ordering and the protocol 30 xdr, but not ScVal map key ordering (#1766), map key collisions (#1789, fixed in 17.3.0 by #1778), canonical textual ids (#1785) or the W strkey codec (#1811)."

[[finding.conformance]]
sdk = "js"
versions = ["16.3.0", "16.3.1", "16.4.1"]
entries = [
  "soroban.scval-shapes.synth-map-*",
  "cap03.offer-liabilities.synth-textual-offer-id-*",
  "cap27.muxed-accounts.synth-textual-muxed-id-noncanonical",
  "cap84.muxed-contract.synth-strkey-w-valid",
]

[[finding]]
id = "JS-DEPTH"
title = "fromXdr decodes envelopes nested deeper than stellar-core accepts, and no maxDepth value matches core's limit"
component = "js-stellar-sdk"
severity = "robustness"
status = "draft"
draft = "findings/issues/js-soroban.auth-trees.synth-auth-depth-494-over-cap.md"
related = ["https://github.com/stellar/js-xdr/pull/155", "https://github.com/stellar/js-stellar-sdk/issues/1901", "https://github.com/stellar/js-stellar-sdk/pull/1902"]
cause = "Core refuses envelopes nested deeper than its decode limit; the sdk's default (1500 nested schemas since js-xdr#155) is wider and cannot be lowered through fromXdr, so the sdk accepts and re-encodes values core refuses. Through schema.decode with a maxDepth, core's boundary falls at a different value per shape, so no single value matches core. Related: #1901 (a valid ledger that fails to decode) and PR #1902 (raises the limit to 1550, which widens this gap)."

[[finding.conformance]]
sdk = "js"
versions = ["17.2.0", "17.2.1", "17.3.0", "17.4.0"]
entries = [
  "soroban.auth-trees.synth-auth-depth-494-over-cap",
  "soroban.auth-trees.p30-declared-depth-493",
  "soroban.scval-shapes.synth-scmap-depth-198-over-cap",
  "soroban.scval-shapes.synth-scvec-depth-247-over-cap",
]

# rs-stellar-xdr

[[finding]]
id = "RS-1"
title = "question: the XDR-JSON reader accepts 64-bit integer strings with a plus sign, \"-0\" or leading zeros"
component = "rs-stellar-xdr"
severity = "divergence"
status = "draft"
draft = "findings/issues/rust-cap03.offer-liabilities.synth-textual-offer-id-noncanonical.md"
cause = "NumberOrString passes a JSON string to str::parse, so \"+16\", \"-0\" and \"016\" read as 16 and 0; the crate's own tests assert this, so the draft is a question. The negative-id cases of the entry are not a reader bug: offerID is int64 in XDR and core refuses negative ids only in doCheckValid, so their corpus expectation (refusal by an XDR-JSON reader) needs correcting."

[[finding.conformance]]
sdk = "rust"
entries = ["cap03.offer-liabilities.synth-textual-offer-id-noncanonical"]

[[finding]]
id = "RS-2"
title = "the XDR-JSON reader stops at serde_json's recursion limit of 128, so values the crate writes as JSON cannot be read back"
component = "rs-stellar-xdr"
severity = "divergence"
status = "draft"
draft = "findings/issues/rust-soroban.auth-trees.synth-auth-depth-493-deepest-accepted.md"
cause = "to_xdr_json renders nested values of any depth the decoder accepts, but the reader uses serde_json with its default recursion limit, so deep auth trees, ScVals and events (including ones on recorded protocol 30 ledgers) do not round-trip through JSON."

[[finding.conformance]]
sdk = "rust"
entries = [
  "soroban.auth-trees.synth-auth-depth-493-deepest-accepted",
  "soroban.scval-shapes.synth-event-vec-depth-101",
  "soroban.scval-shapes.synth-scmap-depth-197-deepest-accepted",
  "soroban.scval-shapes.synth-scvec-depth-246-deepest-accepted",
  "soroban.auth-trees.p30-declared-depth-*",
  "soroban.scval-shapes.p30-*-depth-*",
  "soroban.scval-shapes.p30-map-mixed-keys-sorted-meta",
]

[[finding]]
id = "RS-3"
title = "bool decodes any u32 and reads everything but 1 as false, where core reads non-zero as true and go-stellar-sdk refuses"
component = "rs-stellar-xdr"
severity = "divergence"
status = "duplicate-of"
link = "https://github.com/stellar/rs-stellar-xdr/issues/622"
draft = "findings/issues/fuzz-rust-bool-non-canonical.md"
siblings = ["CORE-1"]
cause = "impl ReadXdr for bool returns i == 1 for any u32, so the word 2 decodes as false and re-encodes as 0, where go-stellar-sdk and js-stellar-sdk refuse it and core's xdrpp reads it as true. The differential fuzzer found the same class through every fuzzed type that carries a bool (findings/fuzz/known-classes.txt). Reported upstream as #622 (open); two unmerged upstream branches change the bool decode."

[[finding.conformance]]
sdk = "rust"
entries = ["soroban.scval-shapes.synth-bool-value-2"]

# stellar-core

[[finding]]
id = "CORE-1"
title = "core (xdrpp) accepts a bool word other than 0 or 1 as true and hashes its own re-encoding with 1"
component = "stellar-core"
severity = "robustness"
status = "draft"
draft = "findings/issues/stellar-core-bool-non-canonical.md"
siblings = ["RS-3"]
cause = "xdrpp's xdr_traits<bool>::from_uint is u != 0, and the enum check runs on the converted value, so core decodes any non-zero bool word as true. The transaction hash, the signature check and the protocol 28 rust parse check all use core's re-encoding (word 1), never the submitted bytes. In a local core 30.0.0 run an envelope with the word 2 signed over the canonical hash was applied with txSUCCESS and stored with 1; signed over the submitted bytes it got txBAD_AUTH. Low severity: no authorization bypass or fund loss, but the hash of the submitted bytes differs from core's transaction hash and stellar-xdr reads the same argument as false. The matched cells are the rust testee diverging from its peers on the envelope form (the fuzz classes in findings/fuzz/known-classes.txt are the same root cause)."

[[finding.conformance]]
sdk = "rust"
entries = ["soroban.invoke-basics.synth-invoke-arg-bool-2"]
