# the rust testee built against stellar-xdr 28.0.0. every version directory shares ../../src;
# only the pins differ. not a member of the root workspace.
[package]
name = "shapekit-testee-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false
autobins = false
autotests = false

[[bin]]
name = "shapekit-testee-rust"
path = "../../src/main.rs"

[dependencies]
base64 = "=0.23.1"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "unbounded_depth"] }
sha2 = "=0.11.1"
stellar-strkey = "=1.0.0"
stellar-xdr = { version = "=28.0.0", default-features = false, features = ["std", "serde", "serde_json", "type_enum"] }

[workspace]

[lints.rust]
# set by the coverage build (RUSTFLAGS="-C instrument-coverage --cfg shapekit_coverage")
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(shapekit_coverage)"] }
