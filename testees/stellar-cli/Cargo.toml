# the stellar-cli testee: one build that runs any stellar-cli release binary given as its
# first argument. not a member of the root workspace.
[package]
name = "shapekit-testee-stellar-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "=0.23.1"
hex = "=0.4.3"
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["unbounded_depth"] }

[workspace]
