# the soroban testee built against soroban-sdk 29.0.1. every version directory shares ../../src;
# only the pins differ. not a member of the root workspace.
[package]
name = "shapekit-testee-soroban"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false
autobins = false
autotests = false
build = "../../build.rs"

[[bin]]
name = "shapekit-testee-soroban"
path = "../../src/main.rs"

[dependencies]
base64 = "=0.23.1"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.11.1"
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }

[workspace]
