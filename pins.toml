# every upstream reference the project depends on, checked against the live
# source by `shapekit pins verify`. values were resolved from the upstream
# registries and git remotes, never typed in by hand.
#
# tables:
#   [[toolchain]]  name (rust, go, node, flutter, php, composer, dotnet), version, release artifact and its sha256
#                  (and sha512 where the upstream publishes only that)
#   [[image]]      docker hub repository, tag and manifest digest (the index digest for multi-arch images)
#   [[git]]        remote url, optional ref, commit sha. a ref without a sha is a
#                  deliberately floating ref (only checked to exist). a sha without a
#                  ref is a bare commit (checked by fetching it)
#   [[release]]    github release asset of a tool used as its official binary: repository,
#                  tag, the commit the tag names, asset file name and its sha256
#   [[crate]]      crates.io name, exact version and the .crate sha256
#   [[npm]]        npm package, version and dist integrity
#   [[gomod]]      go module, version and the vcs commit the go proxy reports
#   [[pypi]]       pypi distribution, version, one file of the release and its sha256
#   [[maven]]      maven central group, artifact, version, one file and its sha256 (verified by
#                  downloading the file, since central publishes no sha256 for most files)

schema = 1

