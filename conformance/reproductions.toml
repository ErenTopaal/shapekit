# the advisory is a json-to-xdr flaw: 28.0.0 reads a ScSpecFunctionV0 with two outputs from
# json (the xdr allows one) and writes bytes no decoder accepts. the corpus entry holds those
# bytes, which every version refuses to decode; the probe sends the advisory's json through
# encode_json, the only op that reaches the flaw.
[[reproduction]]
id = "rust-ghsa-3xhm-p452-9wjh"
sighting = "rs-stellar-xdr GHSA-3xhm-p452-9wjh: JSON deserialization ignored VecM maximum lengths"
link = "https://github.com/stellar/rs-stellar-xdr/security/advisories/GHSA-3xhm-p452-9wjh"
sdk = "rust"
entries = ["soroban.invoke-basics.synth-ghsa-3xhm-spec-outputs-2"]
fail = ["28.0.0"]
pass = ["28.0.1"]
must_diverge = [
  { probe = "advisory-json", checks = ["probe/encode_json"] },
]

[[reproduction.probe]]
name = "advisory-json"
op = "encode_json"
request = { type = "ScSpecFunctionV0", json = { doc = "", name = "f", inputs = [], outputs = ["u32", "u32"] } }
expect = "rejected"
source = "GHSA-3xhm-p452-9wjh: ScSpecFunctionV0.outputs is ScSpecTypeDef outputs<1>, so a value with two outputs is not representable and must be refused; 28.0.0 encoded it to AAAAAAAAAAFmAAAAAAAAAAAAAAIAAAAEAAAABA=="
