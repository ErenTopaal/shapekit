  { entry = "cap27.muxed-accounts.synth-textual-muxed-id-noncanonical", checks = ["case 1/id_parse", "case 2/id_parse", "case 3/id_parse", "case 4/id_parse", "case 5/id_parse", "case 6/id_parse", "case 7/id_parse", "case 8/id_parse", "case 9/id_parse", "case 10/id_parse", "case 12/id_parse"] },
