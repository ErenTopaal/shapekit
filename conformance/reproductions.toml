# upstream sightings the conformance runner must reproduce. each row names the
# corpus entries that carry the sighting's literal inputs, optionally only some of their ops,
# and the versions before and after the fix. `shapekit conformance reproduce` fails unless
# every row fails on each `fail` version and passes on each `pass` version. an unsupported or
# errored check makes a cell inconclusive, which also fails the command.
#
# must_diverge names the checks that carry the sighting, as the matrix names them, per entry
# (or per probe), each check once. a row fails on a version when every named check diverges
# with a wrong answer, or with failure = "panic" on its item by crashing, so a broad entry
# selection cannot hold through some other defect; it passes when every counted check passes.
# a version where checks diverge but not every named one in the named way is "diverges
# elsewhere", which holds for neither list. a version may not be listed under both fail and
# pass. a divergence on an entry from a protocol newer than the version knows counts as
# unsupported there, as in a run.
#
# a row with unsupported_not_counted (which must say why) leaves its unsupported checks out of
# the count; they are still listed in the output, and a cell with no counted check left, or
# with a named check unsupported, is inconclusive.

schema = 1

[[reproduction]]
id = "js-1766-issuer-order"
sighting = "js-stellar-sdk#1766: Asset.compare ordered issuers by strkey text instead of key bytes"
link = "https://github.com/stellar/js-stellar-sdk/pull/1766"
sdk = "js"
entries = ["cap38.liquidity-pools.synth-assets-js1766-issuers"]
ops = ["asset_order"]
fail = ["16.3.0", "17.2.0"]
pass = ["16.3.1", "17.2.1"]
must_diverge = [
  { entry = "cap38.liquidity-pools.synth-assets-js1766-issuers", checks = ["case 0/asset_order", "case 1/asset_order"] },
]

