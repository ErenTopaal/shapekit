  { argv = ["go", "build", "-tags", "shapekit_sdk_v0_7_1", "-modfile", "versions/v0.7.1.mod", "-o", "../../target/testees/go/v0.7.1/testee", "."], dir = "testees/go", env = { GOWORK = "off" } },
]
