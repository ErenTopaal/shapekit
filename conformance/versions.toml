# the sdk version matrix of the conformance runner (plan section 2.2) and how each testee is
# built and started. paths are relative to the repository root; `shapekit conformance run`
# runs the build steps in order, then starts `command` and checks that its hello reports
# exactly `package` and `version`.
#
# per sdk:
#   package          what hello must report as sdk
#   current          the version a plain `conformance run` uses
#   issues_repo      where draft-issues points the issues
#   timeout_ms       per-request timeout
#   memory           rlimit set in the testee between fork and exec. "as" caps the address
#                    space (rust, go reserve little up front); "data" caps private writable
#                    memory, used for node, whose v8 reserves a large PROT_NONE cage that an
#                    address-space cap would refuse before any data is touched
#
# per version, max_protocol is the newest protocol whose xdr that version knows; a failure on
# an entry generated at a later protocol is reported as unsupported rather than as a
# divergence. stellar-xdr 28.x is set to 29 because protocol 29 changed no xdr and there is no
# 29.x crate (plan R4). versions without it get no such allowance.
#
# rust: one source (testees/rust/src) with one thin cargo manifest and lock file per version
# under testees/rust/versions/<version>/, each built into its own target directory.
# go: one source (testees/go) built per version with an alternate module file
# testees/go/versions/<version>.mod (and its .sum) through go's -modfile flag, outside the
# go.work workspace, which -modfile cannot be combined with.
# js: one compiled testee (testees/js/dist) is copied next to a per-version install of the
# sdk under target/testees/js/<version>/, so node resolves @stellar/stellar-sdk to that
# version. each install is `npm ci` from the package.json and lock file committed under
# testees/js/versions/<version>/, so the sdk's own dependencies (js-xdr above all) are pinned
# too. 16.3.x and 17.2.x carry the stellar-xdr v28.0 definitions without cap-84, so they
# know protocol 29 (no xdr change); 16.4.1, 17.3.0 and 17.4.0 carry protocol 30.

schema = 1

[sdk.rust]
package = "stellar-xdr"
current = "30.0.0"
issues_repo = "stellar/rs-stellar-xdr"
issues_repo_by_op = { strkey_decode = "stellar/rs-stellar-strkey", strkey_encode = "stellar/rs-stellar-strkey" }
timeout_ms = 10000
memory = { resource = "as", mib = 4096 }

[[sdk.rust.versions]]
version = "28.0.0"
build = [
  { argv = ["cargo", "build", "--release", "--locked", "--manifest-path", "testees/rust/versions/28.0.0/Cargo.toml", "--target-dir", "target/testees/rust/28.0.0"] },
]
command = ["target/testees/rust/28.0.0/release/shapekit-testee-rust"]
max_protocol = 29

[[sdk.rust.versions]]
version = "28.0.1"
build = [
  { argv = ["cargo", "build", "--release", "--locked", "--manifest-path", "testees/rust/versions/28.0.1/Cargo.toml", "--target-dir", "target/testees/rust/28.0.1"] },
]
command = ["target/testees/rust/28.0.1/release/shapekit-testee-rust"]
max_protocol = 29

[[sdk.rust.versions]]
version = "30.0.0"
build = [
  { argv = ["cargo", "build", "--release", "--locked", "--manifest-path", "testees/rust/versions/30.0.0/Cargo.toml", "--target-dir", "target/testees/rust/30.0.0"] },
]
command = ["target/testees/rust/30.0.0/release/shapekit-testee-rust"]
max_protocol = 30

[sdk.go]
package = "github.com/stellar/go-stellar-sdk"
current = "v0.8.0"
issues_repo = "stellar/go-stellar-sdk"
timeout_ms = 10000
memory = { resource = "as", mib = 4096 }

[[sdk.go.versions]]
version = "v0.7.1"
build = [
  { argv = ["go", "build", "-modfile", "versions/v0.7.1.mod", "-o", "../../target/testees/go/v0.7.1/testee", "."], dir = "testees/go", env = { GOWORK = "off" } },
]
command = ["target/testees/go/v0.7.1/testee"]
max_protocol = 29

[[sdk.go.versions]]
version = "v0.7.2"
build = [
  { argv = ["go", "build", "-modfile", "versions/v0.7.2.mod", "-o", "../../target/testees/go/v0.7.2/testee", "."], dir = "testees/go", env = { GOWORK = "off" } },
]
command = ["target/testees/go/v0.7.2/testee"]
max_protocol = 29

[[sdk.go.versions]]
version = "v0.7.3"
build = [
  { argv = ["go", "build", "-modfile", "versions/v0.7.3.mod", "-o", "../../target/testees/go/v0.7.3/testee", "."], dir = "testees/go", env = { GOWORK = "off" } },
]
command = ["target/testees/go/v0.7.3/testee"]
max_protocol = 29

[[sdk.go.versions]]
version = "v0.8.0"
build = [
  { argv = ["go", "build", "-modfile", "versions/v0.8.0.mod", "-o", "../../target/testees/go/v0.8.0/testee", "."], dir = "testees/go", env = { GOWORK = "off" } },
]
command = ["target/testees/go/v0.8.0/testee"]
max_protocol = 30

[sdk.js]
package = "@stellar/stellar-sdk"
current = "17.4.0"
issues_repo = "stellar/js-stellar-sdk"
timeout_ms = 15000
memory = { resource = "data", mib = 4096 }

[[sdk.js.versions]]
version = "16.3.0"
build = [
  { argv = ["npm", "ci", "--no-audit", "--no-fund"], dir = "testees/js" },
  { argv = ["npm", "run", "build"], dir = "testees/js" },
  { argv = ["rm", "-rf", "target/testees/js/16.3.0"] },
  { argv = ["mkdir", "-p", "target/testees/js/16.3.0"] },
  { argv = ["cp", "testees/js/versions/16.3.0/package.json", "testees/js/versions/16.3.0/package-lock.json", "target/testees/js/16.3.0/"] },
  { argv = ["npm", "ci", "--no-audit", "--no-fund", "--ignore-scripts"], dir = "target/testees/js/16.3.0" },
  { argv = ["cp", "-R", "testees/js/dist", "target/testees/js/16.3.0/dist"] },
]
command = ["node", "target/testees/js/16.3.0/dist/main.js"]
max_protocol = 29

[[sdk.js.versions]]
version = "16.3.1"
build = [
  { argv = ["npm", "ci", "--no-audit", "--no-fund"], dir = "testees/js" },
  { argv = ["npm", "run", "build"], dir = "testees/js" },
  { argv = ["rm", "-rf", "target/testees/js/16.3.1"] },
  { argv = ["mkdir", "-p", "target/testees/js/16.3.1"] },
  { argv = ["cp", "testees/js/versions/16.3.1/package.json", "testees/js/versions/16.3.1/package-lock.json", "target/testees/js/16.3.1/"] },
  { argv = ["npm", "ci", "--no-audit", "--no-fund", "--ignore-scripts"], dir = "target/testees/js/16.3.1" },
  { argv = ["cp", "-R", "testees/js/dist", "target/testees/js/16.3.1/dist"] },
]
command = ["node", "target/testees/js/16.3.1/dist/main.js"]
max_protocol = 29

