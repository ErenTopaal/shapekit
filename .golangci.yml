version: "2"

run:
  timeout: 5m

linters:
  # standard is errcheck, govet, ineffassign, staticcheck and unused
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - modernize
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    misspell:
      locale: US
    nolintlint:
      # a suppression has to say why, same as indexerlint:ignore does
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    warn-unused: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
