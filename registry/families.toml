# shape families: one record per structural pattern the corpus must carry.
#
# signature fragments use the grammar in crates/shapekit-manifest/src/signature.rs. each fragment
# names one rare shape of the family; an entry belongs to the family when its signature matches
# at least one fragment, and coverage reports which fragments have entries. a fragment is either
# anchored at a type (`SignerKey:ed25519_signed_payload`, `ContractEventType=contract`) or a path
# suffix that starts with a delimiter (`.extra_signers#max`). every fragment below was checked
# against the stellar-xdr 30.0.0 json schema of LedgerCloseMeta and its reachable union arms.
#
# priority 1 is the highest demonstrated damage. 1 to 12 follow the evidence ordering: signed
# payload, muxed accounts, muxed contract, sac trust, auth trees, pool asset order, scmap order and
# collisions, max length, non-utf8 bytes, unified events, fee-bump muxed, lcm version transitions.
# 13 is shapes named as a risk without a recorded sighting, 14 is shapes added only so every
# indexer-visible cap has a family, 15 is the vectors of the xdr definitions, which belong to no cap.

schema_version = 1

[[family]]
id = "cap40.signed-payload-signer"
title = "Ed25519 signed-payload signers on accounts, in extra signers and in sponsorship revokes"
caps = ["CAP-0040"]
protocol_introduced = 19
protocol_valid = { min = 19 }
signature = [
    "SignerKey:ed25519_signed_payload",
    ":ed25519_signed_payload.payload#one",
    ":ed25519_signed_payload.payload#many",
    ":ed25519_signed_payload.payload#max",
    ".body:set_options.signer.key:ed25519_signed_payload",
    ".extra_signers[]:ed25519_signed_payload",
    ".body:revoke_sponsorship:signer.signer_key:ed25519_signed_payload",
    ".signers[].key:ed25519_signed_payload",
]
source_classes = ["local-core", "testnet-history", "synthetic", "local-core-refused"]
fields = [
    "signer_key.signed_payload.payload",
    "op.set_options.signer",
    "tx.cond.extra_signers",
    "op.revoke_sponsorship",
    "tx.signatures.hint",
    "tx.signatures",
]
linked_issues = [
    "https://github.com/stellar/wallet-backend/pull/729",
    "https://github.com/stellar/wallet-backend/issues/716",
]
priority = 1
notes = "payloads of 1, 4, 32 and 64 bytes give the one, many and max buckets. a second chain is recorded at protocol 28 for the pre-fix wallet-backend commits. testnet-history is ledger 4437357, named by wallet-backend#729. the hint xor and use of the signer to authorise a transaction are checked by the recipe; the grammar has no fragment for a decorated signature matched to a signer"

