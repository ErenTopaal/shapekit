[[field]]
id = "op.invoke_host_function.auth"
xdr_path = "InvokeHostFunctionOp.auth"
validated_by_core = "partial"
checks = "core never inspects auth entries; it serializes them and hands them to the host. at the start of execution the host decodes every entry and converts its address, signature ScVal and invocation tree to host objects, so an entry that cannot be converted fails the operation. signatures, nonces and expiration are then checked lazily, only for an entry that a require_auth call matches. there is no check that every entry was used, so a declared entry that is never matched is never authenticated"
protocol_min = 20
risk = "declared auth entries are submitter claims; an unmatched entry can name any address with any signature and still appear in a successful transaction. unbounded trees halted wallet-backend ingestion"
handling = "never derive participants or authorizations from declared entries; use events and meta; cap recursion when walking"
go_accessors = ["xdr.InvokeHostFunctionOp.Auth", "xdr.SorobanAuthorizationEntry.Credentials", "xdr.SorobanAuthorizationEntry.RootInvocation"]
citations = [
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/InvokeHostFunctionOpFrame.cpp", symbol = "InvokeHostFunctionApplyHelper::invokeHostFunction", lines = "664-712" },
  { repo = "stellar/rs-soroban-env", ref = "v30.0.0", path = "soroban-env-host/src/e2e_invoke.rs", symbol = "invoke_host_function", lines = "517-522" },
  { repo = "stellar/rs-soroban-env", ref = "v30.0.0", path = "soroban-env-host/src/auth.rs", symbol = "AuthorizationManager::new_enforcing", lines = "945-965" },
  { repo = "stellar/rs-soroban-env", ref = "v30.0.0", path = "soroban-env-host/src/auth.rs", symbol = "AuthorizationManager::require_auth_enforcing", lines = "1227-1295" },
  { repo = "stellar/rs-soroban-env", ref = "v30.0.0", path = "soroban-env-host/src/auth.rs", symbol = "AccountAuthorizationTracker::maybe_authorize_invocation", lines = "2474-2520" },
]

