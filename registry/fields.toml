]

[[field]]
id = "tx.signatures"
xdr_path = "TransactionV1Envelope.signatures"
validated_by_core = "yes"
checks = "at most 20 by xdr. source account signers must reach the low threshold (txBAD_AUTH), each operation source must reach its op threshold (opBAD_AUTH), and from protocol 19 every extra signer must be satisfied. every signature must be used by some signer or the transaction is txBAD_AUTH_EXTRA. from protocol 28 at most 1000 ed25519 verifications per transaction. at apply, from protocol 13, signature checking stops early when the transaction already failed validation, so a failed transaction can carry signatures that were never verified"
protocol_min = 0
risk = "signatures on a failed transaction are not proof of anything; a signature count says nothing about which signer signed"
handling = "derive signer participation from signer changes in meta, not from the signature list; only treat signatures as verified on successful transactions"
go_accessors = ["xdr.TransactionV1Envelope.Signatures", "xdr.TransactionEnvelope.Signatures"]
citations = [
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/SignatureChecker.cpp", symbol = "SignatureChecker::checkSignature", lines = "46-169" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/SignatureChecker.cpp", symbol = "SignatureChecker::checkAllSignaturesUsed", lines = "171-191" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/TransactionFrame.cpp", symbol = "TransactionFrame::processSignatures", lines = "1516-1578" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/TransactionFrame.cpp", symbol = "TransactionFrame::checkAllTransactionSignatures", lines = "503-528" },
]
notes = "the 1000 verification budget is SignatureChecker::TX_ED25519_VERIFY_BUDGET (SignatureChecker.h line 50), gated by TX_ED25519_VERIFY_BUDGET_PROTOCOL_VERSION = 28 (util/ProtocolVersion.h line 85)"

[[field]]
id = "tx.signatures.hint"
xdr_path = "DecoratedSignature.hint"
validated_by_core = "partial"
checks = "the hint is only a filter: core tries a signer only when the hint equals the last 4 bytes of the ed25519 key (or of the hash-x hash). for a signed-payload signer the expected hint is the last 4 bytes of the key xor the payload hint; getHint copies the last 4 payload bytes, or, for a payload shorter than 4 bytes, the payload into the start of the hint. pre-auth-tx signers use no signature and no hint"
protocol_min = 0
risk = "4 bytes are not unique; two signers can share a hint, so a hint does not identify the signer"
handling = "never key or attribute signers by hint; if a signer must be attributed, verify the signature against candidate keys yourself"
go_accessors = ["xdr.DecoratedSignature.Hint"]
citations = [
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/SignatureUtils.cpp", symbol = "SignatureUtils::verify", lines = "38-46" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/SignatureUtils.cpp", symbol = "SignatureUtils::getSignedPayloadHint", lines = "93-105" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/SignatureUtils.cpp", symbol = "SignatureUtils::getHint", lines = "107-125" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/SignatureUtils.cpp", symbol = "SignatureUtils::doesHintMatch", lines = "127-136" },
]

[[field]]
id = "tx.signatures.signature"
xdr_path = "DecoratedSignature.signature"
validated_by_core = "yes"
checks = "ed25519 signers: ed25519 verify over the transaction contents hash, sha256(networkID, envelope type, tx). hash-x signers: sha256(signature) must equal the hash, so the signature field is the preimage (up to 64 bytes). signed-payload signers: ed25519 verify over the raw payload bytes, with no network id and no hashing"
protocol_min = 0
risk = "a signed-payload signature is not bound to any network or transaction; hash-x signatures reveal a preimage, not a signature"
handling = "do not treat a signed-payload signature as transaction-specific or network-specific; store signature bytes as opaque, up to 64 bytes"
go_accessors = ["xdr.DecoratedSignature.Signature"]
citations = [
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/SignatureUtils.cpp", symbol = "SignatureUtils::verifyEd25519SignedPayload", lines = "48-61" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/SignatureUtils.cpp", symbol = "SignatureUtils::verifyHashX", lines = "83-91" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/TransactionFrame.cpp", symbol = "TransactionFrame::getContentsHash", lines = "153-180" },
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-types.x", symbol = "Signature", lines = "82-84" },
]

