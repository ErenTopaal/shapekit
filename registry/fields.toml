[[field]]
id = "auth.credentials.address.signature"
xdr_path = "SorobanAddressCredentials.signature"
validated_by_core = "partial"
checks = "converted to a host value up front (so it must be a convertible ScVal). verified only when matched: for an account address it must be a vec of 1 to 20 {public_key, signature} entries in strictly increasing key order, each an ed25519 signature over sha256 of the HashIdPreimage (network id, nonce, expiration, invocation, plus the address for the v2 and delegates credential types), each key a signer of the account, total weight >= the medium threshold; for a contract address the value is passed to the contract's __check_auth"
protocol_min = 20
risk = "an arbitrary nested ScVal on unmatched entries; even on matched contract entries its shape is contract-defined"
handling = "treat as opaque; decode with depth limits; never infer signers from it"
go_accessors = ["xdr.SorobanAddressCredentials.Signature"]
citations = [
  { repo = "stellar/rs-soroban-env", ref = "v30.0.0", path = "soroban-env-host/src/builtin_contracts/account_contract.rs", symbol = "check_account_authentication", lines = "175-263" },
