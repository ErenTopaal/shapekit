[[field]]
id = "auth.root_invocation"
xdr_path = "SorobanAuthorizationEntry.rootInvocation"
validated_by_core = "partial"
checks = "core does not look at it. the host converts the whole tree up front (contract addresses, function names as symbols, args to host values), then matches nodes lazily against actual require_auth calls; subtrees that never match are never compared with anything that ran"
protocol_min = 20
risk = "recursive, bounded only by xdr depth and tx size; an unmatched subtree can describe calls that never happened"
handling = "cap depth and node count when walking; take actual calls from events"
