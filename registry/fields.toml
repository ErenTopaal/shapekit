# which transaction envelope fields stellar-core v30.0.0 validates, field by field.
# every row cites the source it was read from. "yes" means core rejects the
# transaction (or fails the operation) when the value is wrong; "partial" means
# only some properties are checked, or the check happens later inside the
# soroban host and only on some paths; "no" means core passes the value through.
#
# a caveat that applies to every "yes" row: checks that run at apply time only
# fail the operation or transaction, and failed transactions are still in the
# ledger with their envelope. a value is only known good when the transaction
# result (and the operation result) is a success.

schema_version = 1

# ---------------------------------------------------------------- envelope

[[field]]
id = "tx.envelope.type"
xdr_path = "TransactionEnvelope.type"
validated_by_core = "yes"
checks = "before protocol 13 any ENVELOPE_TYPE_TX or any muxed account anywhere in the envelope gives txNOT_SUPPORTED; from protocol 13 ENVELOPE_TYPE_TX_V0 gives txNOT_SUPPORTED. fee bump envelopes give txNOT_SUPPORTED before protocol 13. every envelope must also parse with the rust xdr parser of the ledger protocol (depth 500 c++ check before protocol 28, rust depth 1000 from 28) or it is txMALFORMED"
protocol_min = 0
risk = "an indexer that only handles v1 envelopes drops or crashes on v0 envelopes in pre-13 history and on fee bumps from 13 on"
handling = "switch on all three arms; treat v0 as history-only and fee bump as a wrapper whose inner v1 transaction carries the operations"
go_accessors = ["xdr.TransactionEnvelope.Type", "xdr.TransactionEnvelope.GetV0", "xdr.TransactionEnvelope.GetV1", "xdr.TransactionEnvelope.GetFeeBump", "xdr.TransactionEnvelope.IsFeeBump"]
citations = [
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/TransactionFrame.cpp", symbol = "TransactionFrame::commonValidPreSeqNum", lines = "1254-1264" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/FeeBumpTransactionFrame.cpp", symbol = "FeeBumpTransactionFrame::commonValidPreSeqNum", lines = "387-400" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/TransactionUtils.cpp", symbol = "validateXDRForProtocol", lines = "1349-1380" },
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-transaction.x", symbol = "TransactionEnvelope", lines = "1002-1010" },
]

[[field]]
id = "tx.v0.source_account_ed25519"
xdr_path = "TransactionV0Envelope.tx.sourceAccountEd25519"
validated_by_core = "yes"
checks = "core rebuilds an AccountID from the raw 32 bytes and applies the same existence and signature checks as for v1 sources; the whole v0 arm is rejected from protocol 13"
protocol_min = 0
protocol_max = 12
risk = "v0 has no key type discriminant, so code that expects a MuxedAccount here misreads the bytes"
handling = "wrap the 32 bytes as an ed25519 account id (G strkey); never expect a mux id in v0"
go_accessors = ["xdr.TransactionV0.SourceAccountEd25519", "xdr.TransactionEnvelope.SourceAccount"]
citations = [
