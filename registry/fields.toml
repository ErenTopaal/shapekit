[[field]]
id = "tx.source_account.mux_id"
xdr_path = "Transaction.sourceAccount(KEY_TYPE_MUXED_ED25519).med25519.id"
validated_by_core = "no"
checks = "never compared, never looked up, never stored in a ledger entry. toAccountID discards it. outside tests the only reads of med25519().id copy it into classic and soroban events (makeMuxedAccountAddress, makeMuxIDSCVal) and the json dumper. before protocol 13 any muxed account makes the transaction txNOT_SUPPORTED (hasMuxedAccount checks only the key type). from protocol 25 a soroban invoke transaction with a muxed source is txSOROBAN_INVALID"
protocol_min = 13
risk = "any 64-bit value, chosen by the submitter, with no account behind it. trusting it as an account id, or storing a muxed address in a 32-byte column, truncates or fabricates identities (wallet-backend#716)"
handling = "store the base account and the mux id separately, the id as an unsigned 64-bit value; never treat an M address as an account that exists; key balances by the base account"
