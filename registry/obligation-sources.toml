# obligation fragments merged into corpus/coverage/obligations.json by `shapekit coverage`.
# each file is an obligation ledger (schema/obligations.schema.json) one producer wrote; paths
# are relative to the repository root. every *.obligations.json under conformance/, registry/,
# corpus/ and candidate/ must be listed, so a new producer cannot be left out of the ledger.

schema_version = 1
files = [
  "conformance/dataset/core-test-sections.obligations.json",
  "conformance/seed-check/go.obligations.json",
  "conformance/seed-check/js.obligations.json",
  "conformance/seed-check/rust.obligations.json",
  "registry/generated/validation.obligations.json",
]
