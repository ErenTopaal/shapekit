  { network = "mainnet", rpc = "https://mainnet.sorobanrpc.com", setting = "CONFIG_SETTING_CONTRACT_MAX_SIZE_BYTES", value = "131072", read_at = "2026-11-12", ledger = 65441861 },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/TransactionUtils.cpp", symbol = "validateContractLedgerEntry (maxContractSizeBytes < entrySize)", value = "maxContractSizeBytes" },
]
