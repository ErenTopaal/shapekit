# indexer-side state

[[limit]]
id = "state_changes.per_tx.query"
applies_to = "state change rows materialised per transaction when serving an account-history page (query time only, never at ingestion)"
recommended = 2000
unit = "rows"
derived_from = [
  { repo = "stellar/wallet-backend", ref = "5c780dd8cee2c1b9b1aec49e84928e33de1be394", path = "internal/data/statechanges.go", symbol = "maxAccountStateChangesPerToID", value = "2000" },
]
rationale = "wallet-backend PR #757 bounds BatchGetAccountStateChangesByToIDs at 2000 rows per transaction with a ROW_NUMBER window; its comment calls the value a ceiling chosen from mainnet data. It is not a protocol bound: rows beyond it are dropped from the page, so apply it only to serving and keep every row at ingestion. The 4096 figure that circulates for this PR is the TOID operation-index range used by the operations loader (internal/data/operations.go), not a state-change cap."

# claimable balances, paths, offers

[[limit]]
id = "claim_predicate.depth"
applies_to = "ClaimPredicate recursion (and, or, not) in CreateClaimableBalance operations and ClaimableBalanceEntry"
recommended = 4
unit = "levels"
derived_from = [
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/CreateClaimableBalanceOpFrame.cpp", symbol = "validatePredicate (depth > 4 fails; called with depth 1)", value = "4" },
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-ledger-entries.x", symbol = "ClaimPredicate andPredicates<2>, orPredicates<2>, notPredicate*", value = "2 children" },
]
rationale = "Core starts validatePredicate at depth 1 and fails CreateClaimableBalance when depth exceeds 4, so a stored predicate has at most 4 levels and, with at most 2 children per node, at most 2^4 - 1 = 15 nodes. A failed CreateClaimableBalance still carries a deeper predicate in its envelope, which is bounded only by xdr.envelope.depth."

[[limit]]
id = "claimants.per_balance"
applies_to = "claimants in CreateClaimableBalanceOp and ClaimableBalanceEntry"
recommended = 10
unit = "claimants"
derived_from = [
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-ledger-entries.x", symbol = "ClaimableBalanceEntry claimants<10>", value = "10" },
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-transaction.x", symbol = "CreateClaimableBalanceOp claimants<10>", value = "10" },
]
rationale = "XDR bound."

[[limit]]
id = "path.len"
applies_to = "intermediate assets in PathPaymentStrictReceive and PathPaymentStrictSend"
recommended = 5
unit = "assets"
derived_from = [
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-transaction.x", symbol = "PathPaymentStrictReceiveOp path<5>, PathPaymentStrictSendOp path<5>", value = "5" },
]
rationale = "XDR bound. The full conversion path is the send asset, up to 5 hops and the destination asset."

[[limit]]
id = "offers.crossed.per_op"
applies_to = "order-book claim atoms in one ManageOffer or path payment operation result, summed over all hops"
recommended = 1000
unit = "offers"
protocol_min = 11
derived_from = [
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/TransactionUtils.cpp", symbol = "MAX_OFFERS_TO_CROSS", value = "1000" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/PathPaymentStrictSendOpFrame.cpp", symbol = "maxOffersToCross (one budget for the whole operation, decremented per hop)", value = "1000" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/OfferExchange.cpp", symbol = "convertWithOffers (maxOffersToCross == INT64_MAX before protocol version 11)", value = "unbounded before protocol 11" },
]
rationale = "From protocol 11 an operation crosses at most MAX_OFFERS_TO_CROSS = 1000 offers across all of its hops. Before protocol 11 there was no limit, so do not apply this cap to older ledgers."

# transaction shape

[[limit]]
id = "tx.operations"
applies_to = "operations in one transaction"
recommended = 100
unit = "operations"
derived_from = [
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-transaction.x", symbol = "MAX_OPS_PER_TX", value = "100" },
]
rationale = "Transaction and TransactionV0 declare operations<MAX_OPS_PER_TX> with MAX_OPS_PER_TX = 100. A Soroban transaction has exactly one operation."

[[limit]]
id = "tx.signatures"
applies_to = "DecoratedSignature entries in one envelope signature list"
recommended = 20
unit = "signatures"
derived_from = [
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-transaction.x", symbol = "TransactionV0Envelope, TransactionV1Envelope, FeeBumpTransactionEnvelope signatures<20>", value = "20" },
]
rationale = "XDR bound per signature list. A fee-bump envelope has its own list and the inner envelope's, so up to 2 * 20 = 40 signatures in total."

[[limit]]
id = "tx.extra_signers"
applies_to = "PreconditionsV2.extraSigners"
recommended = 2
unit = "signer keys"
derived_from = [
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-transaction.x", symbol = "PreconditionsV2 extraSigners<2>", value = "2" },
]
rationale = "XDR bound (CAP-21)."

[[limit]]
id = "tx.memo_text.len"
applies_to = "MEMO_TEXT bytes"
recommended = 28
unit = "bytes"
derived_from = [
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-transaction.x", symbol = "Memo text<28>", value = "28" },
]
rationale = "XDR bound. The bound is in bytes, not characters, and the bytes are not required to be UTF-8; store them as bytes or validate before converting to text."

[[limit]]
id = "signer.signed_payload.len"
applies_to = "payload of an ED25519_SIGNED_PAYLOAD signer key (strkey P)"
recommended = 64
unit = "bytes"
derived_from = [
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-types.x", symbol = "SignerKey ed25519SignedPayload payload<64>", value = "64" },
]
rationale = "XDR bound (CAP-40). A signed-payload signer is therefore up to 32 + 4 + 64 = 100 bytes of key material, which does not fit a 32-byte account column."

[[limit]]
id = "account.signers"
applies_to = "signers on one AccountEntry and its signerSponsoringIDs"
recommended = 20
unit = "signers"
derived_from = [
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-ledger-entries.x", symbol = "MAX_SIGNERS", value = "20" },
]
rationale = "AccountEntry signers<MAX_SIGNERS> and AccountEntryExtensionV2 signerSponsoringIDs<MAX_SIGNERS> with MAX_SIGNERS = 20."

[[limit]]
id = "account.subentries"
applies_to = "numSubEntries of one account (trustlines, offers, data entries, signers)"
recommended = 1000
unit = "subentries"
protocol_min = 11
derived_from = [
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/TransactionUtils.cpp", symbol = "ACCOUNT_SUBENTRY_LIMIT", value = "1000" },
  { repo = "stellar/stellar-core", ref = "v30.0.0", path = "src/transactions/SponsorshipUtils.cpp", symbol = "numSubEntries > getAccountSubEntryLimit() - mult, from FIRST_PROTOCOL_SUPPORTING_OPERATION_LIMITS", value = "protocol 11" },
]
rationale = "From protocol 11 (FIRST_PROTOCOL_SUPPORTING_OPERATION_LIMITS) core refuses to add subentries that would take an account past ACCOUNT_SUBENTRY_LIMIT = 1000. Older ledgers had no such limit."

[[limit]]
id = "ledger.upgrades"
applies_to = "UpgradeType entries in StellarValue.upgrades"
recommended = 6
unit = "upgrades"
derived_from = [
  { repo = "stellar/stellar-xdr", ref = "v30.0", path = "Stellar-ledger.x", symbol = "StellarValue upgrades<6>; typedef opaque UpgradeType<128>", value = "6 entries of at most 128 bytes" },
]
rationale = "XDR bound: at most 6 upgrades per ledger, each at most 128 bytes."
