reason = "the arm itself: TransactionFrame::commonValidPreSeqNum checks frozen keys against the network config (stellar-core v30.0.0), which only changes through config upgrades applied after a ledger's transactions, so validation already refused any transaction that fails at apply; none of the 1732 core golden files (test-lcm-current and test-lcm-next) holds it"

[[fragment]]
family = "cap01.bump-sequence"
fragment = "BumpSequenceResult:bad_seq"
blocker = "refused-before-ledger"
reason = "the arm itself: set only in the operation's doCheckValid (stellar-core v30.0.0 src/transactions/*OpFrame.cpp), which reads nothing but the operation and the protocol, so the tx queue and tx set validation refuse the transaction and the identical check at apply never fails"

[[planned]]
family = "soroban.muxed-source"
shape = "a protocol 24 invoke_host_function with a muxed transaction or operation source, accepted into a ledger"
blocker = "not-producible-locally"
reason = "before protocol 25 the memo and muxed-source rule lives in TransactionQueue::canAdd and from 25 in TransactionFrame::commonValidPreSeqNum (stellar-core v30.0.0), and the standalone tx endpoint goes through the queue, so a local core refuses it at every protocol; only a validator nominating it directly could, so it can exist only in public history before protocol 25"

