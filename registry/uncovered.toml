blocker = "refused-before-ledger"
reason = "ManageDataOpFrame::doCheckValid sets it only before protocol 2 (stellar-core v30.0.0). core 30.0.0 still runs a fresh network at protocol 1 and refuses ManageData there at submission with this code (classic.failed-tx.manage-data.p1); a validity check keeps it out of the tx queue and of tx set validation, so no ledger at any protocol holds it"

