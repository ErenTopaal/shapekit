    "InnerTransactionResultResult:tx_insufficient_fee",
]
blocker = "refused-before-ledger"
reason = "set in TransactionFrame::commonValidPreSeqNum from the envelope, the header's base fee and the protocol alone (stellar-core v30.0.0); the same inputs hold at apply, so a transaction failing it is trimmed from every tx set"

[[arm]]
