blocker = "refused-before-ledger"
reason = "refused in Soroban footprints (TransactionFrame footprintKeyIsValid) and in revoke sponsorship (RevokeSponsorshipOpFrame::doCheckValid), and core never removes or evicts a config setting, so no removed change names one (stellar-core v30.0.0)"

