    "TransactionResultResult:tx_too_early",
    "TransactionResultResult:tx_too_late",
    "InnerTransactionResultResult:tx_too_early",
    "InnerTransactionResultResult:tx_too_late",
]
blocker = "refused-before-ledger"
reason = "HerderSCPDriver::validateValue checks the tx set at the close time of the value being voted on (stellar-core v30.0.0), so every transaction in an externalized set meets its time and ledger bounds at apply"

[[arm]]
arms = [
    "TransactionResultResult:tx_soroban_invalid",
    "InnerTransactionResultResult:tx_soroban_invalid",
]
blocker = "refused-before-ledger"
reason = "set in TransactionFrame::commonValidPreSeqNum (memo and muxed source rule from protocol 25) or TransactionQueue::canAdd (before 25) from the envelope and network settings (stellar-core v30.0.0); the corpus holds the submit-time refusals"

[[arm]]
arms = [
    "TransactionResultResult:tx_frozen_key_accessed",
    "InnerTransactionResultResult:tx_frozen_key_accessed",
]
blocker = "refused-before-ledger"
reason = "TransactionFrame::commonValidPreSeqNum checks frozen keys against the network config (stellar-core v30.0.0), which only changes through config upgrades applied after a ledger's transactions, so validation already refused any transaction that fails at apply; none of the 1732 core golden files (test-lcm-current and test-lcm-next) holds it"

[[arm]]
arms = [
    "TransactionResultResult:tx_insufficient_balance",
    "InnerTransactionResultResult:tx_insufficient_balance",
]
blocker = "refused-before-ledger"
reason = "tx set validation requires each fee source's available balance to cover all its fees in the set (TxSetUtils.cpp getInvalidTxListWithErrors) and at apply the fee is already charged, so commonValid only fails on a negative available balance, which no operation leaves (stellar-core v30.0.0)"

[[arm]]
arms = ["ContractCodeEntryExt:v0"]
blocker = "old-protocol-only"
reason = "soroban-env-host writes ContractCodeEntryExt v1 with the module's cost inputs on every wasm upload (upload_contract_wasm in host/lifecycle.rs, 22.1.3 and 30.0.0; v0 stays only for the test build's empty wasm), so v0 entries are code uploaded at protocol 20 and show in later meta only when such an entry changes. the recipes' soroban hosts start at protocol 22. the one golden holding it (test-lcm-current/InvokeHostFunctionTests/27003f6cc5cdecc2.xdr record 2) is a protocol 20 ledger, below soroban.invoke-basics' range from 22, so the golden index lists it as not imported, and 29 protocol 20 mainnet ledgers sampled from 50460000 to 52140000 hold no upload"

[[arm]]
arms = ["TrustLineAsset:native"]
blocker = "refused-before-ledger"
reason = "a native trustline key is refused in Soroban footprints (TransactionFrame footprintKeyIsValid) and in revoke sponsorship (RevokeSponsorshipOpFrame::doCheckValid), and change trust never creates a native trustline (stellar-core v30.0.0)"

[[arm]]
