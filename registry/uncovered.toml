# why some shapes have no core-emitted corpus entry.
#
# `shapekit coverage --check` reads this file. every indexer-visible cap with no core-emitted
# entry, every union arm reachable from LedgerCloseMeta that no core-emitted entry holds, and
# every family fragment no core-emitted entry matches needs a record here, and a record for
# something now covered fails the check, so the file never drifts from the corpus.
#
# blockers:
#   refused-before-ledger   core refuses the transaction before any ledger holds it
#   never-emitted           the pinned core has no code path that writes it into meta
#   old-protocol-only       only ledgers below some protocol carry it
#   history-only            only a public network can hold it, and no capture of it exists
#   not-producible-locally  the code path exists, but a standalone network cannot reach it
#   not-imported            the core goldens hold it; the importer takes one per fragment
#   recipe-gap              a local core can produce it and no recipe records it yet
#
# every reason was read from the cited source at the pinned tags, not inferred from the name.

schema_version = 1

