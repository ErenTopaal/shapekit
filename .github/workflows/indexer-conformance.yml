name: indexer-conformance

# reusable workflow for indexer repositories: replays the chains of a pinned shapekit corpus
# release into the calling repository's indexer, through the adapter the caller names, and
# judges what it stored. every downloaded asset is checked against a sha256 the caller pins.
# how to call it is in docs/indexer-ci.md.

on:
  workflow_call:
    inputs:
      adapter:
        description: "adapter command line, run from the root of the calling repository, for example `bin/my-adapter`; set this or mapping"
        required: false
        type: string
        default: ""
      mapping:
        description: "path, in the calling repository, of a mapping file that connects a postgresql indexer without an adapter program (docs/mapping-adapter.md); set this or adapter"
        required: false
        type: string
        default: ""
      vars:
        description: "variables of the mapping file, NAME=VALUE separated by spaces, for example `commit=<full hash>`"
        required: false
        type: string
        default: ""
      setup:
        description: "shell commands run from the root of the calling repository before the replay: build the adapter, pull the images the target needs"
        required: false
        type: string
        default: ""
      shapekit-tag:
        description: "shapekit release tag, for example v0.2.0"
        required: true
        type: string
      corpus-asset:
        description: "corpus archive name in that release, for example corpus-0.2.0.tar.zst"
        required: true
        type: string
      corpus-sha256:
        description: "sha256 of the corpus archive, as listed in the release's SHA256SUMS"
        required: true
        type: string
      shapekit-sha256:
        description: "sha256 of the shapekit-linux-x86_64 asset, as listed in SHA256SUMS"
        required: true
        type: string
      chains:
        description: "chain ids to replay, separated by spaces; every chain of the corpus when empty"
        required: false
        type: string
        default: ""
      families:
        description: "families whose chains to replay, separated by spaces; with chains, both filters apply"
        required: false
        type: string
        default: ""
      network:
        description: "passphrase variant of each chain: testnet, mainnet or both"
        required: false
        type: string
        default: testnet
      delivery:
        description: "delivery mode to ask the adapter for; the adapter's default when empty"
        required: false
        type: string
        default: ""
      expect:
        description: "path, in the calling repository, of an expected-verdicts file; the run fails when a verdict differs from it"
        required: false
        type: string
        default: ""
      expect-mode:
        description: "how the expect file holds the run: exact (any difference fails, and the build must be the one the file was written at) or regressions (any build; a new or changed mishandled, dropped or not-evaluated verdict, or a missing entry, fails), for pull requests"
        required: false
        type: string
        default: exact
      shards:
        description: "jobs to split the replay across, each replaying a share of the chains, put together by a merge job before the report; one job when 1"
        required: false
        type: number
        default: 1
      go-version:
        description: "go version to install before setup; none when empty"
        required: false
        type: string
        default: ""
      node-version:
        description: "node version to install before setup; none when empty"
        required: false
        type: string
        default: ""
      python-version:
        description: "python version to install before setup; none when empty"
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: "time limit of the replay job"
        required: false
        type: number
        default: 120
      shapekit-repository:
        description: "repository the release comes from"
        required: false
        type: string
        default: ErenTopaal/shapekit
      baseline:
        description: "path, in the calling repository, of an earlier harness-report.json or an expected-verdicts file the report compares the run with; the expect input when empty"
        required: false
        type: string
        default: ""
      comment:
        description: "on a pull request, post the run's summary as a comment and update it on later pushes; the calling job must grant pull-requests: write"
        required: false
        type: boolean
        default: false
    outputs:
      report-artifact:
        description: "name of the uploaded artifact with harness-report.json, HARNESS.md and the logs"
        value: ${{ inputs.shards > 1 && jobs.merge.outputs.artifact || jobs.harness.outputs.artifact }}

# no workflow-wide permissions: the harness job reads only, and the comment job runs with
# what the calling job grants, so a caller that does not ask for comments grants nothing more
jobs:
  harness:
    # the whole replay in one job; with shards above 1 the plan, shard and merge jobs run instead
    if: ${{ inputs.shards <= 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
      summary: ${{ steps.report.outputs.summary }}
    steps:
      - id: names
        env:
          NETWORK: ${{ inputs.network }}
          DELIVERY: ${{ inputs.delivery }}
          EXPECT_MODE: ${{ inputs.expect-mode }}
          SHARDS: ${{ inputs.shards }}
        run: |
          case "$NETWORK" in
            testnet|mainnet|both) ;;
            *) echo "::error::network must be testnet, mainnet or both, not $NETWORK"; exit 1 ;;
          esac
          case "$DELIVERY" in
            ""|sep54-filesystem|sep54-s3|sep54-gcs|rpc) ;;
            *) echo "::error::delivery must be sep54-filesystem, sep54-s3, sep54-gcs or rpc, not $DELIVERY"; exit 1 ;;
          esac
          case "$EXPECT_MODE" in
            exact|regressions) ;;
            *) echo "::error::expect-mode must be exact or regressions, not $EXPECT_MODE"; exit 1 ;;
          esac
          if [ "$SHARDS" != 1 ]; then
            echo "::error::shards must be a whole number from 1 up, not $SHARDS"
            exit 1
          fi
          echo "artifact=shapekit-harness" >>"$GITHUB_OUTPUT"
      - name: check out the indexer under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: indexer
      - name: check out shapekit at the release tag (the findings triage the report links)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shapekit-repository }}
          ref: ${{ inputs.shapekit-tag }}
          path: shapekit
      - name: download and verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.shapekit-repository }}
          TAG: ${{ inputs.shapekit-tag }}
          CORPUS: ${{ inputs.corpus-asset }}
          CORPUS_SHA256: ${{ inputs.corpus-sha256 }}
          SHAPEKIT_SHA256: ${{ inputs.shapekit-sha256 }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/shapekit-release"
          mkdir -p "$dl"
          gh release download "$TAG" --repo "$REPO" --dir "$dl" \
            --pattern "$CORPUS" --pattern shapekit-linux-x86_64
          (cd "$dl" && printf '%s  %s\n%s  %s\n' \
            "$CORPUS_SHA256" "$CORPUS" "$SHAPEKIT_SHA256" shapekit-linux-x86_64 | sha256sum -c -)
          chmod +x "$dl/shapekit-linux-x86_64"
          mkdir -p "$dl/corpus"
          tar --zstd -xf "$dl/$CORPUS" -C "$dl/corpus"
          manifest=$(find "$dl/corpus" -mindepth 2 -maxdepth 2 -name manifest.json)
          if [ "$(printf '%s\n' "$manifest" | grep -c .)" -ne 1 ]; then
            echo "::error::the archive must hold exactly one <dir>/manifest.json"
            exit 1
          fi
          {
            echo "SHAPEKIT=$dl/shapekit-linux-x86_64"
            echo "CORPUS_DIR=$(dirname "$manifest")"
            echo "MANIFEST=$manifest"
          } >>"$GITHUB_ENV"
      - if: ${{ inputs.go-version != '' }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - if: ${{ inputs.node-version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: ${{ inputs.python-version != '' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: setup
        if: ${{ inputs.setup != '' }}
        working-directory: indexer
        env:
          SETUP: ${{ inputs.setup }}
        run: bash -euo pipefail -c "$SETUP"
      - name: replay
        working-directory: indexer
        env:
          ADAPTER: ${{ inputs.adapter }}
          MAPPING: ${{ inputs.mapping }}
          VARS: ${{ inputs.vars }}
          CHAINS: ${{ inputs.chains }}
          FAMILIES: ${{ inputs.families }}
          NETWORK: ${{ inputs.network }}
          DELIVERY: ${{ inputs.delivery }}
          EXPECT: ${{ inputs.expect }}
          EXPECT_MODE: ${{ inputs.expect-mode }}
        run: |
          set -euo pipefail
          if [ -n "$ADAPTER" ] && [ -z "$MAPPING" ]; then
            args=(--adapter "$ADAPTER")
          elif [ -z "$ADAPTER" ] && [ -n "$MAPPING" ]; then
            args=(--mapping "$MAPPING")
            for v in $VARS; do args+=(--var "$v"); done
          else
            echo "set exactly one of the adapter and mapping inputs" >&2
            exit 1
          fi
          args+=(--corpus "$CORPUS_DIR" --network "$NETWORK" --out "$RUNNER_TEMP/harness")
          for c in $CHAINS; do args+=(--chain "$c"); done
          for f in $FAMILIES; do args+=(--family "$f"); done
          if [ -n "$DELIVERY" ]; then args+=(--delivery "$DELIVERY"); fi
          if [ -n "$EXPECT" ]; then args+=(--expect "$EXPECT" --expect-mode "$EXPECT_MODE"); fi
          "$SHAPEKIT" check indexer "${args[@]}"
      - name: report
        # the html report and the pull request summary, grouped by finding; with a baseline,
        # failures are classed as new, changed, fixed or unchanged
        id: report
        if: ${{ !cancelled() }}
        working-directory: shapekit
        env:
          BASELINE: ${{ inputs.baseline != '' && inputs.baseline || inputs.expect }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/harness"
          if [ ! -f "$out/harness-report.json" ]; then
            echo "the run wrote no harness report, so there is nothing to report" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=(--manifest "$MANIFEST" --out "$out/report.html" --summary "$out/summary.md")
          if [ -n "$BASELINE" ]; then args+=(--baseline "$GITHUB_WORKSPACE/indexer/$BASELINE"); fi
          "$SHAPEKIT" report "$out" "${args[@]}"
          cat "$out/summary.md" >>"$GITHUB_STEP_SUMMARY"
          echo "summary=summary.md" >>"$GITHUB_OUTPUT"
      - name: harness report to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/harness/HARNESS.md" ]; then
            cat "$RUNNER_TEMP/harness/HARNESS.md" >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: ${{ runner.temp }}/harness/
          retention-days: 30

  plan:
    # with shards above 1: checks the inputs and lists the shard indices for the matrix
    if: ${{ inputs.shards > 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          NETWORK: ${{ inputs.network }}
          DELIVERY: ${{ inputs.delivery }}
          EXPECT_MODE: ${{ inputs.expect-mode }}
          SHARDS: ${{ inputs.shards }}
        run: |
          case "$NETWORK" in
            testnet|mainnet|both) ;;
            *) echo "::error::network must be testnet, mainnet or both, not $NETWORK"; exit 1 ;;
          esac
          case "$DELIVERY" in
            ""|sep54-filesystem|sep54-s3|sep54-gcs|rpc) ;;
            *) echo "::error::delivery must be sep54-filesystem, sep54-s3, sep54-gcs or rpc, not $DELIVERY"; exit 1 ;;
          esac
          case "$EXPECT_MODE" in
            exact|regressions) ;;
            *) echo "::error::expect-mode must be exact or regressions, not $EXPECT_MODE"; exit 1 ;;
          esac
          if ! [[ "$SHARDS" =~ ^[0-9]+$ ]] || [ "$SHARDS" -gt 64 ]; then
            echo "::error::shards must be a whole number from 1 to 64, not $SHARDS"
            exit 1
          fi
          echo "shards=$(jq -cn --argjson n "$SHARDS" '[range(1; $n + 1)]')" >>"$GITHUB_OUTPUT"

  shard:
    # one share of the chains (harness run --shard): the chains, sorted by name, dealt out in
    # turn, both networks of a chain in the same shard
    needs: plan
    name: harness (${{ matrix.shard }}/${{ inputs.shards }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: check out the indexer under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: indexer
      - name: check out shapekit at the release tag (the findings triage the report links)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shapekit-repository }}
          ref: ${{ inputs.shapekit-tag }}
          path: shapekit
      - name: download and verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.shapekit-repository }}
          TAG: ${{ inputs.shapekit-tag }}
          CORPUS: ${{ inputs.corpus-asset }}
          CORPUS_SHA256: ${{ inputs.corpus-sha256 }}
          SHAPEKIT_SHA256: ${{ inputs.shapekit-sha256 }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/shapekit-release"
          mkdir -p "$dl"
          gh release download "$TAG" --repo "$REPO" --dir "$dl" \
            --pattern "$CORPUS" --pattern shapekit-linux-x86_64
          (cd "$dl" && printf '%s  %s\n%s  %s\n' \
            "$CORPUS_SHA256" "$CORPUS" "$SHAPEKIT_SHA256" shapekit-linux-x86_64 | sha256sum -c -)
          chmod +x "$dl/shapekit-linux-x86_64"
          mkdir -p "$dl/corpus"
          tar --zstd -xf "$dl/$CORPUS" -C "$dl/corpus"
          manifest=$(find "$dl/corpus" -mindepth 2 -maxdepth 2 -name manifest.json)
          if [ "$(printf '%s\n' "$manifest" | grep -c .)" -ne 1 ]; then
            echo "::error::the archive must hold exactly one <dir>/manifest.json"
            exit 1
          fi
          {
            echo "SHAPEKIT=$dl/shapekit-linux-x86_64"
            echo "CORPUS_DIR=$(dirname "$manifest")"
            echo "MANIFEST=$manifest"
          } >>"$GITHUB_ENV"
      - if: ${{ inputs.go-version != '' }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - if: ${{ inputs.node-version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - if: ${{ inputs.python-version != '' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: setup
        if: ${{ inputs.setup != '' }}
        working-directory: indexer
        env:
          SETUP: ${{ inputs.setup }}
        run: bash -euo pipefail -c "$SETUP"
      - name: replay
        working-directory: indexer
        env:
          ADAPTER: ${{ inputs.adapter }}
          MAPPING: ${{ inputs.mapping }}
          VARS: ${{ inputs.vars }}
          CHAINS: ${{ inputs.chains }}
          FAMILIES: ${{ inputs.families }}
          NETWORK: ${{ inputs.network }}
          DELIVERY: ${{ inputs.delivery }}
          SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
        run: |
          set -euo pipefail
          if [ -n "$ADAPTER" ] && [ -z "$MAPPING" ]; then
            args=(--adapter "$ADAPTER")
          elif [ -z "$ADAPTER" ] && [ -n "$MAPPING" ]; then
            args=(--mapping "$MAPPING")
            for v in $VARS; do args+=(--var "$v"); done
          else
            echo "set exactly one of the adapter and mapping inputs" >&2
            exit 1
          fi
          args+=(--corpus "$CORPUS_DIR" --network "$NETWORK" --out "$RUNNER_TEMP/harness")
          for c in $CHAINS; do args+=(--chain "$c"); done
          for f in $FAMILIES; do args+=(--family "$f"); done
          if [ -n "$DELIVERY" ]; then args+=(--delivery "$DELIVERY"); fi
          # the expectations hold the whole run, so the merge job checks them
          args+=(--shard "$SHARD")
          "$SHAPEKIT" check indexer "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: shapekit-harness-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/harness/
          # the merged artifact holds every shard's logs
          retention-days: 1

  merge:
    # the shards' reports put together into the report one job would have written (harness
    # merge), held to the expect file, then reported and uploaded as the unsharded job does
    needs: [plan, shard]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
      summary: ${{ steps.report.outputs.summary }}
    steps:
      - id: names
        run: echo "artifact=shapekit-harness" >>"$GITHUB_OUTPUT"
      - name: check out the indexer under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: indexer
      - name: check out shapekit at the release tag (the findings triage the report links)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shapekit-repository }}
          ref: ${{ inputs.shapekit-tag }}
          path: shapekit
      - name: download and verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.shapekit-repository }}
          TAG: ${{ inputs.shapekit-tag }}
          CORPUS: ${{ inputs.corpus-asset }}
          CORPUS_SHA256: ${{ inputs.corpus-sha256 }}
          SHAPEKIT_SHA256: ${{ inputs.shapekit-sha256 }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/shapekit-release"
          mkdir -p "$dl"
          gh release download "$TAG" --repo "$REPO" --dir "$dl" \
            --pattern "$CORPUS" --pattern shapekit-linux-x86_64
          (cd "$dl" && printf '%s  %s\n%s  %s\n' \
            "$CORPUS_SHA256" "$CORPUS" "$SHAPEKIT_SHA256" shapekit-linux-x86_64 | sha256sum -c -)
          chmod +x "$dl/shapekit-linux-x86_64"
          mkdir -p "$dl/corpus"
          tar --zstd -xf "$dl/$CORPUS" -C "$dl/corpus"
          manifest=$(find "$dl/corpus" -mindepth 2 -maxdepth 2 -name manifest.json)
          if [ "$(printf '%s\n' "$manifest" | grep -c .)" -ne 1 ]; then
            echo "::error::the archive must hold exactly one <dir>/manifest.json"
            exit 1
          fi
          {
            echo "SHAPEKIT=$dl/shapekit-linux-x86_64"
            echo "CORPUS_DIR=$(dirname "$manifest")"
            echo "MANIFEST=$manifest"
          } >>"$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shapekit-harness-shard-*
          path: ${{ runner.temp }}/shards
      - name: merge the shards
        working-directory: indexer
        env:
          EXPECT: ${{ inputs.expect }}
          EXPECT_MODE: ${{ inputs.expect-mode }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/harness"
          # every shard's logs, so the artifact holds what one job's would
          mkdir -p "$out/logs"
          for d in "$RUNNER_TEMP"/shards/*/; do
            if [ -d "$d/logs" ]; then cp -R "$d/logs/." "$out/logs/"; fi
          done
          args=(--out "$out")
          if [ -n "$EXPECT" ]; then args+=(--expect "$EXPECT" --expect-mode "$EXPECT_MODE"); fi
          "$SHAPEKIT" harness merge "${args[@]}" "$RUNNER_TEMP"/shards/*/
      - name: report
        # the html report and the pull request summary, grouped by finding; with a baseline,
        # failures are classed as new, changed, fixed or unchanged
        id: report
        if: ${{ !cancelled() }}
        working-directory: shapekit
        env:
          BASELINE: ${{ inputs.baseline != '' && inputs.baseline || inputs.expect }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/harness"
          if [ ! -f "$out/harness-report.json" ]; then
            echo "the run wrote no harness report, so there is nothing to report" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=(--manifest "$MANIFEST" --out "$out/report.html" --summary "$out/summary.md")
          if [ -n "$BASELINE" ]; then args+=(--baseline "$GITHUB_WORKSPACE/indexer/$BASELINE"); fi
          "$SHAPEKIT" report "$out" "${args[@]}"
          cat "$out/summary.md" >>"$GITHUB_STEP_SUMMARY"
          echo "summary=summary.md" >>"$GITHUB_OUTPUT"
      - name: harness report to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/harness/HARNESS.md" ]; then
            cat "$RUNNER_TEMP/harness/HARNESS.md" >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: ${{ runner.temp }}/harness/
          retention-days: 30

  comment:
    # a pull request from a fork gets a read-only token, so it keeps the job summary and the
    # artifact and gets no comment
    needs: [harness, merge]
    if: >-
      ${{ !cancelled() && inputs.comment && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (inputs.shards > 1 && needs.merge.outputs.summary || needs.harness.outputs.summary) != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.shards > 1 && needs.merge.outputs.artifact || needs.harness.outputs.artifact }}
          path: report
      - name: post or update the summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SUMMARY: report/${{ inputs.shards > 1 && needs.merge.outputs.summary || needs.harness.outputs.summary }}
        run: |
          set -euo pipefail
          # the summary's first line names it: the shapekit-report marker and the run kind
          marker=$(head -n 1 "$SUMMARY")
          # --paginate prints one json array per page; jq reads them one after another
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" |
            jq -r --arg m "$marker" '.[] | select(.user.login == "github-actions[bot]")
              | select(.body | startswith($m + "\n")) | .id' |
            tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F "body=@$SUMMARY" >/dev/null
            echo "updated comment $id"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F "body=@$SUMMARY" >/dev/null
            echo "posted a comment"
          fi
