name: site

# the shapekit.org site in site/: docs and dashboard, prerendered to static files. its data
# is derived from committed files by `shapekit site data` and its docs from docs/ and
# README.md, so every build is reproducible from the checkout. this workflow only builds and
# checks; hosting is outside this repository. see docs/site.md.

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "crates/**"
      - "corpus/manifest.json"
      - "corpus/coverage/**"
      - "findings/**"
      - "candidate/findings/**"
      - "conformance/**"
      - "adapters/walletbackend/reproductions.toml"
      - "registry/**"
      - "pins.toml"
      - "Cargo.lock"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "crates/**"
      - "corpus/manifest.json"
      - "corpus/coverage/**"
      - "findings/**"
      - "candidate/findings/**"
      - "conformance/**"
      - "adapters/walletbackend/reproductions.toml"
      - "registry/**"
      - "pins.toml"
      - "Cargo.lock"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a pull request supersedes the run in progress; on main every run finishes, so
# each merge gets its result and its caches are saved
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      - run: cargo build --release --locked -p shapekit-cli
      - name: derive the site data from the committed files
        run: target/release/shapekit site data --out site/public/data --commit "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm run lint
        working-directory: site
      - name: prerender every route
        run: npm run build
        working-directory: site
      - name: check that every route has a static page
        working-directory: site/dist/client
        run: |
          for f in index.html __spa-fallback.html api/search.json docs/index.html \
            llms.txt llms-full.txt llms.mdx/docs/content.md \
            dashboard/index.html dashboard/coverage/index.html dashboard/sdk/index.html \
            dashboard/indexer/index.html dashboard/findings/index.html; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          docs=$(find ../../content/docs -name '*.md*' | wc -l)
          pages=$(find docs -name index.html | wc -l)
          test "$docs" -eq "$pages" || { echo "$docs docs pages but $pages prerendered"; exit 1; }
          markdown=$(find llms.mdx/docs -name content.md | wc -l)
          test "$docs" -eq "$markdown" || { echo "$docs docs pages but $markdown markdown files"; exit 1; }
          caps=$(jq '.caps | length' data/coverage.json)
          capdirs=$(find dashboard/coverage -mindepth 2 -name index.html | wc -l)
          test "$caps" -eq "$capdirs" || { echo "$caps caps but $capdirs cap pages"; exit 1; }
          entries=$(jq '.entries | length' data/entries.json)
          entrydirs=$(find dashboard/corpus -mindepth 2 -name index.html | wc -l)
          test "$entries" -eq "$entrydirs" || { echo "$entries entries but $entrydirs explorer pages"; exit 1; }
          test -f dashboard/corpus/index.html || { echo "missing dashboard/corpus/index.html"; exit 1; }
      - name: validate the caddy configuration
        run: |
          image=$(sed -n 's/^image=//p' site/scripts/preview.sh)
          docker run --rm -v "$PWD/site/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      # the built site, for inspection
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist/client
          retention-days: 7
