name: nightly

# the full tier: every chain regenerated under both passphrases, the whole sdk matrix and its
# reproductions, the wallet-backend reproductions, both delivery modes, memory bounds, the
# stellar-rpc runs, core's own golden check, the docker-backed tests and coverage. what pr.yml samples, this runs whole.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release --locked -p shapekit-cli
      - uses: actions/upload-artifact@v7
        with:
          name: shapekit
          path: target/release/shapekit
          retention-days: 3
          if-no-files-found: error

  goldens:
    # literal golden agreement: the committed golden index must describe exactly the files at
    # the pinned core tag, and core's own --check-lcm run must accept those files
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: fetch test-lcm-current at the pinned stellar-core tag
        run: |
          set -euo pipefail
          tag=$(scripts/pin.sh tag stellar-core)
          pinned=$(scripts/pin.sh git stellar-core)
          git clone --quiet --depth 1 --branch "$tag" --filter=blob:none --sparse \
            https://github.com/stellar/stellar-core "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" sparse-checkout set test-lcm-current
          head=$(git -C "$RUNNER_TEMP/core" rev-parse HEAD)
          if [ "$head" != "$pinned" ]; then
            echo "tag $tag is $head upstream, pins.toml pins $pinned" >&2
            exit 1
          fi
      - name: committed golden index matches upstream
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          tag=$(scripts/pin.sh tag stellar-core)
          "$RUNNER_TEMP/bin/shapekit" goldens verify --core-src "$RUNNER_TEMP/core" --tag "$tag" \
            --index "corpus/goldens/core-$tag/index.json"
      - name: a re-import of the goldens changes nothing
        # the importer at the pinned tag, run on a copy, must give back the committed golden
        # entries, their oracle files, the golden index and the manifest byte for byte. a family
        # fragment added to the registry without a re-import fails here
        run: |
          set -euo pipefail
          tag=$(scripts/pin.sh tag stellar-core)
          work="$RUNNER_TEMP/reimport"
          mkdir -p "$work"
          cp -r corpus registry pins.toml "$work/"
          (cd "$work" &&
            "$RUNNER_TEMP/bin/shapekit" import goldens --core-src "$RUNNER_TEMP/core" --tag "$tag" &&
            "$RUNNER_TEMP/bin/shapekit" manifest build)
          diff -r corpus "$work/corpus"
      - name: committed oracle files are what the oracle writes
        # every entry, not only the goldens the re-import covers: the recipe chains' oracle
        # files are compared by the repro job, synthetic and history entries only here
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/shapekit" oracle run >/dev/null
          changed=$(git status --porcelain -- corpus)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff --stat -- corpus
            echo "::error::committed oracle files differ from shapekit oracle run"
            exit 1
          fi
      - name: pull the pinned core test build by digest
        run: docker pull --quiet "$(scripts/pin.sh image stellar-core-buildtests)"
      - name: core's own check-lcm run
        run: scripts/check-lcm.sh "$RUNNER_TEMP/core" 2 5
      - name: structural agreement with local-core and history entries
        run: |
          "$RUNNER_TEMP/bin/shapekit" goldens agree
          "$RUNNER_TEMP/bin/shapekit" coverage --check

  repro:
    # every chain under both passphrases, compared byte for byte with the corpus. no --family
    # filter, so the set is every recipe the binary registers and cannot drift from a list kept
    # here or in scripts/select-repro.sh
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - run: docker pull --quiet "$(scripts/pin.sh image stellar-core)"
      - name: gen verify-repro, every chain
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" gen verify-repro --jobs 2

  docker-tests:
    # the core driver and generator tests that start stellar-core, skipped in pr.yml's cargo
    # test because they need the image; also the serve memory bound in a release build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # the online pins tests read release assets from the github api, which refuses
      # unauthenticated requests from shared runner addresses once their hourly quota is spent
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug
      # the init skeleton tests build and run the go and typescript skeletons, the ignored
      # ones with their sdks installed, on the pinned toolchains rather than the runner's
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - run: docker pull --quiet "$(scripts/pin.sh image stellar-core)"
      - name: cargo test with docker and network, ignored tests included
        run: cargo test --workspace --locked --no-fail-fast -- --include-ignored
      - name: serve memory bound (release build)
        run: cargo test --release --locked -p shapekit-cli --test serve_memory

  conformance:
    # every sdk version in conformance/versions.toml, then the upstream sightings
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: "testees/go/**/*.sum"
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: testees/js/**/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, gmp, mbstring, sodium
          tools: composer:2.11.2
      - name: pinned flutter for the dart testee
        run: scripts/flutter-toolchain.sh >>"$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: pinned uv and cpython for the python testee
        run: scripts/python-toolchain.sh >>"$GITHUB_PATH"
      - name: pinned jdk and maven for the java and kmp testees
        run: scripts/java-toolchain.sh >>"$GITHUB_PATH"
      - name: conformance run, all versions, one matrix per sdk and one for disagreeing references
        # one output directory per sdk, the layout findings/triage.toml reads in the findings job
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          status=0
          for sdk in rust go js soroban python java dart php dotnet kmp stellar-cli; do
            "$RUNNER_TEMP/bin/shapekit" conformance run --sdk "$sdk" --all-versions \
              --out "target/conformance/$sdk" || status=1
          done
          # implementation-defined entries diverge only next to the other sdks' answers; every
          # sdk is a peer, as in the committed findings/inputs/conformance-peers.json
          "$RUNNER_TEMP/bin/shapekit" conformance run --all-versions \
            --no-build --flag references-disagree --out target/conformance/peers || status=1
          exit "$status"
      - name: conformance reproduce
        # the run above built every version, so the reproductions reuse those builds
        run: |
          "$RUNNER_TEMP/bin/shapekit" conformance reproduce --no-build
      - name: matrices to the job summary
        if: ${{ !cancelled() }}
        # a step summary holds at most 1 MiB and the eleven matrices are about 2.5 MB, so it takes
        # each matrix's tables up to the entry list; the conformance artifact has them whole
        run: |
          for sdk in rust go js soroban python java dart php dotnet kmp stellar-cli; do
            f="target/conformance/$sdk/MATRIX.md"
            if [ -f "$f" ]; then sed '/^## Entries that do not pass everywhere/,$d' "$f" >>"$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: conformance
          path: target/conformance/
          retention-days: 30

  candidate:
    # the candidate lane: entries waiting for promotion run through the current version of each
    # sdk. a divergence here is a finding to triage, not a broken build, so it is reported in
    # the job summary and the job stays green; a malformed candidate manifest, a testee that
    # does not start or a run without a matrix fails it. one local run of its main step took
    # 41 minutes
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: "testees/go/**/*.sum"
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: testees/js/**/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, gmp, mbstring, sodium
          tools: composer:2.11.2
      - name: pinned flutter for the dart testee
        run: scripts/flutter-toolchain.sh >>"$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: candidate manifest validates
        run: |
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" manifest validate --file candidate/manifest.json
      - name: candidate findings map every failure and name their drafts
        # these are findings awaiting a decision, so drafts are allowed here and only here
        run: |
          "$RUNNER_TEMP/bin/shapekit" findings check --triage candidate/findings/triage.toml \
            --out candidate/findings --allow-draft
      - name: pinned uv and cpython for the python testee
        run: scripts/python-toolchain.sh >>"$GITHUB_PATH"
      - name: pinned jdk and maven for the java and kmp testees
        run: scripts/java-toolchain.sh >>"$GITHUB_PATH"
      - name: candidates through the current sdks, and which can be promoted
        run: |
          set -uo pipefail
          shapekit="$RUNNER_TEMP/bin/shapekit"
          ids=$(jq -r '.entries[].id' candidate/manifest.json)
          if [ -z "$ids" ]; then
            echo "the candidate lane is empty" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # candidate entries are in no known-failures list, so every failure is reported
          known="$RUNNER_TEMP/known-failures"
          mkdir -p "$known"
          : >"$known/rust.txt"; : >"$known/go.txt"; : >"$known/js.txt"; : >"$known/soroban.txt"; : >"$known/python.txt"; : >"$known/java.txt"; : >"$known/dart.txt"; : >"$known/php.txt"; : >"$known/dotnet.txt"; : >"$known/kmp.txt"; : >"$known/stellar-cli.txt"
          matrices=()
          # promotion needs a result from every sdk in conformance/versions.toml
          for sdk in rust go js soroban python java dart php dotnet kmp stellar-cli; do
            out="target/candidate/$sdk"
            # the runner starts this script with bash -e, so the exit code is caught, not fatal
            code=0
            "$shapekit" conformance run --sdk "$sdk" --manifest candidate/manifest.json \
              --known-failures "$known" --out "$out" || code=$?
            # 1 is a divergence, anything else is the run itself failing
            if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi
            test -f "$out/divergence-matrix.json" || { echo "::error::no matrix for $sdk"; exit 1; }
            # a step summary holds at most 1 MiB and the lane's matrices are megabytes, so the
            # summary takes each matrix's tables up to the entry list; the artifact has them whole
            sed '/^## Entries that do not pass everywhere/,$d' "$out/MATRIX.md" >>"$GITHUB_STEP_SUMMARY"
            matrices+=(--matrix "$out/divergence-matrix.json")
          done
          echo "## promotion" >>"$GITHUB_STEP_SUMMARY"
          # one dry run over every id reads the lanes and matrices once; one call per id took
          # about 0.4 s each, too slow for thousands of candidates
          code=0
          # shellcheck disable=SC2086
          "$shapekit" corpus promote $ids --dry-run "${matrices[@]}" >target/candidate/promotion.txt || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then cat target/candidate/promotion.txt; exit "$code"; fi
          {
            echo "$(grep -c ' can be promoted$' target/candidate/promotion.txt || true) can be promoted, $(grep -c ' stays in the candidate lane$' target/candidate/promotion.txt || true) stay in the candidate lane; every decision is in target/candidate/promotion.txt in the artifact"
            echo '```'
            grep ' can be promoted$' target/candidate/promotion.txt || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: candidate
          path: target/candidate/
          if-no-files-found: ignore
          retention-days: 30

  harness:
    # every chain through the wallet-backend adapter at the current pin, once per delivery mode;
    # the rpc run goes twice in one process and fails if the second round's peak memory grows.
    # each mode is split into shards of the chains (harness run --shard), so no job comes near
    # github's 6 hour limit; harness-merge puts each mode's shards together. estimated for the
    # 1092-entry corpus from the 2026-11-14 durations and per-chain times of local runs (docs/
    # infrastructure.md): rpc about 29,700 s in all, six shards of about 5,000 s; sep54-s3
    # about 18,300 s, four shards of about 4,600 s
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {delivery: rpc, network: both, repeat: 2, shard: 1, shards: 6}
          - {delivery: rpc, network: both, repeat: 2, shard: 2, shards: 6}
          - {delivery: rpc, network: both, repeat: 2, shard: 3, shards: 6}
          - {delivery: rpc, network: both, repeat: 2, shard: 4, shards: 6}
          - {delivery: rpc, network: both, repeat: 2, shard: 5, shards: 6}
          - {delivery: rpc, network: both, repeat: 2, shard: 6, shards: 6}
          - {delivery: sep54-s3, network: testnet, repeat: 1, shard: 1, shards: 4}
          - {delivery: sep54-s3, network: testnet, repeat: 1, shard: 2, shards: 4}
          - {delivery: sep54-s3, network: testnet, repeat: 1, shard: 3, shards: 4}
          - {delivery: sep54-s3, network: testnet, repeat: 1, shard: 4, shards: 4}
    name: harness (${{ matrix.delivery }}, ${{ matrix.shard }}/${{ matrix.shards }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: adapters/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: pull the pinned images by digest
        run: |
          docker pull --quiet "$(scripts/pin.sh image timescaledb)"
          docker pull --quiet "$(scripts/pin.sh image seaweedfs)"
      - run: cd adapters && go build -o bin/wb-adapter ./walletbackend/cmd/wb-adapter
      - name: wallet-backend cache key, the pinned commit and its base image digests
        id: wb
        run: |
          set -euo pipefail
          pin=$(scripts/pin.sh git wallet-backend)
          bases=$(for n in wallet-backend-golang wallet-backend-debian wallet-backend-ubuntu; do
            scripts/pin.sh image "$n"
          done | sha256sum | cut -c1-16)
          echo "pin=$pin" >>"$GITHUB_OUTPUT"
          echo "key=wallet-backend-$pin-$bases" >>"$GITHUB_OUTPUT"
      - name: cached wallet-backend clone and image
        # the adapter's clone and the image it builds on the pinned bases (docker save output).
        # with a hit the run needs no network for wallet-backend; caches written by main's
        # pushes are visible to every pull request
        id: wb-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/shapekit/wallet-backend
            ${{ runner.temp }}/wallet-backend-image.tar
          key: ${{ steps.wb.outputs.key }}
      - name: load the cached wallet-backend image
        if: steps.wb-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/wallet-backend-image.tar"
      - name: harness run
        env:
          DELIVERY: ${{ matrix.delivery }}
          NETWORK: ${{ matrix.network }}
          REPEAT: ${{ matrix.repeat }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          pin=$(scripts/pin.sh git wallet-backend)
          "$RUNNER_TEMP/bin/shapekit" harness run \
            --adapter "adapters/bin/wb-adapter --commit $pin" \
            --delivery "$DELIVERY" --network "$NETWORK" --repeat "$REPEAT" --shard "$SHARD" \
            --out harness-out
      - name: save the wallet-backend image for the cache
        if: ${{ !cancelled() && steps.wb-cache.outputs.cache-hit != 'true' }}
        env:
          PIN: ${{ steps.wb.outputs.pin }}
        run: |
          if docker image inspect "shapekit-wallet-backend:$PIN" >/dev/null 2>&1; then
            docker save --output "$RUNNER_TEMP/wallet-backend-image.tar" "shapekit-wallet-backend:$PIN"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: harness-${{ matrix.delivery }}-shard-${{ matrix.shard }}
          path: harness-out/
          retention-days: 30

  harness-stellar-etl:
    # every chain of both networks through the stellar-etl adapter at the pinned commit, in five
    # shards of the chains (about 22,000 s in all, estimated for the 1092-entry corpus);
    # harness-merge puts them together into the stellar-etl input the findings job imports
    # (findings/triage.toml)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    name: harness stellar-etl (${{ matrix.shard }}/5)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: adapters/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: pull the pinned gcs emulator by digest
        run: docker pull --quiet "$(scripts/pin.sh image fake-gcs-server)"
      - run: cd adapters && go build -o bin/etl-adapter ./stellaretl/cmd/etl-adapter
      - name: harness run
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          pin=$(scripts/pin.sh git stellar-etl)
          "$RUNNER_TEMP/bin/shapekit" harness run \
            --adapter "adapters/bin/etl-adapter --commit $pin --cpus 2" \
            --network both --shard "$SHARD/5" --out harness-out
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: harness-stellar-etl-shard-${{ matrix.shard }}
          path: harness-out/
          retention-days: 30

  harness-reproduce:
    # wallet-backend#729, #731, #716, #753 and #792 on their pre-fix and fixed commits
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: free runner disk
        # ten wallet-backend images and their build caches fill the runner's free disk (the
        # first nightly failed with "no space left on device"); the preinstalled toolchains
        # removed here are not used by this job
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: adapters/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - run: docker pull --quiet "$(scripts/pin.sh image timescaledb)"
      - name: harness reproduce
        run: |
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" harness reproduce \
            --table adapters/walletbackend/reproductions.toml --out harness-reproduce
      - name: report to the job summary
        if: ${{ !cancelled() }}
        run: |
          df -h /
          if [ -f harness-reproduce/REPRODUCTIONS.md ]; then cat harness-reproduce/REPRODUCTIONS.md >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: harness-reproduce
          path: harness-reproduce/
          retention-days: 30

  harness-stellar-rpc:
    # every chain of both networks through the stellar-rpc adapter, once per method the export
    # reads events from, each in three shards of the chains (about 12,300 s per method in all,
    # estimated for the 1092-entry corpus); harness-merge checks each method's merged report
    # against the committed expectations file
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        events-from: [events, transactions, ledgers]
        shard: [1, 2, 3]
    name: harness stellar-rpc (${{ matrix.events-from }}, ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: adapters/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: pull the pinned image by digest
        run: docker pull --quiet "$(scripts/pin.sh image stellar-rpc)"
      - run: cd adapters && go build -o bin/rpc-adapter ./stellarrpc/cmd/rpc-adapter
      - name: harness run
        # the expectations are checked on the merged report, in harness-merge
        env:
          EVENTS_FROM: ${{ matrix.events-from }}
          SHARD: ${{ matrix.shard }}/3
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" harness run \
            --adapter "adapters/bin/rpc-adapter --cpus 2 --events-from $EVENTS_FROM" \
            --network both --shard "$SHARD" --out harness-out
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: harness-stellar-rpc-${{ matrix.events-from }}-shard-${{ matrix.shard }}
          path: harness-out/
          retention-days: 30

  fuzz:
    # corpus-seeded differential fuzzing, stellar-xdr in process against the go
    # testee (docs/differential-fuzzing.md). a disagreement class missing from
    # findings/fuzz/known-classes.txt fails the job, and so does a stored reproducer that no
    # longer lands in its class. the seed is the date, so a failure replays from the log
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: "testees/go/**/*.sum"
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: fuzz
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          seed=$(date -u +%Y%m%d)
          echo "seed $seed"
          # a fixed input budget makes the run reproducible from its seed; --seconds is only a
          # safety stop sized well above the budget at the measured rate (about 73k inputs/s)
          "$RUNNER_TEMP/bin/shapekit" fuzz --seconds 2400 --max-inputs 60000000 --seed "$seed" --jobs 4 \
            --out fuzz-out --findings fuzz-out/new
      - name: replay stored reproducers
        if: ${{ !cancelled() }}
        # the fuzz step built the go testee
        run: |
          "$RUNNER_TEMP/bin/shapekit" fuzz --replay findings/fuzz --no-build
      - name: report to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f fuzz-out/FUZZ.md ]; then cat fuzz-out/FUZZ.md >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: fuzz
          path: fuzz-out/
          retention-days: 30

  harness-merge:
    # each harness leg's shards put together into the report one whole run writes: its summary,
    # the stellar-rpc expectations, and the artifacts the findings job imports
    needs: [build, harness, harness-stellar-etl, harness-stellar-rpc]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: rpc, artifact: harness-rpc}
          - {leg: sep54-s3, artifact: harness-sep54-s3}
          - {leg: stellar-etl, artifact: harness-stellar-etl}
          - {leg: stellar-rpc-events, artifact: harness-stellar-rpc-events, expect: crates/shapekit-harness/expect/stellar-rpc.toml}
          - {leg: stellar-rpc-transactions, artifact: harness-stellar-rpc-transactions, expect: crates/shapekit-harness/expect/stellar-rpc.toml}
          - {leg: stellar-rpc-ledgers, artifact: harness-stellar-rpc-ledgers, expect: crates/shapekit-harness/expect/stellar-rpc.toml}
    name: harness merge (${{ matrix.leg }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.artifact }}-shard-*
          path: ${{ runner.temp }}/shards
      - name: merge the shards
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          args=()
          if [ -n "$EXPECT" ]; then args=(--expect "$EXPECT"); fi
          "$RUNNER_TEMP/bin/shapekit" harness merge --out harness-out "${args[@]}" "$RUNNER_TEMP"/shards/*
      - name: report to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f harness-out/HARNESS.md ]; then cat harness-out/HARNESS.md >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.artifact }}
          path: harness-out/
          retention-days: 30

  findings:
    # every failure the nightly runs report must map to a triaged finding with an upstream link
    # or a recorded decision (shapekit findings check, inputs as findings/triage.toml declares
    # them, taken from tonight's runs). until the drafted issues are filed, the check reports
    # each finding with status draft as a problem; this job tolerates exactly those and fails
    # on any other problem: an unmapped failure, a finding that matches nothing, a missing
    # draft file, a filed finding without a link, or a committed findings.json that differs
    # from what tonight's runs give
    needs: [build, conformance, harness-merge]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: lint/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: conformance matrices
        uses: actions/download-artifact@v8
        with:
          name: conformance
          path: target/conformance
      - name: harness report, rpc delivery, both networks
        uses: actions/download-artifact@v8
        with:
          name: harness-rpc
          path: ${{ runner.temp }}/harness-rpc
      - name: harness report, stellar-etl, both networks
        uses: actions/download-artifact@v8
        with:
          name: harness-stellar-etl
          path: ${{ runner.temp }}/harness-stellar-etl
      - name: harness report, stellar-rpc with getEvents, both networks
        uses: actions/download-artifact@v8
        with:
          name: harness-stellar-rpc-events
          path: ${{ runner.temp }}/harness-stellar-rpc-events
      - name: indexerlint on wallet-backend at the pin
        run: |
          set -euo pipefail
          pin=$(scripts/pin.sh git wallet-backend)
          (cd lint && go build -o "$RUNNER_TEMP/bin/indexerlint" ./cmd/indexerlint)
          git init --quiet "$RUNNER_TEMP/wb"
          git -C "$RUNNER_TEMP/wb" fetch --quiet --depth 1 https://github.com/stellar/wallet-backend "$pin"
          git -C "$RUNNER_TEMP/wb" checkout --quiet FETCH_HEAD
          mkdir -p target/findings
          # exit 1 means findings, which the triage maps; 2 is a usage, load or type error
          status=0
          (cd "$RUNNER_TEMP/wb" && "$RUNNER_TEMP/bin/indexerlint" -format json ./...) \
            >"target/findings/indexerlint-wallet-backend-${pin:0:8}.json" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: indexerlint runs clean on wallet-backend with the committed baseline
        # the one finding at the pin is filed upstream and baselined; any new finding fails here
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wb"
          "$RUNNER_TEMP/bin/indexerlint" -baseline "$GITHUB_WORKSPACE/lint/baselines/wallet-backend.json" ./...
      - name: put the harness reports where the triage reads them
        run: |
          set -euo pipefail
          pin=$(scripts/pin.sh git wallet-backend)
          dir="target/findings/wallet-backend-${pin:0:8}"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP/harness-rpc/harness-report.json" "$dir/"
          pin=$(scripts/pin.sh git stellar-etl)
          dir="target/findings/stellar-etl-${pin:0:8}"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP/harness-stellar-etl/harness-report.json" "$dir/"
          tag=$(python3 -I -c 'import tomllib; print(next(i["tag"] for i in tomllib.load(open("pins.toml", "rb"))["image"] if i["name"] == "stellar-rpc"))')
          dir="target/findings/stellar-rpc-$tag"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP/harness-stellar-rpc-events/harness-report.json" "$dir/"
      - name: import tonight's runs as the triage inputs
        # the triage reads committed, reduced copies of the run outputs (findings/inputs);
        # import-inputs replaces them with tonight's, so the check below judges these runs
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" findings import-inputs
      - name: findings check, drafts tolerated
        # --allow-draft passes when the only problems are findings still waiting to be filed;
        # any other problem fails the job
        run: |
          set -euo pipefail
          # --fresh-runs: tonight's inputs carry tonight's timings, so their hashes differ
          # from the committed ones even when every finding is the same
          out=$("$RUNNER_TEMP/bin/shapekit" findings check --allow-draft --fresh-runs 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          {
            echo '## findings check'
            echo '```'
            echo "$out"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
