name: pr

# the per pull request tier. every check runs offline once toolchains, crates, modules, npm
# packages and the pinned images are fetched. the budget is 15 minutes of wall clock for the
# whole workflow on standard hosted runners; jobs run in parallel and each has a timeout.
# measured durations and the reasoning behind the split are in docs/infrastructure.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# a newer push to a pull request supersedes the run in progress; on main every run finishes, so
# each merge gets its result and its caches are saved
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    # one release build of the cli, shared by every job that runs the tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release --locked -p shapekit-cli
      - uses: actions/upload-artifact@v7
        with:
          name: shapekit
          path: target/release/shapekit
          retention-days: 3
          if-no-files-found: error

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # line tables keep backtraces readable at a fraction of the disk full debug info takes
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug
      # the init skeleton tests build and run the go adapter and run the typescript one with
      # node's type stripping, so both toolchains are the pinned ones, not the runner's
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  go:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: "**/go.sum"
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: vet, test and lint each module in go.work
        env:
          # the consumer checks in adapters/protocol serve chains with the cli
          SHAPEKIT_BIN: ${{ runner.temp }}/bin/shapekit
        run: |
          set -euo pipefail
          chmod +x "$SHAPEKIT_BIN"
          # golangci-lint and go vet both work per module, so walk the workspace
          # instead of hardcoding the list and missing a module added later
          for dir in $(go list -m -f '{{.Dir}}'); do
            echo "::group::$dir"
            (cd "$dir" && go vet ./... && go test ./... && golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml" ./...)
            echo "::endgroup::"
          done
      - name: indexerlint runs clean on this repository's own adapters
        run: |
          set -euo pipefail
          (cd lint && go build -o "$RUNNER_TEMP/bin/indexerlint" ./cmd/indexerlint)
          cd adapters && "$RUNNER_TEMP/bin/indexerlint" ./...

  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: testees/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: testees/js/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx tsc
      - run: node --test "dist/**/*.test.js"

  python:
    # the python testee: its conformance run on the current version builds that version's venv
    # from the hash-locked requirements, then the testee's unit tests run in it, then the
    # generated type table against what gentypes.py writes from every version's venv
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: pinned uv and cpython
        run: scripts/python-toolchain.sh >>"$GITHUB_PATH"
      - name: conformance run on the current version
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" conformance run --sdk python --out target/conformance/python
      - name: unit tests
        run: |
          set -euo pipefail
          v=$(python3 -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["sdk"]["python"]["current"])' conformance/versions.toml)
          "target/testees/python/$v/venv/bin/python" -B -E -s -m unittest discover -s testees/python/tests -t testees/python
      - name: type table
        # the generator reads every version's build, so the versions the run above did not
        # build are built first, with the build steps of conformance/versions.toml
        run: |
          set -euo pipefail
          python3 -I - python <<'PY'
          import os, subprocess, sys, tomllib
          sdk = tomllib.load(open("conformance/versions.toml", "rb"))["sdk"][sys.argv[1]]
          for v in sdk["versions"]:
              if v["version"] == sdk["current"]:
                  continue
              for step in v.get("build", []):
                  env = dict(os.environ, **step.get("env", {}))
                  subprocess.run(step["argv"], cwd=step.get("dir", "."), env=env, check=True)
          PY
          python3 -I testees/python/gentypes.py
          git diff --exit-code -- testees/python/shapekit_testee/types_gen.py

  java:
    # the java testee: its conformance run on the current version builds it with maven and checks
    # the resolved jars against lib.sha256, then its unit tests run, then the generated type
    # table against what gentypes.py writes from every version's jar
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: testee-java-${{ hashFiles('testees/java/versions/*/pom.xml') }}
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: pinned jdk and maven
        # on PATH for the testee's java; maven runs through scripts/with-java.sh, which sets
        # JAVA_HOME to the pinned jdk. the runner's JAVA_HOME (jdk 17) stays, so this job also
        # checks that the build does not depend on it
        run: scripts/java-toolchain.sh >>"$GITHUB_PATH"
      - name: conformance run on the current version
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" conformance run --sdk java --out target/conformance/java
      - name: unit tests
        run: |
          set -euo pipefail
          v=$(python3 -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["sdk"]["java"]["current"])' conformance/versions.toml)
          scripts/with-java.sh mvn -B -q -f "testees/java/versions/$v/pom.xml" test
          python3 -I -m unittest discover -s testees/java/tests
      - name: type table
        # the generator reads every version's build, so the versions the run above did not
        # build are built first, with the build steps of conformance/versions.toml
        run: |
          set -euo pipefail
          python3 -I - java <<'PY'
          import os, subprocess, sys, tomllib
          sdk = tomllib.load(open("conformance/versions.toml", "rb"))["sdk"][sys.argv[1]]
          for v in sdk["versions"]:
              if v["version"] == sdk["current"]:
                  continue
              for step in v.get("build", []):
                  env = dict(os.environ, **step.get("env", {}))
                  subprocess.run(step["argv"], cwd=step.get("dir", "."), env=env, check=True)
          PY
          (cd testees/java && python3 -I gentypes.py)
          git diff --exit-code -- testees/java/src/main/java/org/shapekit/testee/TypesGen.java

  contracts:
    # the committed wasm is what `stellar contract build` from the pinned stellar-cli release
    # makes of the committed sources; a source, sdk, toolchain or stellar-cli change without
    # the rebuilt wasm fails here
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32v1-none
      - name: rebuild the contracts with the pinned stellar-cli
        run: |
          set -euo pipefail
          contracts/build.sh
          contracts/build-legacy.sh
          changed=$(git status --porcelain -- contracts)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::contracts/build.sh and contracts/build-legacy.sh do not reproduce the committed wasm"
            exit 1
          fi

  corpus:
    # registry, manifest (which round-trips every entry through stellar-xdr), generated files,
    # oracle files, coverage, guide, goldens, committed chains, the release archive, text rules
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: put shapekit on PATH
        run: |
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - run: shapekit registry check
      - name: manifest validate (round trip of every entry)
        run: shapekit manifest validate
      - name: committed manifest and synthetic entries are what the tools write
        run: |
          set -euo pipefail
          shapekit synth build
          shapekit manifest build
          changed=$(git status --porcelain -- corpus)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff --stat -- corpus
            echo "::error::committed corpus differs from synth build plus manifest build"
            exit 1
          fi
      - name: committed oracle files are what the oracle writes
        # harness verdicts are judged against these files, and manifest validate only checks
        # them against their recorded hashes, so an oracle change that alters facts must come
        # with the regenerated files
        run: |
          set -euo pipefail
          shapekit oracle run >/dev/null
          changed=$(git status --porcelain -- corpus)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff --stat -- corpus
            echo "::error::committed oracle files differ from shapekit oracle run"
            exit 1
          fi
      - name: candidate manifest validate (the lane's sdk runs are nightly only)
        run: shapekit manifest validate --file candidate/manifest.json
      - name: contract schemas are current
        run: shapekit contracts schema --check
      - run: shapekit coverage --check
      - run: shapekit guide check
      - name: goldens agree (structural agreement with core's goldens)
        run: shapekit goldens agree
      - name: committed chains match their chain.json
        run: shapekit pack verify
      - name: the repro selection knows every recipe family
        # the selection script reads families from the recipe sources; the cli lists the ones it
        # registers. they must agree, and every committed chain must belong to a listed family
        run: |
          set -euo pipefail
          diff <(scripts/select-repro.sh --families | sort) <(shapekit gen families | sort)
          scripts/select-repro.sh --check-chains
      - name: adapter protocol schema and docs are current
        run: shapekit harness schema
      - name: the release archive builds
        run: |
          shapekit corpus pack --out "$RUNNER_TEMP/dist"
          cat "$RUNNER_TEMP/dist/SHA256SUMS"
      - name: findings check, no drafts tolerated
        run: shapekit findings check
      - run: scripts/check-no-em-dash.sh
      # the private patterns name people and machines, so they come from a repository secret,
      # never from the tree. github gives no secrets to a pull request from a fork, so there the
      # step checks the generic patterns only and says the private ones were skipped
      - name: no machine-specific or personal text in tracked files
        env:
          TEXT_PATTERNS: ${{ secrets.SHAPEKIT_TEXT_PATTERNS }}
        run: |
          set -euo pipefail
          if [ -z "$TEXT_PATTERNS" ]; then
            echo "::notice title=public text check::the SHAPEKIT_TEXT_PATTERNS secret is not available to this run (a pull request from a fork, or a repository without the secret), so only the home directory and address patterns are checked; the private patterns are skipped"
            scripts/check-public-text.sh --locations
            exit 0
          fi
          umask 077
          printf '%s\n' "$TEXT_PATTERNS" >"$RUNNER_TEMP/text-patterns"
          SHAPEKIT_TEXT_PATTERNS="$RUNNER_TEMP/text-patterns" scripts/check-public-text.sh --locations
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - name: relative links and anchors of the tracked markdown
        # offline: an external site being down must not fail a pull request
        run: node scripts/check-links.ts --offline

  repro-select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ROTATION: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_number }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed.txt"
          # a push that creates a branch has an all-zero before sha; then only the rotation runs
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD >"$changed"
          else
            : >"$changed"
          fi
          echo "changed paths: $(wc -l <"$changed")"
          matrix=$(scripts/select-repro.sh "$ROTATION" "$changed")
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"

  repro:
    # regenerates the selected chains under both passphrases and compares them byte for byte
    needs: [build, repro-select]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.repro-select.outputs.matrix) }}
    name: repro (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: pull the pinned stellar-core image by digest
        run: docker pull --quiet "$(scripts/pin.sh image stellar-core)"
      - name: gen verify-repro
        env:
          FAMILIES: ${{ matrix.families }}
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          args=()
          for f in $FAMILIES; do args+=(--family "$f"); done
          "$RUNNER_TEMP/bin/shapekit" gen verify-repro --jobs 2 "${args[@]}"

  conformance:
    # current sdk versions only; the full version matrix and the reproductions run nightly. the
    # rust testee's clippy and test builds come on top of its conformance build
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      # the rust testee builds outside the workspace into its own target directory
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/testees/rust/30.0.0
          key: testee-rust-30.0.0-${{ hashFiles('testees/rust/versions/30.0.0/Cargo.lock') }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: "testees/go/**/*.sum"
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: testees/js/**/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: rustfmt, clippy and unit tests of the rust testee
        # the testee is outside the workspace, so the workspace's own checks never reach it
        run: |
          set -euo pipefail
          m=testees/rust/versions/30.0.0/Cargo.toml
          t=target/testees/rust/30.0.0
          rustfmt --edition 2024 --check testees/rust/src/*.rs
          cargo clippy --locked --all-targets --manifest-path "$m" --target-dir "$t" -- -D warnings
          cargo test --locked --manifest-path "$m" --target-dir "$t"
      - name: conformance run on rust 30.0.0, go v0.9.0, js 17.4.0
        # the sdks with their own jobs below are left out, so their toolchains are not needed here
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" conformance run --sdk rust --sdk go --sdk js
      - name: matrix to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f target/conformance/MATRIX.md ]; then cat target/conformance/MATRIX.md >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: conformance
          path: target/conformance/
          retention-days: 14

  soroban:
    # the soroban-sdk testee at its current version: rustfmt, clippy, unit tests, then the corpus
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/testees/soroban/29.0.1
          key: testee-soroban-29.0.1-${{ hashFiles('testees/soroban/versions/29.0.1/Cargo.lock') }}
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: rustfmt, clippy and unit tests of the soroban testee
        run: |
          set -euo pipefail
          m=testees/soroban/versions/29.0.1/Cargo.toml
          t=target/testees/soroban/29.0.1
          rustfmt --edition 2024 --check testees/soroban/src/*.rs testees/soroban/*.rs
          cargo clippy --locked --all-targets --manifest-path "$m" --target-dir "$t" -- -D warnings
          cargo test --locked --manifest-path "$m" --target-dir "$t"
      - name: conformance run on soroban-sdk 29.0.1
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" conformance run --sdk soroban --out target/conformance-soroban
      - name: matrix to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f target/conformance-soroban/MATRIX.md ]; then cat target/conformance-soroban/MATRIX.md >>"$GITHUB_STEP_SUMMARY"; fi

  dart:
    # the dart testee at stellar_flutter_sdk's current version: its conformance build, dart
    # analyze, its unit tests, then the corpus
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: pinned flutter for the dart testee
        run: scripts/flutter-toolchain.sh >>"$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: conformance run on stellar_flutter_sdk 3.12.0
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" conformance run --sdk dart --out target/conformance-dart
      - name: dart analyze and unit tests of the dart testee
        working-directory: target/testees/dart/3.12.0
        run: dart analyze --fatal-infos bin lib test tool && dart test
      - name: matrix to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f target/conformance-dart/MATRIX.md ]; then cat target/conformance-dart/MATRIX.md >>"$GITHUB_STEP_SUMMARY"; fi

  php:
    # the php testee at soneso/stellar-php-sdk's current version: its conformance build, its
    # unit checks, then the corpus
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, gmp, mbstring, sodium
          tools: composer:2.11.2
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: conformance run on soneso/stellar-php-sdk 1.18.0
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" conformance run --sdk php --out target/conformance-php
      - name: unit checks of the php testee
        run: php target/testees/php/1.18.0/tests/run.php
      - name: matrix to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f target/conformance-php/MATRIX.md ]; then cat target/conformance-php/MATRIX.md >>"$GITHUB_STEP_SUMMARY"; fi

  dotnet:
    # the dotnet testee at stellar-dotnet-sdk's current version: its build with warnings as
    # errors, then the corpus
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: conformance run on stellar-dotnet-sdk 17.0.0
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" conformance run --sdk dotnet --out target/conformance-dotnet
      - name: unit checks of the testee, on the build the run above made
        run: |
          set -euo pipefail
          v=$(python3 -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["sdk"]["dotnet"]["current"])' conformance/versions.toml)
          python3 -I testees/dotnet/tests/check.py "target/testees/dotnet/$v"
      - name: matrix to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f target/conformance-dotnet/MATRIX.md ]; then cat target/conformance-dotnet/MATRIX.md >>"$GITHUB_STEP_SUMMARY"; fi

  kmp:
    # the kmp testee (the jvm target of kmp-stellar-sdk) at its current version: the maven build
    # with warnings as errors and the resolved jars checked against lib.sha256, then the corpus,
    # its unit tests and the generated type table against what gentypes.py writes from the jar
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: testee-kmp-${{ hashFiles('testees/kmp/versions/*/pom.xml') }}
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: pinned jdk and maven
        # on PATH for the testee's java; maven runs through scripts/with-java.sh, which sets
        # JAVA_HOME to the pinned jdk. the runner's JAVA_HOME (jdk 17) stays, so this job also
        # checks that the build does not depend on it
        run: scripts/java-toolchain.sh >>"$GITHUB_PATH"
      - name: conformance run on the current version
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" conformance run --sdk kmp --out target/conformance-kmp
      - name: unit tests
        run: |
          set -euo pipefail
          v=$(python3 -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["sdk"]["kmp"]["current"])' conformance/versions.toml)
          scripts/with-java.sh mvn -B -q -f "testees/kmp/versions/$v/pom.xml" test
          python3 -I -m unittest discover -s testees/kmp/tests
      - name: type table
        run: |
          set -euo pipefail
          cd testees/kmp
          python3 -I gentypes.py
          git diff --exit-code -- src/main/kotlin/org/shapekit/testee/TypesGen.kt
      - name: matrix to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f target/conformance-kmp/MATRIX.md ]; then cat target/conformance-kmp/MATRIX.md >>"$GITHUB_STEP_SUMMARY"; fi

  stellar-cli:
    # the stellar-cli testee: rustfmt, clippy and unit tests of its wrapper, then the corpus through the
    # current release binary, fetched and checked against its pinned sha256 by the build steps
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/testees/stellar-cli/testee
          key: testee-stellar-cli-${{ hashFiles('testees/stellar-cli/Cargo.lock') }}
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: rustfmt, clippy and unit tests of the stellar-cli testee
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check testees/stellar-cli/src/*.rs
          cargo clippy --locked --all-targets --manifest-path testees/stellar-cli/Cargo.toml --target-dir target/testees/stellar-cli/testee -- -D warnings
          cargo test --locked --manifest-path testees/stellar-cli/Cargo.toml --target-dir target/testees/stellar-cli/testee
      - name: conformance run on the current stellar-cli
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          "$RUNNER_TEMP/bin/shapekit" conformance run --sdk stellar-cli --out target/conformance-stellar-cli
      - name: matrix to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f target/conformance-stellar-cli/MATRIX.md ]; then cat target/conformance-stellar-cli/MATRIX.md >>"$GITHUB_STEP_SUMMARY"; fi

  harness:
    # the wallet-backend reference adapter at the current pin, testnet variant, on the chains
    # behind the rfp's reproductions; every chain runs nightly
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: adapters/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: shapekit
          path: ${{ runner.temp }}/bin
      - name: pull the pinned database image by digest
        run: docker pull --quiet "$(scripts/pin.sh image timescaledb)"
      - name: build the adapter
        run: cd adapters && go build -o bin/wb-adapter ./walletbackend/cmd/wb-adapter
      - name: wallet-backend cache key, the pinned commit and its base image digests
        id: wb
        run: |
          set -euo pipefail
          pin=$(scripts/pin.sh git wallet-backend)
          bases=$(for n in wallet-backend-golang wallet-backend-debian wallet-backend-ubuntu; do
            scripts/pin.sh image "$n"
          done | sha256sum | cut -c1-16)
          echo "pin=$pin" >>"$GITHUB_OUTPUT"
          echo "key=wallet-backend-$pin-$bases" >>"$GITHUB_OUTPUT"
      - name: cached wallet-backend clone and image
        # the adapter's clone and the image it builds on the pinned bases (docker save output).
        # with a hit the run needs no network for wallet-backend; caches written by main's
        # pushes are visible to every pull request
        id: wb-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/shapekit/wallet-backend
            ${{ runner.temp }}/wallet-backend-image.tar
          key: ${{ steps.wb.outputs.key }}
      - name: load the cached wallet-backend image
        if: steps.wb-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/wallet-backend-image.tar"
      - name: harness run
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/bin/shapekit"
          pin=$(scripts/pin.sh git wallet-backend)
          "$RUNNER_TEMP/bin/shapekit" harness run \
            --adapter "adapters/bin/wb-adapter --commit $pin" \
            --network testnet --out harness-out \
            --chain cap40.signed-payload-signer.p30 \
            --chain cap73.sac-trust.p30 \
            --chain cap27.muxed-accounts.p30 \
            --expect crates/shapekit-harness/expect/wallet-backend-pr.toml
      - name: save the wallet-backend image for the cache
        if: ${{ !cancelled() && steps.wb-cache.outputs.cache-hit != 'true' }}
        env:
          PIN: ${{ steps.wb.outputs.pin }}
        run: |
          if docker image inspect "shapekit-wallet-backend:$PIN" >/dev/null 2>&1; then
            docker save --output "$RUNNER_TEMP/wallet-backend-image.tar" "shapekit-wallet-backend:$PIN"
          fi
      - name: report to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f harness-out/HARNESS.md ]; then cat harness-out/HARNESS.md >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: harness
          path: harness-out/
          retention-days: 14
