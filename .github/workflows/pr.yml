name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: "**/go.mod"
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: vet, test and lint each module in go.work
        run: |
          set -euo pipefail
          # golangci-lint and go vet both work per module, so walk the workspace
          # instead of hardcoding the list and missing a module added later
          for dir in $(go list -m -f '{{.Dir}}'); do
            echo "::group::$dir"
            (cd "$dir" && go vet ./... && go test ./... && golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml" ./...)
            echo "::endgroup::"
          done

  js:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: testees/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: testees/js/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc
      - run: node --test "dist/**/*.test.js"

  text:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-no-em-dash.sh
