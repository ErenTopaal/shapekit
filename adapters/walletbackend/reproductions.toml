# wallet-backend sightings reproduced by `shapekit harness reproduce --table adapters/walletbackend/reproductions.toml`.
# Commit pairs: the pre-fix commit is the parent of the fix's merge (for the rebase-merged
# #792, the commit before its first rebased commit). #716 has no single fix; its default pair
# is the parent of #693's merge and the current pin. The format is in docs/adapter-interface.md.

[adapter]
command = ["go", "-C", "adapters", "run", "./walletbackend/cmd/wb-adapter", "--commit", "{commit}"]

[[reproduction]]
id = "wallet-backend-729"
issue = "https://github.com/stellar/wallet-backend/pull/729"
chain = "cap40.signed-payload-signer.p28"
network = "testnet"
notes = "a SetOptions adding a P signer makes the persist COPY fail; ingestion retries ledger 65 forever"

[[reproduction.case]]
label = "pre-fix"
commit = "2a0a84ea12523b6c92e278c0c84b443041240095"
expect = [
  { entry = "cap40.signed-payload-signer.p28-set-options-payload-1-meta", verdict = "mishandled", reason = "halted" },
  { entry = "cap40.signed-payload-signer.p28-set-options-payload-4-meta", verdict = "not-evaluated" },
]

[[reproduction.case]]
label = "fixed"
commit = "2c873353c1f0f3c9b145e25a7d009023ad104a1c"
expect = [
  { entry = "cap40.signed-payload-signer.p28-set-options-payload-1-meta", verdict = "pass" },
  { entry = "cap40.signed-payload-signer.p28-set-options-payload-4-meta", verdict = "pass" },
]

